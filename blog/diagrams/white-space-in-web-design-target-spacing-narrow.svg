<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 592" width="380" height="592" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">WCAG 2.5.8: white space is a permitted substitute for target size</title>
  <desc id="d">Two panels. In the first, two undersized tap targets sit so close that the 24 pixel circles drawn around them intersect, which fails. In the second, the same targets are spaced so no circle touches another target or another circle, which passes at Level AA.</desc>

  <rect x="13" y="39" width="359" height="216" rx="16" fill="#EE3D41"/>
  <rect x="8" y="34" width="359" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="52" width="88" height="28" rx="14" fill="#0F1115"/>
  <text x="72" y="71" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FAILS</text>
  <text x="28" y="102" font-size="17" font-weight="700" fill="#0F1115">Targets too close</text>
  <circle cx="120" cy="152" r="42" fill="none" stroke="#EE3D41" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="178" cy="152" r="42" fill="none" stroke="#EE3D41" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="104" y="136" width="32" height="32" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <rect x="162" y="136" width="32" height="32" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="120" y="214" font-size="13" fill="#6A6F75" text-anchor="middle">24 px circle</text>
  <text x="28" y="238" font-size="13" fill="#5C6167">The circles intersect.</text>

  <rect x="13" y="271" width="359" height="216" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="266" width="359" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="284" width="146" height="28" rx="14" fill="#0F1115"/>
  <text x="101" y="303" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PASSES AT AA</text>
  <text x="28" y="334" font-size="17" font-weight="700" fill="#0F1115">Same targets, kept clear</text>
  <circle cx="110" cy="384" r="42" fill="none" stroke="#5FBFA8" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="250" cy="384" r="42" fill="none" stroke="#5FBFA8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="94" y="368" width="32" height="32" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <rect x="234" y="368" width="32" height="32" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="110" y="446" font-size="13" fill="#6A6F75" text-anchor="middle">24 px circle</text>
  <text x="28" y="470" font-size="13" fill="#5C6167">Nothing was resized. Only the space changed.</text>

  <rect x="13" y="507" width="359" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="502" width="359" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="528" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WCAG 2.2 SC 2.5.8, LEVEL AA</text>
  <text x="28" y="556" font-size="16" font-weight="700" fill="#0F1115">Space is a substitute for size.</text>
</svg>
