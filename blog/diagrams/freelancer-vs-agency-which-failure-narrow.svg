<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 582" width="380" height="582" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Freelancer or agency: which failure you can absorb</title>
  <desc id="d">One question decides it. If nothing much breaks when the work stops for two weeks, hire a freelancer; the work is one person's job and the steps can run in sequence. If a launch date, a campaign or a store is riding on it, hire an agency, because you are buying cover.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHICH FAILURE CAN YOU ABSORB?</text>

  <rect x="13" y="39" width="359" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="188" y="66" font-size="17" font-weight="700" fill="#0F1115" text-anchor="middle">What breaks if the work<tspan x="188" dy="1.3em">stops for two weeks?</tspan></text>

  <path d="M190 116 L190 134" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="147" width="359" height="140" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="142" width="359" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="160" width="132" height="28" rx="14" fill="#0F1115"/>
  <text x="94" y="179" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREELANCER</text>
  <text x="28" y="218" font-size="17" font-weight="700" fill="#0F1115">If nothing much breaks</text>
  <text x="28" y="246" font-size="15" fill="#5C6167">One person&#8217;s job, and the steps<tspan x="28" dy="1.4em">can run in sequence.</tspan></text>

  <rect x="13" y="303" width="359" height="160" rx="16" fill="#4A90C7"/>
  <rect x="8" y="298" width="359" height="160" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="316" width="104" height="28" rx="14" fill="#0F1115"/>
  <text x="80" y="335" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AGENCY</text>
  <text x="28" y="374" font-size="17" font-weight="700" fill="#0F1115">If it is a launch date,<tspan x="28" dy="1.3em">a campaign or a store</tspan></text>
  <text x="28" y="428" font-size="15" fill="#5C6167">Design, code and content<tspan x="28" dy="1.4em">have to run at once.</tspan></text>

  <rect x="13" y="483" width="359" height="90" rx="16" fill="#FDB914"/>
  <rect x="8" y="478" width="359" height="90" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="504" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE TEST FOR BOTH</text>
  <text x="28" y="530" font-size="16" font-weight="700" fill="#0F1115">Which named people do the<tspan x="28" dy="1.3em">work, and what is subcontracted?</tspan></text>
</svg>
