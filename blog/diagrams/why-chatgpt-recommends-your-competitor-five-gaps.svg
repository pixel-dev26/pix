<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" width="800" height="456" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The five gaps: the order you check them is not the order you fix them</title>
  <desc id="d">Five rows in diagnostic order — entity consistency, vouching, machine readability, positioning, answer-first pages — each carrying the position it holds in the fix order and the effort it takes. Entity is fixed first in an hour; answer-first pages second; readability third; vouching fourth; positioning last.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FIVE GAPS &#8212; CHECK IN ORDER, FIX OUT OF ORDER</text>
  <text x="72" y="40" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE GAP</text>
  <text x="300" y="40" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THE MACHINE CANNOT DO</text>
  <text x="568" y="40" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE FIX ORDER</text>

  <!-- Gap 1 -->
  <rect x="14" y="58" width="784" height="62" rx="16" fill="#FDB914"/>
  <rect x="8" y="52" width="784" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="40" cy="83" r="16" fill="#0F1115"/>
  <text x="40" y="89" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="72" y="89" font-size="17" font-weight="700" fill="#0F1115">Entity consistency</text>
  <text x="300" y="89" font-size="14" fill="#5C6167">It cannot confirm who you are</text>
  <rect x="568" y="68" width="76" height="30" rx="999" fill="#FDB914"/>
  <text x="606" y="88" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 1st</text>
  <text x="656" y="89" font-size="14" fill="#5C6167">One hour</text>

  <!-- Gap 2 -->
  <rect x="14" y="132" width="784" height="62" rx="16" fill="#D098F9"/>
  <rect x="8" y="126" width="784" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="40" cy="157" r="16" fill="#0F1115"/>
  <text x="40" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="72" y="163" font-size="17" font-weight="700" fill="#0F1115">Vouching</text>
  <text x="300" y="163" font-size="14" fill="#5C6167">Nobody else is vouching for you</text>
  <rect x="568" y="142" width="76" height="30" rx="999" fill="#D098F9"/>
  <text x="606" y="162" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 4th</text>
  <text x="656" y="163" font-size="14" fill="#5C6167">Ongoing</text>

  <!-- Gap 3 -->
  <rect x="14" y="206" width="784" height="62" rx="16" fill="#4A90C7"/>
  <rect x="8" y="200" width="784" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="40" cy="231" r="16" fill="#0F1115"/>
  <text x="40" y="237" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="72" y="237" font-size="17" font-weight="700" fill="#0F1115">Machine readability</text>
  <text x="300" y="237" font-size="14" fill="#5C6167">It cannot read your website</text>
  <rect x="568" y="216" width="76" height="30" rx="999" fill="#4A90C7"/>
  <text x="606" y="236" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 3rd</text>
  <text x="656" y="237" font-size="14" fill="#5C6167">Technical sprint</text>

  <!-- Gap 4 -->
  <rect x="14" y="280" width="784" height="62" rx="16" fill="#FA6B45"/>
  <rect x="8" y="274" width="784" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="40" cy="305" r="16" fill="#0F1115"/>
  <text x="40" y="311" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="72" y="311" font-size="17" font-weight="700" fill="#0F1115">Positioning</text>
  <text x="300" y="311" font-size="14" fill="#5C6167">Your positioning describes everyone</text>
  <rect x="568" y="290" width="76" height="30" rx="999" fill="#FA6B45"/>
  <text x="606" y="310" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 5th</text>
  <text x="656" y="311" font-size="14" fill="#5C6167">Deepest work</text>

  <!-- Gap 5 -->
  <rect x="14" y="354" width="784" height="62" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="348" width="784" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="40" cy="379" r="16" fill="#0F1115"/>
  <text x="40" y="385" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="72" y="385" font-size="17" font-weight="700" fill="#0F1115">Answer-first pages</text>
  <text x="300" y="385" font-size="14" fill="#5C6167">You never answer the question asked</text>
  <rect x="568" y="364" width="76" height="30" rx="999" fill="#5FBFA8"/>
  <text x="606" y="384" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 2nd</text>
  <text x="656" y="385" font-size="14" fill="#5C6167">2 to 4 weeks</text>

  <text x="8" y="444" font-size="14" font-weight="700" fill="#0F1115">Diagnose 1 to 5. Fix in the order of return: 1, 5, 3, 2, 4.</text>
</svg>
