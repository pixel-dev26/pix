  <circle cx="32" cy="521" r="3" fill="#8E959D"/>
  <text x="44" y="525" font-size="13" fill="#5C6167">Live chat support</text>

  <circle cx="198" cy="388" r="3" fill="#8E959D"/>
  <text x="210" y="392" font-size="13" fill="#5C6167">Testimonials</text>
  <circle cx="198" cy="407" r="3" fill="#8E959D"/>
  <text x="210" y="411" font-size="13" fill="#5C6167">Analytics</text>
  <circle cx="198" cy="426" r="3" fill="#8E959D"/>
  <text x="210" y="430" font-size="13" fill="#5C6167">About Us page</text>
  <circle cx="198" cy="445" r="3" fill="#8E959D"/>
  <text x="210" y="449" font-size="13" fill="#5C6167">Footer links</text>
