<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 566" width="380" height="566" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three grades of no-code lock-in, and what leaving costs</title>
  <desc id="d">Webflow offers code export but only on the Core Workspace plan at 19 dollars a month, so exporting is a subscription feature. Squarespace exports an .xml file for WordPress that leaves styles, custom CSS, store and portfolio pages behind. Bubble, Adalo, Glide and Softr run on the vendor's infrastructure, so there is no folder of code to take at all.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE EXIT, NOT THE BUILD</text>

  <rect x="13" y="39" width="359" height="138" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="138" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="112" height="25" rx="999" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="82" y="70" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">PAID EXPORT</text>
  <text x="152" y="71" font-size="17" font-weight="700" fill="#0F1115">Webflow</text>
  <text x="26" y="104" font-size="13" fill="#5C6167">Code export exists, on the Core<tspan x="26" dy="1.45em">Workspace plan at $19 a month.</tspan></text>
  <text x="26" y="152" font-size="14" font-weight="700" fill="#0F1115">A subscription feature</text>

  <rect x="13" y="197" width="359" height="138" rx="16" fill="#FA6B45"/>
  <rect x="8" y="192" width="359" height="138" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="210" width="136" height="25" rx="999" fill="#FA6B45" stroke="#0F1115" stroke-width="2"/>
  <text x="94" y="228" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">PARTIAL EXPORT</text>
  <text x="176" y="229" font-size="17" font-weight="700" fill="#0F1115">Squarespace</text>
  <text x="26" y="262" font-size="13" fill="#5C6167">An .xml file for WordPress. Styles,<tspan x="26" dy="1.45em">CSS, store and portfolio stay behind.</tspan></text>
  <text x="26" y="310" font-size="14" font-weight="700" fill="#0F1115">A rebuild, posts saved</text>

  <rect x="13" y="355" width="359" height="138" rx="16" fill="#EE3D41"/>
  <rect x="8" y="350" width="359" height="138" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="368" width="102" height="25" rx="999" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="77" y="386" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">NO EXPORT</text>
  <text x="142" y="387" font-size="17" font-weight="700" fill="#0F1115">App builders</text>
  <text x="26" y="420" font-size="13" fill="#5C6167">Bubble, Adalo, Glide and Softr run<tspan x="26" dy="1.45em">on the vendor's infrastructure.</tspan></text>
  <text x="26" y="468" font-size="14" font-weight="700" fill="#0F1115">Accept, or start again</text>

  <text x="8" y="524" font-size="14" font-weight="700" fill="#0F1115">The failure mode is never the build.<tspan x="8" dy="1.4em">It is the exit.</tspan></text>
</svg>
