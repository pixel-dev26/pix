<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 642" width="380" height="642" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three free resources doing three different jobs</title>
  <desc id="d">freeCodeCamp is the curriculum, The Odin Project supplies the order to learn things in, and MDN Web Docs is the reference. All three are free and together they are a complete front-end education. Pay for a platform only once you can name the gap it fills.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE FREE RESOURCES, THREE JOBS</text>

  <rect x="13" y="45" width="359" height="134" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="359" height="134" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="56" width="152" height="26" rx="999" fill="#5FBFA8"/>
  <text x="100" y="74" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">THE CURRICULUM</text>
  <rect x="290" y="56" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="321" y="74" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>
  <text x="24" y="110" font-size="18" font-weight="700" fill="#0F1115">freeCodeCamp</text>
  <text x="24" y="136" font-size="14" fill="#5C6167">The Responsive Web Design certification:<tspan x="24" dy="1.35em">semantic HTML, Flexbox and CSS Grid.</tspan></text>

  <rect x="13" y="191" width="359" height="134" rx="16" fill="#4A90C7"/>
  <rect x="8" y="186" width="359" height="134" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="202" width="112" height="26" rx="999" fill="#4A90C7"/>
  <text x="80" y="220" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">THE ORDER</text>
  <rect x="290" y="202" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="321" y="220" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>
  <text x="24" y="256" font-size="18" font-weight="700" fill="#0F1115">The Odin Project</text>
  <text x="24" y="282" font-size="14" fill="#5C6167">What to learn next, and in what order.<tspan x="24" dy="1.35em">Curated paths with projects between.</tspan></text>

  <rect x="13" y="337" width="359" height="134" rx="16" fill="#FDB914"/>
  <rect x="8" y="332" width="359" height="134" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="348" width="146" height="26" rx="999" fill="#FDB914"/>
  <text x="97" y="366" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">THE REFERENCE</text>
  <rect x="290" y="348" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="321" y="366" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>
  <text x="24" y="402" font-size="18" font-weight="700" fill="#0F1115">MDN Web Docs</text>
  <text x="24" y="428" font-size="14" fill="#5C6167">The closest thing to an official manual.<tspan x="24" dy="1.35em">Your reference, not your course.</tspan></text>

  <rect x="13" y="491" width="359" height="140" rx="16" fill="#FDB914"/>
  <rect x="8" y="486" width="359" height="140" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="514" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THEN, AND ONLY THEN</text>
  <text x="24" y="542" font-size="17" font-weight="700" fill="#0F1115">Pay once you can name<tspan x="24" dy="1.3em">the gap</tspan></text>
  <text x="24" y="592" font-size="13" fill="#5C6167">&#8220;I cannot get my head around CSS layout&#8221;<tspan x="24" dy="1.3em">is a gap. &#8220;I want to learn web design&#8221; is not.</tspan></text>
</svg>
