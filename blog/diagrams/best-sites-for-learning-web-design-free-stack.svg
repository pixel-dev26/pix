<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three free resources doing three different jobs</title>
  <desc id="d">freeCodeCamp is the curriculum, The Odin Project supplies the order to learn things in, and MDN Web Docs is the reference. All three are free and together they are a complete front-end education. Pay for a platform only once you can name the gap it fills.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE FREE RESOURCES, THREE DIFFERENT JOBS</text>

  <rect x="14" y="50" width="246" height="210" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="44" width="246" height="210" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="66" width="152" height="28" rx="999" fill="#5FBFA8"/>
  <text x="104" y="85" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">THE CURRICULUM</text>
  <text x="28" y="122" font-size="19" font-weight="700" fill="#0F1115">freeCodeCamp</text>
  <text x="28" y="154" font-size="14" fill="#5C6167">The Responsive Web Design<tspan x="28" dy="1.4em">certification: semantic HTML,</tspan><tspan x="28" dy="1.4em">forms, Flexbox and CSS Grid.</tspan></text>
  <rect x="28" y="212" width="64" height="26" rx="999" fill="#0F1115"/>
  <text x="60" y="230" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>

  <rect x="283" y="50" width="246" height="210" rx="16" fill="#4A90C7"/>
  <rect x="277" y="44" width="246" height="210" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="66" width="112" height="28" rx="999" fill="#4A90C7"/>
  <text x="353" y="85" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">THE ORDER</text>
  <text x="297" y="122" font-size="19" font-weight="700" fill="#0F1115">The Odin Project</text>
  <text x="297" y="154" font-size="14" fill="#5C6167">What to learn next, and in<tspan x="297" dy="1.4em">what order. Curated paths</tspan><tspan x="297" dy="1.4em">with projects between.</tspan></text>
  <rect x="297" y="212" width="64" height="26" rx="999" fill="#0F1115"/>
  <text x="329" y="230" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>

  <rect x="552" y="50" width="246" height="210" rx="16" fill="#FDB914"/>
  <rect x="546" y="44" width="246" height="210" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="66" width="146" height="28" rx="999" fill="#FDB914"/>
  <text x="639" y="85" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">THE REFERENCE</text>
  <text x="566" y="122" font-size="19" font-weight="700" fill="#0F1115">MDN Web Docs</text>
  <text x="566" y="154" font-size="14" fill="#5C6167">The closest thing the web<tspan x="566" dy="1.4em">has to an official manual.</tspan><tspan x="566" dy="1.4em">Reference, not course.</tspan></text>
  <rect x="566" y="212" width="64" height="26" rx="999" fill="#0F1115"/>
  <text x="598" y="230" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREE</text>

  <rect x="14" y="284" width="784" height="96" rx="16" fill="#FDB914"/>
  <rect x="8" y="278" width="784" height="96" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="306" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THEN, AND ONLY THEN</text>
  <text x="34" y="336" font-size="19" font-weight="700" fill="#0F1115">Pay for a platform once you can name the gap</text>
  <text x="34" y="360" font-size="14" fill="#5C6167">&#8220;I cannot get my head around CSS layout&#8221; is a gap. &#8220;I want to learn web design&#8221; is not.</text>

  <text x="8" y="410" font-size="14" font-weight="700" fill="#0F1115">Pay after you have hit a wall, not before.</text>
</svg>
