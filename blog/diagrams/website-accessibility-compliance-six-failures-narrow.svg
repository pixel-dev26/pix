<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 512" width="380" height="512" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The six failures that account for almost every detected accessibility error</title>
  <desc id="d">WebAIM's February 2026 test of the top one million home pages found 95.9 per cent had detected WCAG 2 failures. Low contrast text on 83.9 per cent of pages, missing image alt text 53.1 per cent, missing form input labels 51 per cent, empty links 46.3 per cent, empty buttons 30.6 per cent, missing document language 13.5 per cent.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WEBAIM, FEBRUARY 2026</text>

  <rect x="13" y="39" width="359" height="412" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="412" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="66" font-size="17" font-weight="700" fill="#0F1115">95.9% of home pages had<tspan x="26" dy="1.35em">detected WCAG 2 failures</tspan></text>
  <text x="26" y="120" font-size="13" fill="#5C6167">Six error types account for 96%<tspan x="26" dy="1.4em">of everything detected.</tspan></text>

  <text x="26" y="164" font-size="13" fill="#5C6167">Low contrast text</text>
  <rect x="26" y="172" width="252" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="288" y="188" font-size="13" font-weight="700" fill="#0F1115">83.9%</text>

  <text x="26" y="212" font-size="13" fill="#5C6167">Missing image alt text</text>
  <rect x="26" y="220" width="159" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="195" y="236" font-size="13" font-weight="700" fill="#0F1115">53.1%</text>

  <text x="26" y="260" font-size="13" fill="#5C6167">Missing form input labels</text>
  <rect x="26" y="268" width="153" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="189" y="284" font-size="13" font-weight="700" fill="#0F1115">51%</text>

  <text x="26" y="308" font-size="13" fill="#5C6167">Empty links</text>
  <rect x="26" y="316" width="139" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="175" y="332" font-size="13" font-weight="700" fill="#0F1115">46.3%</text>

  <text x="26" y="356" font-size="13" fill="#5C6167">Empty buttons</text>
  <rect x="26" y="364" width="92" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="128" y="380" font-size="13" font-weight="700" fill="#0F1115">30.6%</text>

  <text x="26" y="404" font-size="13" fill="#5C6167">Missing document language</text>
  <rect x="26" y="412" width="41" height="20" rx="6" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="77" y="428" font-size="13" font-weight="700" fill="#0F1115">13.5%</text>

  <text x="8" y="478" font-size="14" fill="#5C6167">None of these is a research problem.<tspan x="8" dy="1.4em">Every one is a property of the markup.</tspan></text>
</svg>
