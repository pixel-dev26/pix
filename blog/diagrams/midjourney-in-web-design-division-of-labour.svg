<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 434" width="800" height="434" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What Midjourney is for in a studio, and where it stops</title>
  <desc id="d">Two columns. Midjourney is good at imagery nobody has shot yet: hero photography that does not exist, textures and backgrounds, brand-adjacent visuals, mood boards, eight directions in the time for one. It is bad at anything with structure: type that is not type, buttons no thumb can hit, meaningless navigation, a grid that will not cut into components.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE HONEST DIVISION OF LABOUR</text>

  <!-- good at -->
  <rect x="14" y="46" width="380" height="272" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="380" height="272" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="96" height="26" rx="999" fill="#0F1115"/>
  <text x="76" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GOOD AT</text>
  <text x="28" y="114" font-size="18" font-weight="700" fill="#0F1115">Imagery nobody<tspan x="28" dy="1.3em">has shot yet</tspan></text>
  <path d="M28 154 L368 154" stroke="#E7E9EC" stroke-width="2"/>
  <circle cx="34" cy="173" r="3" fill="#8E959D"/>
  <text x="48" y="178" font-size="14" fill="#5C6167">Hero photography that does not exist</text>
  <circle cx="34" cy="199" r="3" fill="#8E959D"/>
  <text x="48" y="204" font-size="14" fill="#5C6167">Textures and backgrounds</text>
  <circle cx="34" cy="225" r="3" fill="#8E959D"/>
  <text x="48" y="230" font-size="14" fill="#5C6167">Abstract, brand-adjacent visuals</text>
  <circle cx="34" cy="251" r="3" fill="#8E959D"/>
  <text x="48" y="256" font-size="14" fill="#5C6167">Mood boards a client can point at</text>
  <circle cx="34" cy="277" r="3" fill="#8E959D"/>
  <text x="48" y="282" font-size="14" fill="#5C6167">Eight directions in the time for one</text>

  <!-- bad at -->
  <rect x="418" y="46" width="380" height="272" rx="16" fill="#EE3D41"/>
  <rect x="412" y="40" width="380" height="272" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="432" y="62" width="88" height="26" rx="999" fill="#0F1115"/>
  <text x="476" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">BAD AT</text>
  <text x="432" y="114" font-size="18" font-weight="700" fill="#0F1115">Anything with<tspan x="432" dy="1.3em">structure</tspan></text>
  <path d="M432 154 L772 154" stroke="#E7E9EC" stroke-width="2"/>
  <circle cx="438" cy="173" r="3" fill="#8E959D"/>
  <text x="452" y="178" font-size="14" fill="#5C6167">Type that is not type</text>
  <circle cx="438" cy="199" r="3" fill="#8E959D"/>
  <text x="452" y="204" font-size="14" fill="#5C6167">Buttons no thumb can hit</text>
  <circle cx="438" cy="225" r="3" fill="#8E959D"/>
  <text x="452" y="230" font-size="14" fill="#5C6167">Navigation that means nothing</text>
  <circle cx="438" cy="251" r="3" fill="#8E959D"/>
  <text x="452" y="256" font-size="14" fill="#5C6167">A grid that will not cut into components</text>
  <text x="432" y="290" font-size="14" font-weight="700" fill="#0F1115">It is generating pixels, not a layout system.</text>

  <!-- the handover -->
  <rect x="14" y="350" width="784" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="344" width="784" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="374" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE HANDOVER</text>
  <text x="34" y="402" font-size="16" font-weight="700" fill="#0F1115">Once a direction is chosen, the work starts again from a grid in a real design tool.</text>
</svg>
