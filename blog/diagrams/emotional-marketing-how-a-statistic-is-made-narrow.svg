<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 696" width="380" height="696" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a campaign statistic gets manufactured</title>
  <desc id="d">A real, narrow measurement is rounded up to a tidy number, re-scoped onto something much bigger, then handed the name of a publication that never ran it. Old Spice body wash sales were up 11 per cent over twelve months, 55 per cent over three months and 107 per cent over the previous month, per Nielsen reported by Adweek in July 2010. What circulates instead is a 125 per cent sales increase credited to The Guardian, which never published it.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">HOW A STATISTIC GETS MANUFACTURED</text>

  <rect x="13" y="39" width="359" height="56" rx="14" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="56" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="62" r="15" fill="#0F1115"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="67" font-size="14" font-weight="700" fill="#0F1115">A real, narrow measurement</text>

  <rect x="13" y="105" width="359" height="56" rx="14" fill="#FDB914"/>
  <rect x="8" y="100" width="359" height="56" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="128" r="15" fill="#0F1115"/>
  <text x="36" y="133" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="133" font-size="14" font-weight="700" fill="#0F1115">Rounded up to a tidy number</text>

  <rect x="13" y="171" width="359" height="56" rx="14" fill="#FA6B45"/>
  <rect x="8" y="166" width="359" height="56" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="194" r="15" fill="#0F1115"/>
  <text x="36" y="199" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="199" font-size="14" font-weight="700" fill="#0F1115">Re-scoped onto something bigger</text>

  <rect x="13" y="237" width="359" height="56" rx="14" fill="#EE3D41"/>
  <rect x="8" y="232" width="359" height="56" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="260" r="15" fill="#0F1115"/>
  <text x="36" y="265" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="265" font-size="14" font-weight="700" fill="#0F1115">Handed a masthead</text>

  <!-- worked example -->
  <rect x="13" y="313" width="359" height="160" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="308" width="359" height="160" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="334" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT IS DOCUMENTED</text>
  <text x="26" y="360" font-size="15" font-weight="700" fill="#0F1115">Old Spice body wash sales</text>
  <text x="26" y="386" font-size="13" fill="#5C6167">Up 11% over twelve months<tspan x="26" dy="1.5em">Up 55% over three months</tspan><tspan x="26" dy="1.5em">Up 107% over the previous month</tspan></text>
  <text x="26" y="454" font-size="13" fill="#6A6F75">Nielsen via Adweek, July 2010.</text>

  <rect x="13" y="493" width="359" height="144" rx="16" fill="#EE3D41"/>
  <rect x="8" y="488" width="359" height="144" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="514" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT CIRCULATES</text>
  <text x="26" y="540" font-size="15" font-weight="700" fill="#0F1115">&#8220;A 125% sales increase&#8221;</text>
  <text x="26" y="566" font-size="13" fill="#5C6167">Credited to The Guardian.</text>
  <text x="26" y="594" font-size="14" font-weight="700" fill="#EE3D41">The Guardian never ran it.</text>
  <text x="26" y="620" font-size="13" fill="#6A6F75">125% matches nothing documented.</text>

  <text x="8" y="664" font-size="14" fill="#5C6167">A round number is a warning. Real<tspan x="8" dy="1.4em">measurements are 11% and 55%.</tspan></text>
</svg>
