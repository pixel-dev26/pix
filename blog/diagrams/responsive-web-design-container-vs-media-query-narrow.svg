<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 484" width="380" height="484" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Why a component needs a container query, not a media query</title>
  <desc id="d">One window at one width holds a wide main column and a narrow sidebar. The same card sits in both: horizontal in the main column, stacked in the sidebar. A media query only knows the window width, so it gives both slots the same answer. A container query lets the component ask how much space it has been given.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE WIDTH, TWO SLOTS</text>

  <!-- the window -->
  <rect x="13" y="39" width="359" height="196" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="196" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="22" y="58" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SAME COMPONENT, TWICE</text>

  <!-- main column -->
  <rect x="22" y="70" width="196" height="146" rx="12" fill="#FFFFFF" stroke="#8E959D" stroke-width="2"/>
  <text x="34" y="90" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">MAIN</text>
  <rect x="39" y="105" width="172" height="104" rx="12" fill="#4A90C7"/>
  <rect x="34" y="100" width="172" height="104" rx="12" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="46" y="112" width="48" height="72" rx="6" fill="#E7E9EC" stroke="#8E959D" stroke-width="2"/>
  <rect x="104" y="116" width="76" height="10" rx="5" fill="#0F1115"/>
  <rect x="104" y="140" width="84" height="7" rx="3" fill="#E7E9EC"/>
  <rect x="104" y="154" width="76" height="7" rx="3" fill="#E7E9EC"/>
  <rect x="104" y="168" width="60" height="7" rx="3" fill="#E7E9EC"/>

  <!-- sidebar -->
  <rect x="232" y="70" width="121" height="146" rx="12" fill="#FFFFFF" stroke="#8E959D" stroke-width="2"/>
  <text x="244" y="90" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SIDEBAR</text>
  <rect x="249" y="105" width="97" height="104" rx="12" fill="#5FBFA8"/>
  <rect x="244" y="100" width="97" height="104" rx="12" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="254" y="112" width="77" height="34" rx="6" fill="#E7E9EC" stroke="#8E959D" stroke-width="2"/>
  <rect x="254" y="156" width="60" height="10" rx="5" fill="#0F1115"/>
  <rect x="254" y="176" width="77" height="7" rx="3" fill="#E7E9EC"/>
  <rect x="254" y="188" width="60" height="7" rx="3" fill="#E7E9EC"/>

  <!-- the two questions -->
  <rect x="13" y="259" width="359" height="98" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="254" width="359" height="98" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="272" width="134" height="26" rx="999" fill="#0F1115"/>
  <text x="93" y="290" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">MEDIA QUERY</text>
  <text x="26" y="320" font-size="15" fill="#5C6167">Asks how wide the <tspan font-weight="700" fill="#0F1115">window</tspan> is.<tspan x="26" dy="1.35em">One answer for both slots.</tspan></text>

  <rect x="13" y="377" width="359" height="98" rx="16" fill="#FDB914"/>
  <rect x="8" y="372" width="359" height="98" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="390" width="166" height="26" rx="999" fill="#0F1115"/>
  <text x="109" y="408" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTAINER QUERY</text>
  <text x="26" y="438" font-size="15" fill="#5C6167">Asks how much space <tspan font-weight="700" fill="#0F1115">it</tspan> has.<tspan x="26" dy="1.35em">A different answer in each.</tspan></text>
</svg>
