<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 596" width="380" height="596" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Fund the half of the project where the risk sits</title>
  <desc id="d">One question splits into two branches. If the risk is that nobody uses it — the site's job is to be found, read and enquired with — fund front-end and design first, with a thin content back-end behind it. If the risk is that it loses data or falls over — the site's job is to run a process that belongs to you — fund back-end engineering first and accept a plainer interface for one release.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHICH HALF DO YOU STAFF FIRST</text>

  <rect x="13" y="45" width="359" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="359" height="56" rx="16" fill="#0F1115"/>
  <text x="187" y="75" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Which failure hurts more?</text>

  <path d="M187 96 L187 118" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- branch A -->
  <rect x="13" y="129" width="359" height="200" rx="16" fill="#4A90C7"/>
  <rect x="8" y="124" width="359" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="150" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">IF THE RISK IS</text>
  <text x="26" y="178" font-size="17" font-weight="700" fill="#0F1115">Nobody uses it</text>
  <path d="M26 220 L354 220" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="244" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THEN FUND FIRST</text>
  <text x="26" y="270" font-size="16" font-weight="700" fill="#0F1115">Front-end and design</text>
  <text x="26" y="294" font-size="13" fill="#5C6167">The job is to be found, read<tspan x="26" dy="1.35em">and enquired with.</tspan></text>

  <text x="187" y="345" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="middle">OR</text>

  <!-- branch B -->
  <rect x="13" y="365" width="359" height="200" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="360" width="359" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="386" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">IF THE RISK IS</text>
  <text x="26" y="414" font-size="17" font-weight="700" fill="#0F1115">It loses data or<tspan x="26" dy="1.3em">falls over</tspan></text>
  <path d="M26 456 L354 456" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="480" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THEN FUND FIRST</text>
  <text x="26" y="506" font-size="16" font-weight="700" fill="#0F1115">Back-end engineering</text>
  <text x="26" y="530" font-size="13" fill="#5C6167">The job is to run a process<tspan x="26" dy="1.35em">that belongs to you.</tspan></text>

  <text x="8" y="586" font-size="14" font-weight="700" fill="#0F1115">Fund the half that carries the risk.</text>
</svg>
