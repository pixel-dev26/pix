<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The branding process is a schedule of decisions, cheapest first</title>
  <desc id="d">The eight stages run in order from strategy to advocacy, and a widening wedge beside them shows the cost of changing your mind rising as you go. A decision changed in stage one costs a meeting; the same decision in stage four costs a reprint, a rebuild and an apology.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">EIGHT STAGES, IN THE ORDER THEY HAVE TO HAPPEN</text>

  <path d="M278 48 L352 48 L792 376 L278 376 Z" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="300" y="352" font-size="15" font-weight="700" letter-spacing="1" fill="#0F1115">COST OF CHANGING YOUR MIND</text>

  <rect x="8" y="48" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="65" r="13" fill="#0F1115"/>
  <text x="33" y="70" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="58" y="70" font-size="15" font-weight="700" fill="#0F1115">Strategy</text>

  <rect x="8" y="90" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="107" r="13" fill="#0F1115"/>
  <text x="33" y="112" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="58" y="112" font-size="15" font-weight="700" fill="#0F1115">Identity</text>

  <rect x="8" y="132" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="149" r="13" fill="#0F1115"/>
  <text x="33" y="154" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="58" y="154" font-size="15" font-weight="700" fill="#0F1115">Messaging</text>

  <rect x="8" y="174" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="191" r="13" fill="#0F1115"/>
  <text x="33" y="196" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="58" y="196" font-size="15" font-weight="700" fill="#0F1115">Assets</text>

  <rect x="8" y="216" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="233" r="13" fill="#0F1115"/>
  <text x="33" y="238" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="58" y="238" font-size="15" font-weight="700" fill="#0F1115">Guidelines</text>

  <rect x="8" y="258" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="275" r="13" fill="#0F1115"/>
  <text x="33" y="280" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="58" y="280" font-size="15" font-weight="700" fill="#0F1115">Communication</text>

  <rect x="8" y="300" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="317" r="13" fill="#0F1115"/>
  <text x="33" y="322" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="58" y="322" font-size="15" font-weight="700" fill="#0F1115">Review</text>

  <rect x="8" y="342" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="33" cy="359" r="13" fill="#0F1115"/>
  <text x="33" y="364" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="58" y="364" font-size="15" font-weight="700" fill="#0F1115">Advocacy</text>

  <rect x="472" y="58" width="320" height="56" rx="16" fill="#5FBFA8"/>
  <rect x="466" y="52" width="320" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="488" y="78" font-size="15" font-weight="700" fill="#0F1115">Change it in stage 1 and</text>
  <text x="488" y="98" font-size="15" fill="#5C6167">it costs a meeting.</text>

  <rect x="566" y="170" width="226" height="80" rx="16" fill="#EE3D41"/>
  <rect x="560" y="164" width="226" height="80" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="582" y="192" font-size="15" font-weight="700" fill="#0F1115">Change it in stage 4:</text>
  <text x="582" y="214" font-size="14" fill="#5C6167">a reprint, a rebuild<tspan x="582" dy="1.4em">and an apology.</tspan></text>

  <text x="8" y="406" font-size="14" font-weight="700" fill="#0F1115">The order is compulsory. The depth is not.</text>
</svg>
