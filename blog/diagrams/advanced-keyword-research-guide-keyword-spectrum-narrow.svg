<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 574" width="380" height="574" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Head, body and long-tail terms are one spectrum</title>
  <desc id="d">Three stacked cards along a single spectrum. Head terms are one or two words with high recorded volume, brutal competition and vague intent. Body terms are three or four words with moderate volume and competition and legible intent. Long-tail terms are longer and specific, with low volume, low competition and the clearest intent.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE SPECTRUM, THREE SHAPES</text>

  <!-- head -->
  <rect x="13" y="39" width="359" height="126" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="126" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="50" width="76" height="26" rx="999" fill="#0F1115"/>
  <text x="64" y="68" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">HEAD</text>
  <text x="116" y="70" font-size="17" font-weight="700" fill="#0F1115">One or two words</text>
  <text x="26" y="98" font-size="14" fill="#6A6F75">&#8220;shoes&#8221;, &#8220;web design&#8221;</text>
  <text x="26" y="124" font-size="14" fill="#5C6167">High volume, brutal competition,<tspan x="26" dy="1.3em">vague intent</tspan></text>

  <!-- body -->
  <rect x="13" y="185" width="359" height="126" rx="16" fill="#FDB914"/>
  <rect x="8" y="180" width="359" height="126" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="196" width="76" height="26" rx="999" fill="#0F1115"/>
  <text x="64" y="214" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">BODY</text>
  <text x="116" y="216" font-size="17" font-weight="700" fill="#0F1115">Three or four words</text>
  <text x="26" y="244" font-size="14" fill="#6A6F75">&#8220;ecommerce web design&#8221;</text>
  <text x="26" y="270" font-size="14" fill="#5C6167">Moderate volume and competition,<tspan x="26" dy="1.3em">legible intent</tspan></text>

  <!-- long tail -->
  <rect x="13" y="331" width="359" height="126" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="326" width="359" height="126" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="342" width="108" height="26" rx="999" fill="#0F1115"/>
  <text x="80" y="360" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">LONG-TAIL</text>
  <text x="148" y="362" font-size="17" font-weight="700" fill="#0F1115">Longer, specific</text>
  <text x="26" y="390" font-size="14" fill="#6A6F75">&#8220;best running shoes for beginners&#8221;</text>
  <text x="26" y="416" font-size="14" fill="#5C6167">Low volume, low competition,<tspan x="26" dy="1.3em">the clearest intent of the three</tspan></text>

  <!-- the question that replaces the ratio -->
  <rect x="13" y="481" width="359" height="84" rx="16" fill="#FDB914"/>
  <rect x="8" y="476" width="359" height="84" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="502" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">INSTEAD OF A RATIO TO HIT</text>
  <text x="26" y="528" font-size="15" font-weight="700" fill="#0F1115">Can this page be the best answer<tspan x="26" dy="1.3em">on the internet to this question?</tspan></text>
</svg>
