<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 372" width="380" height="372" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Full-stack, back-end and front-end as declared developer roles</title>
  <desc id="d">Three bars from the Stack Overflow 2025 Developer Survey of 43,560 respondents: full-stack developer 27 per cent, back-end developer 14.2 per cent, front-end developer 4.3 per cent.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT 43,560 DEVELOPERS DO</text>

  <text x="8" y="50" font-size="16" font-weight="700" fill="#0F1115">Full-stack</text>
  <rect x="13" y="65" width="359" height="42" rx="16" fill="#FDB914"/>
  <rect x="8" y="60" width="359" height="42" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="87" font-size="16" font-weight="700" fill="#0F1115">27%</text>

  <text x="8" y="140" font-size="16" font-weight="700" fill="#0F1115">Back-end</text>
  <rect x="13" y="155" width="189" height="42" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="150" width="189" height="42" rx="16" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="177" font-size="16" font-weight="700" fill="#0F1115">14.2%</text>

  <text x="8" y="230" font-size="16" font-weight="700" fill="#0F1115">Front-end</text>
  <rect x="13" y="245" width="57" height="42" rx="16" fill="#4A90C7"/>
  <rect x="8" y="240" width="57" height="42" rx="16" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="76" y="267" font-size="16" font-weight="700" fill="#0F1115">4.3%</text>

  <text x="8" y="314" font-size="14" font-weight="700" fill="#0F1115">Full-stack came first. The split<tspan x="8" dy="1.35em">describes a syllabus, not a person.</tspan></text>
  <text x="8" y="364" font-size="13" fill="#6A6F75">Stack Overflow 2025 Developer Survey.</text>
</svg>
