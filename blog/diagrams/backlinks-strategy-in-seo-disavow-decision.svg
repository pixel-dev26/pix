<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 506" width="800" height="506" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">When to disavow a link, according to Google's own help page</title>
  <desc id="d">Google sets two conditions joined by AND: a considerable number of spammy, artificial or low-quality links point at your site, and those links have caused a manual action or are likely to. If both are true, disavow with caution. If not, do nothing — no quarterly audit and no precautionary disavow.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">GOOGLE&#8217;S DISAVOW HELP PAGE: TWO CONDITIONS, JOINED BY AND</text>

  <rect x="14" y="46" width="340" height="110" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="340" height="110" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">CONDITION 1</text>
  <text x="28" y="100" font-size="15" font-weight="700" fill="#0F1115">A considerable number of spammy,<tspan x="28" dy="1.3em">artificial or low-quality links.</tspan></text>

  <rect x="368" y="80" width="64" height="32" rx="999" fill="#0F1115"/>
  <text x="400" y="102" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AND</text>

  <rect x="458" y="46" width="340" height="110" rx="16" fill="#FDB914"/>
  <rect x="452" y="40" width="340" height="110" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="472" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">CONDITION 2</text>
  <text x="472" y="100" font-size="15" font-weight="700" fill="#0F1115">They have caused a manual action,<tspan x="472" dy="1.3em">or are likely to.</tspan></text>

  <path d="M178 158 L178 174 L622 174 L622 158" fill="none" stroke="#0F1115" stroke-width="2"/>
  <path d="M400 174 L400 196" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="215" y="206" width="382" height="56" rx="16" fill="#FDB914"/>
  <rect x="209" y="200" width="382" height="56" rx="16" fill="#0F1115"/>
  <text x="400" y="236" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Are both true?</text>

  <path d="M400 268 L400 286 M199 286 L601 286" fill="none" stroke="#0F1115" stroke-width="2"/>
  <path d="M199 286 L199 306" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M601 286 L601 306" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="14" y="318" width="382" height="150" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="312" width="382" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="346" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">IF NOT BOTH &#8212; ALMOST EVERY SITE</text>
  <text x="28" y="382" font-size="22" font-weight="700" fill="#0F1115">Do nothing</text>
  <text x="28" y="412" font-size="14" fill="#5C6167">Not a quarterly audit. Not a small<tspan x="28" dy="1.35em">precautionary disavow. Nothing.</tspan></text>

  <rect x="416" y="318" width="382" height="150" rx="16" fill="#EE3D41"/>
  <rect x="410" y="312" width="382" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="346" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">IF BOTH</text>
  <text x="430" y="382" font-size="22" font-weight="700" fill="#0F1115">Disavow, with caution</text>
  <text x="430" y="412" font-size="14" fill="#5C6167">Google warns that used incorrectly it<tspan x="430" dy="1.35em">can harm your performance in Search.</tspan></text>

  <text x="8" y="496" font-size="14" font-weight="700" fill="#0F1115">Google: in most cases it can assess which links to trust, so most sites will not need this tool.</text>
</svg>
