<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 586" width="380" height="586" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">POUR: WCAG's four principles, what goes wrong under each, and what to do</title>
  <desc id="d">Perceivable fails on informative images with no alt text; fix with text alternatives and real contrast. Operable fails on click-here links and hover-only menus; fix with keyboard operation, visible focus and 24 pixel targets. Understandable fails on jargon and errors shown only in red; fix with plain language and labelled fields. Robust fails on custom controls built from generic tags; fix with native elements and correct roles.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">FOUR PRINCIPLES, SHORTENED TO POUR</text>

  <!-- Perceivable -->
  <rect x="13" y="39" width="359" height="112" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="44" cy="64" r="15" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="70" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">P</text>
  <text x="70" y="70" font-size="17" font-weight="700" fill="#0F1115">Perceivable</text>
  <text x="26" y="100" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Goes wrong</tspan><tspan dx="7">Images with no alt text</tspan></text>
  <text x="26" y="126" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">What to do</tspan><tspan dx="7">Alt text, real contrast</tspan></text>

  <!-- Operable -->
  <rect x="13" y="163" width="359" height="112" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="158" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="44" cy="188" r="15" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="194" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">O</text>
  <text x="70" y="194" font-size="17" font-weight="700" fill="#0F1115">Operable</text>
  <text x="26" y="224" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Goes wrong</tspan><tspan dx="7">Hover-only menus</tspan></text>
  <text x="26" y="250" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">What to do</tspan><tspan dx="7">Keyboard, visible focus</tspan></text>

  <!-- Understandable -->
  <rect x="13" y="287" width="359" height="112" rx="16" fill="#4A90C7"/>
  <rect x="8" y="282" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="44" cy="312" r="15" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="318" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">U</text>
  <text x="70" y="318" font-size="17" font-weight="700" fill="#0F1115">Understandable</text>
  <text x="26" y="348" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Goes wrong</tspan><tspan dx="7">Errors shown only in red</tspan></text>
  <text x="26" y="374" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">What to do</tspan><tspan dx="7">Plain, labelled fields</tspan></text>

  <!-- Robust -->
  <rect x="13" y="411" width="359" height="112" rx="16" fill="#D098F9"/>
  <rect x="8" y="406" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="44" cy="436" r="15" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="442" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">R</text>
  <text x="70" y="442" font-size="17" font-weight="700" fill="#0F1115">Robust</text>
  <text x="26" y="472" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Goes wrong</tspan><tspan dx="7">Controls with no name</tspan></text>
  <text x="26" y="498" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">What to do</tspan><tspan dx="7">Native elements, roles</tspan></text>

  <text x="8" y="552" font-size="14" fill="#5C6167">You cannot make something usable<tspan x="8" dy="1.4em">for a person who cannot reach it.</tspan></text>
</svg>
