<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 410" width="380" height="410" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The competitive frame, written as three lines</title>
  <desc id="d">Three lines make a position: instead of what, naming the real alternative including doing nothing; better on which single axis, only one; and worse on what, naming the trade you are asking a customer to accept. The third line is the one that does the work.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">COMPARATIVE, OR NOTHING</text>

  <rect x="13" y="39" width="359" height="100" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="64" r="16" fill="#0F1115"/>
  <text x="38" y="70" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="66" y="70" font-size="17" font-weight="700" fill="#0F1115">Instead of what</text>
  <text x="24" y="100" font-size="13" fill="#5C6167">Name the real alternative, including doing<tspan x="24" dy="1.4em">nothing and the incumbent they know.</tspan></text>

  <rect x="13" y="155" width="359" height="100" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="150" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="180" r="16" fill="#0F1115"/>
  <text x="38" y="186" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="66" y="186" font-size="17" font-weight="700" fill="#0F1115">Better on one axis</text>
  <text x="24" y="216" font-size="13" fill="#5C6167">One. Claim three and you have claimed<tspan x="24" dy="1.4em">none, because none of them lands.</tspan></text>

  <rect x="13" y="271" width="359" height="100" rx="16" fill="#0F1115"/>
  <rect x="8" y="266" width="359" height="100" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="296" r="16" fill="#0F1115"/>
  <text x="38" y="302" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="66" y="302" font-size="17" font-weight="700" fill="#0F1115">Worse on what</text>
  <text x="24" y="332" font-size="13" fill="#0F1115">Name the trade you ask a customer to<tspan x="24" dy="1.4em">accept, or you have written a wish.</tspan></text>

  <text x="8" y="398" font-size="14" fill="#5C6167">The third line is the one that does the work.</text>
</svg>
