<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 564" width="380" height="564" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The framework support calendar, read on 30 July 2026</title>
  <desc id="d">Above, versions already out of support: AngularJS since January 2022, Vue 2 since 31 December 2023, Create React App since 14 February 2025, Laravel 11 since 12 March 2026, and Django 5.1 and earlier. Below, versions with a published end date: .NET 8 and 9 on 10 November 2026, Laravel 12 on 24 February 2027, Laravel 13 on 17 March 2028, Django 5.2 LTS in April 2028 and .NET 10 on 14 November 2028.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">READ 30 JULY 2026</text>

  <!-- out of support -->
  <rect x="13" y="39" width="359" height="232" rx="16" fill="#EE3D41"/>
  <rect x="8" y="34" width="359" height="232" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="52" width="170" height="28" rx="14" ry="14" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="109" y="71" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">OUT OF SUPPORT</text>
  <path d="M24 94 L351 94" stroke="#E7E9EC" stroke-width="2"/>

  <text x="24" y="118" font-size="14" font-weight="700" fill="#0F1115">AngularJS</text>
  <text x="351" y="118" font-size="14" fill="#5C6167" text-anchor="end">January 2022</text>
  <text x="24" y="150" font-size="14" font-weight="700" fill="#0F1115">Vue 2</text>
  <text x="351" y="150" font-size="14" fill="#5C6167" text-anchor="end">31 December 2023</text>
  <text x="24" y="182" font-size="14" font-weight="700" fill="#0F1115">Create React App</text>
  <text x="351" y="182" font-size="14" fill="#5C6167" text-anchor="end">14 February 2025</text>
  <text x="24" y="214" font-size="14" font-weight="700" fill="#0F1115">Laravel 11</text>
  <text x="351" y="214" font-size="14" fill="#5C6167" text-anchor="end">12 March 2026</text>
  <text x="24" y="246" font-size="14" font-weight="700" fill="#0F1115">Django 5.1 and earlier</text>
  <text x="351" y="246" font-size="14" fill="#5C6167" text-anchor="end">no fixes</text>

  <!-- supported until -->
  <rect x="13" y="295" width="359" height="232" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="290" width="359" height="232" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="308" width="176" height="28" rx="14" ry="14" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="112" y="327" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">SUPPORTED UNTIL</text>
  <path d="M24 350 L351 350" stroke="#E7E9EC" stroke-width="2"/>

  <text x="24" y="374" font-size="14" font-weight="700" fill="#0F1115">.NET 8 and .NET 9</text>
  <text x="351" y="374" font-size="14" fill="#5C6167" text-anchor="end">10 November 2026</text>
  <text x="24" y="406" font-size="14" font-weight="700" fill="#0F1115">Laravel 12</text>
  <text x="351" y="406" font-size="14" fill="#5C6167" text-anchor="end">24 February 2027</text>
  <text x="24" y="438" font-size="14" font-weight="700" fill="#0F1115">Laravel 13</text>
  <text x="351" y="438" font-size="14" fill="#5C6167" text-anchor="end">17 March 2028</text>
  <text x="24" y="470" font-size="14" font-weight="700" fill="#0F1115">Django 5.2 LTS</text>
  <text x="351" y="470" font-size="14" fill="#5C6167" text-anchor="end">April 2028</text>
  <text x="24" y="502" font-size="14" font-weight="700" fill="#0F1115">.NET 10, current LTS</text>
  <text x="351" y="502" font-size="14" fill="#5C6167" text-anchor="end">14 November 2028</text>

  <text x="8" y="552" font-size="14" fill="#5C6167">Node has no date. Put production on LTS.</text>
</svg>
