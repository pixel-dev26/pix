<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 552" width="380" height="552" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where AI website builders win, and the four places they break</title>
  <desc id="d">Two stacked panels. Builders win on prototypes and validation, simple presence sites and speed of iteration. They break on four fronts: everything looks the same, machines cannot read the output, you do not own it, and the cost curve crosses.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE WINS, FOUR BREAKS</text>

  <!-- where they win -->
  <rect x="13" y="39" width="359" height="206" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="206" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="120" height="25" rx="999" fill="#0F1115"/>
  <text x="86" y="70" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUILDERS WIN</text>

  <circle cx="34" cy="97" r="6" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="52" y="103" font-size="15" font-weight="700" fill="#0F1115">Prototypes and validation</text>
  <text x="52" y="123" font-size="13" fill="#5C6167">A test in a day, not six weeks</text>

  <circle cx="34" cy="142" r="6" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="52" y="148" font-size="15" font-weight="700" fill="#0F1115">Simple presence sites</text>
  <text x="52" y="168" font-size="13" fill="#5C6167">Hours, services, a contact form</text>

  <circle cx="34" cy="187" r="6" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="52" y="193" font-size="15" font-weight="700" fill="#0F1115">Speed of iteration</text>
  <text x="52" y="213" font-size="13" fill="#5C6167">Sections change in minutes</text>

  <!-- where they break -->
  <rect x="13" y="267" width="359" height="250" rx="16" fill="#EE3D41"/>
  <rect x="8" y="262" width="359" height="250" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="280" width="190" height="25" rx="999" fill="#0F1115"/>
  <text x="121" y="298" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOUR PLACES THEY BREAK</text>

  <circle cx="38" cy="325" r="12" fill="#0F1115"/>
  <text x="38" y="330" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="60" y="331" font-size="15" font-weight="700" fill="#0F1115">Everything looks the same</text>
  <text x="60" y="350" font-size="13" fill="#5C6167">One template, three businesses</text>

  <circle cx="38" cy="372" r="12" fill="#0F1115"/>
  <text x="38" y="377" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="60" y="378" font-size="15" font-weight="700" fill="#0F1115">Machines cannot read it</text>
  <text x="60" y="397" font-size="13" fill="#5C6167">Thin HTML, heavy JavaScript</text>

  <circle cx="38" cy="419" r="12" fill="#0F1115"/>
  <text x="38" y="424" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="60" y="425" font-size="15" font-weight="700" fill="#0F1115">You do not own it</text>
  <text x="60" y="444" font-size="13" fill="#5C6167">No full export on most platforms</text>

  <circle cx="38" cy="466" r="12" fill="#0F1115"/>
  <text x="38" y="471" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="60" y="472" font-size="15" font-weight="700" fill="#0F1115">The cost curve crosses</text>
  <text x="60" y="491" font-size="13" fill="#5C6167">Cheap on day one, not year two</text>

  <text x="8" y="540" font-size="14" font-weight="700" fill="#0F1115">A test: builder. A revenue channel: custom.</text>
</svg>
