<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Generating is free. Publishing is the gate.</title>
  <desc id="d">Three stages. Before the prompt, nobody builds for you: what you sell, who you are against, and what the page has to make somebody do. Generating is free on Wix and Squarespace, with 500 trial credits on Framer. Publishing is where the money starts: Squarespace requires a paid account to publish anything made with Blueprint AI, and Wix requires a Premium Plan for a custom domain or online payments.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">GENERATING IS FREE. PUBLISHING IS THE GATE.</text>

  <!-- 1 -->
  <rect x="14" y="46" width="240" height="214" rx="16" fill="#D098F9"/>
  <rect x="8" y="40" width="240" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="58" width="70" height="26" rx="999" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="63" y="76" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">YOURS</text>
  <text x="28" y="122" font-size="19" font-weight="700" fill="#0F1115">Before the prompt</text>
  <text x="28" y="152" font-size="13" fill="#5C6167">What you sell.<tspan x="28" dy="1.4em">Who you are against.</tspan><tspan x="28" dy="1.4em">What the page has to</tspan><tspan x="28" dy="1.4em">make somebody do.</tspan></text>
  <text x="28" y="238" font-size="12" fill="#6A6F75">No builder decides this.</text>

  <!-- 2 -->
  <rect x="286" y="46" width="240" height="214" rx="16" fill="#5FBFA8"/>
  <rect x="280" y="40" width="240" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="300" y="58" width="64" height="26" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="332" y="76" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">FREE</text>
  <text x="300" y="122" font-size="19" font-weight="700" fill="#0F1115">Generating</text>
  <text x="300" y="152" font-size="13" fill="#5C6167">Wix: build with AI free.<tspan x="300" dy="1.4em">Squarespace: Blueprint</tspan><tspan x="300" dy="1.4em">AI is free to use.</tspan><tspan x="300" dy="1.4em">Framer: 500 trial credits.</tspan></text>
  <text x="300" y="238" font-size="12" fill="#6A6F75">You pay to try nothing.</text>

  <!-- 3 -->
  <rect x="558" y="46" width="240" height="214" rx="16" fill="#EE3D41"/>
  <rect x="552" y="40" width="240" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="572" y="58" width="64" height="26" rx="999" fill="#EE3D41"/>
  <text x="604" y="76" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PAID</text>
  <text x="572" y="122" font-size="19" font-weight="700" fill="#0F1115">Publishing</text>
  <text x="572" y="152" font-size="13" fill="#5C6167">Squarespace: a paid<tspan x="572" dy="1.4em">account to publish at all.</tspan><tspan x="572" dy="1.4em">Wix: a Premium Plan for</tspan><tspan x="572" dy="1.4em">a domain or payments.</tspan></text>
  <text x="572" y="238" font-size="12" fill="#6A6F75">The gate is here.</text>

  <path d="M258 147 L274 147" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M530 147 L546 147" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- metered -->
  <rect x="14" y="280" width="784" height="90" rx="16" fill="#FDB914"/>
  <rect x="8" y="274" width="784" height="90" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="302" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AND THE AI ITSELF IS METERED</text>
  <text x="34" y="328" font-size="15" font-weight="700" fill="#0F1115">Squarespace: 10 one-time credits to 120 a month. Framer: 500 to try, 1,000 Basic, 3,000 Pro.</text>
  <text x="34" y="352" font-size="14" fill="#5C6167">Anything genuinely iterative burns an allowance faster than a pricing page implies.</text>
</svg>
