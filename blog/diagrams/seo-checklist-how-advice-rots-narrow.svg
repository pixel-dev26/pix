<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 584" width="380" height="584" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three ways SEO checklist advice stops being true</title>
  <desc id="d">Stale checklist items fall into three kinds: retired, where the tool or feature was switched off; renamed, where the same product has a new name; and never true, where the advice was wrong when it was written.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE WAYS ADVICE GOES WRONG</text>

  <!-- retired -->
  <rect x="13" y="39" width="359" height="156" rx="16" fill="#EE3D41"/>
  <rect x="8" y="34" width="359" height="156" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="50" width="92" height="26" rx="13" ry="13" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="70" y="68" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">RETIRED</text>
  <text x="24" y="96" font-size="13" fill="#5C6167">The tool or the feature was switched off.</text>
  <path d="M24 110 L351 110" stroke="#E7E9EC" stroke-width="2"/>
  <text x="24" y="134" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">First Input Delay</tspan> &#8594; INP, 12 Mar 2024</text>
  <text x="24" y="156" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Mobile-Friendly Test</tspan> &#8594; gone 1 Dec 2023</text>
  <text x="24" y="178" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">FAQ rich results</tspan> &#8594; stopped 7 May 2026</text>

  <!-- renamed -->
  <rect x="13" y="215" width="359" height="156" rx="16" fill="#4A90C7"/>
  <rect x="8" y="210" width="359" height="156" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="226" width="96" height="26" rx="13" ry="13" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="72" y="244" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">RENAMED</text>
  <text x="24" y="272" font-size="13" fill="#5C6167">Same product, new name and often a new URL.</text>
  <path d="M24 286 L351 286" stroke="#E7E9EC" stroke-width="2"/>
  <text x="24" y="310" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">EAT</tspan> &#8594; E-E-A-T since December 2022</text>
  <text x="24" y="332" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Google My Business</tspan> &#8594; Business Profile</text>
  <text x="24" y="354" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">AdWords</tspan> &#8594; Google Ads, renamed 2018</text>

  <!-- never true -->
  <rect x="13" y="391" width="359" height="156" rx="16" fill="#FDB914"/>
  <rect x="8" y="386" width="359" height="156" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="402" width="122" height="26" rx="13" ry="13" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="85" y="420" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">NEVER TRUE</text>
  <text x="24" y="448" font-size="13" fill="#5C6167">It was wrong on the day it was written.</text>
  <path d="M24 462 L351 462" stroke="#E7E9EC" stroke-width="2"/>
  <text x="24" y="486" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">LSI keywords</tspan> &#8594; Google never used them</text>
  <text x="24" y="508" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Short URLs rank better</tspan> &#8594; not a claim</text>
  <text x="24" y="530" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">Guest posts for links</tspan> &#8594; named as spam</text>

  <text x="8" y="572" font-size="14" fill="#5C6167">Not dishonest when written. Just never audited.</text>
</svg>
