<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" width="800" height="338" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Web design, web development, and the middle where the handoff happens</title>
  <desc id="d">Two clearly owned columns with a contested band between them. Design decides what a site looks like, says and asks a visitor to do. Development makes it exist and keep working. Between them sits the handoff — design to development, the feedback loop and joint problem-solving — which is where projects go wrong.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO ROLES, ONE BADLY MAPPED MIDDLE</text>

  <!-- design -->
  <rect x="14" y="58" width="246" height="240" rx="16" fill="#D098F9"/>
  <rect x="8" y="52" width="246" height="240" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="74" width="94" height="26" rx="999" fill="#D098F9"/>
  <text x="75" y="92" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">DESIGN</text>
  <text x="28" y="128" font-size="19" font-weight="700" fill="#0F1115">Web design</text>
  <text x="28" y="156" font-size="14" fill="#5C6167">Decides what it looks like,<tspan x="28" dy="1.4em">says, and asks you to do.</tspan></text>
  <path d="M28 194 L234 194" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="220" font-size="14" fill="#5C6167">Layout, hierarchy, contrast</text>
  <text x="28" y="244" font-size="14" fill="#5C6167">Typography and colour</text>
  <text x="28" y="268" font-size="14" fill="#5C6167">Wireframes and navigation</text>

  <!-- the middle -->
  <rect x="283" y="58" width="246" height="240" rx="16" fill="#0F1115"/>
  <rect x="277" y="52" width="246" height="240" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="74" width="122" height="26" rx="999" fill="#0F1115"/>
  <text x="358" y="92" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE MIDDLE</text>
  <text x="297" y="128" font-size="19" font-weight="700" fill="#0F1115">The handoff</text>
  <text x="297" y="156" font-size="14" fill="#0F1115">Where it happens properly,<tspan x="297" dy="1.4em">or quietly does not.</tspan></text>
  <path d="M297 194 L503 194" stroke="#0F1115" stroke-width="2"/>
  <text x="297" y="220" font-size="14" fill="#0F1115">Design to development</text>
  <text x="297" y="244" font-size="14" fill="#0F1115">Feedback loop</text>
  <text x="297" y="268" font-size="14" fill="#0F1115">Joint problem-solving</text>

  <!-- development -->
  <rect x="552" y="58" width="246" height="240" rx="16" fill="#4A90C7"/>
  <rect x="546" y="52" width="246" height="240" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="74" width="146" height="26" rx="999" fill="#4A90C7"/>
  <text x="639" y="92" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">DEVELOPMENT</text>
  <text x="566" y="128" font-size="19" font-weight="700" fill="#0F1115">Web development</text>
  <text x="566" y="156" font-size="14" fill="#5C6167">Makes it exist, and makes<tspan x="566" dy="1.4em">it keep working.</tspan></text>
  <path d="M566 194 L772 194" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="220" font-size="14" fill="#5C6167">Structure and markup</text>
  <text x="566" y="244" font-size="14" fill="#5C6167">Front end and back end</text>
  <text x="566" y="268" font-size="14" fill="#5C6167">Hosting, security, Git</text>

  <path d="M258 172 L272 172" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M542 172 L528 172" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <text x="8" y="326" font-size="14" font-weight="700" fill="#0F1115">Ask who owns the middle, and who decides when a design turns out to be expensive to build.</text>
</svg>
