<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 322" width="800" height="322" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The order a keyword is chosen in, with volume last</title>
  <desc id="d">Seven steps in sequence: name the intent, open the results page, ask what a click is worth, check business fit, judge whether you can win it, read cost per click as commercial temperature, and only then look at volume, difficulty and trend.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SEVEN STEPS, IN THE ORDER WE RUN THEM</text>

  <!-- row 1 -->
  <rect x="14" y="48" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="8" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="72" r="15" fill="#0F1115"/>
  <text x="38" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="110" font-size="15" font-weight="700" fill="#0F1115">Name the<tspan x="28" dy="1.3em">intent</tspan></text>

  <rect x="215" y="48" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="209" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="239" cy="72" r="15" fill="#0F1115"/>
  <text x="239" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="229" y="110" font-size="15" font-weight="700" fill="#0F1115">Open the<tspan x="229" dy="1.3em">results page</tspan></text>

  <rect x="416" y="48" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="410" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="440" cy="72" r="15" fill="#0F1115"/>
  <text x="440" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="430" y="110" font-size="15" font-weight="700" fill="#0F1115">What is a click<tspan x="430" dy="1.3em">worth here?</tspan></text>

  <rect x="617" y="48" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="611" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="641" cy="72" r="15" fill="#0F1115"/>
  <text x="641" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="631" y="110" font-size="15" font-weight="700" fill="#0F1115">Check business<tspan x="631" dy="1.3em">fit honestly</tspan></text>

  <path d="M191 89 L205 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 89 L406 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M593 89 L607 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <path d="M701 144 L701 162 L98 162 L98 178" fill="none" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- row 2 -->
  <rect x="14" y="188" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="8" y="182" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="212" r="15" fill="#0F1115"/>
  <text x="38" y="218" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="28" y="250" font-size="15" font-weight="700" fill="#0F1115">Can we<tspan x="28" dy="1.3em">win it?</tspan></text>

  <rect x="215" y="188" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="209" y="182" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="239" cy="212" r="15" fill="#0F1115"/>
  <text x="239" y="218" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="229" y="250" font-size="15" font-weight="700" fill="#0F1115">Read CPC as<tspan x="229" dy="1.3em">temperature</tspan></text>

  <rect x="416" y="188" width="382" height="94" rx="16" fill="#0F1115"/>
  <rect x="410" y="182" width="382" height="94" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="440" cy="212" r="15" fill="#0F1115"/>
  <text x="440" y="218" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="470" y="219" font-size="18" font-weight="700" fill="#0F1115">Volume, difficulty and trend</text>
  <text x="430" y="254" font-size="14" fill="#0F1115">A tie-breaker between shortlisted candidates.</text>

  <path d="M191 229 L205 229" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 229 L406 229" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <text x="8" y="310" font-size="14" fill="#5C6167">Volume is the fourth question, not the first &#8212; and on this list it is the seventh.</text>
</svg>
