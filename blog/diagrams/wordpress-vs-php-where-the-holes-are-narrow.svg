<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 546" width="380" height="546" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where WordPress vulnerabilities were found in 2025</title>
  <desc id="d">Patchstack logged 11,334 new WordPress ecosystem vulnerabilities in 2025, up 42 per cent year on year: 91 per cent in plugins, 9 per cent in themes and six in core. Of the total, 1,966 or 17 per cent were high severity, 46 per cent were unpatched when disclosed, and the median time from disclosure to first exploitation was five hours.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHERE THE HOLES ACTUALLY ARE</text>

  <rect x="13" y="39" width="359" height="362" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="362" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="62" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PATCHSTACK, 2026 REPORT</text>
  <text x="26" y="92" font-size="18" font-weight="700" fill="#0F1115">11,334 new vulnerabilities<tspan x="26" dy="1.3em">in 2025, up 42%</tspan></text>

  <rect x="26" y="134" width="294" height="36" rx="10" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="42" y="158" font-size="14" font-weight="700" fill="#0F1115">PLUGINS 91%</text>
  <rect x="320" y="134" width="29" height="36" rx="8" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="190" font-size="13" fill="#5C6167">Six in core, all low priority.</text>
  <text x="349" y="190" font-size="13" fill="#5C6167" text-anchor="end">themes 9%</text>

  <path d="M26 210 L349 210" stroke="#E7E9EC" stroke-width="2"/>

  <text x="26" y="236" font-size="20" font-weight="700" fill="#0F1115">1,966</text>
  <text x="130" y="236" font-size="13" fill="#5C6167">high severity, 17% of the total,<tspan x="130" dy="1.35em">a category up 113% in a year.</tspan></text>

  <text x="26" y="290" font-size="20" font-weight="700" fill="#0F1115">46%</text>
  <text x="130" y="290" font-size="13" fill="#5C6167">were still unpatched when<tspan x="130" dy="1.35em">they were disclosed publicly.</tspan></text>

  <text x="26" y="344" font-size="20" font-weight="700" fill="#0F1115">5 hours</text>
  <text x="130" y="344" font-size="13" fill="#5C6167">median from disclosure to<tspan x="130" dy="1.35em">first exploitation of the bugs</tspan><tspan x="130" dy="1.35em">attacked hardest.</tspan></text>

  <!-- the other 9 percent -->
  <rect x="13" y="427" width="359" height="110" rx="16" fill="#EE3D41"/>
  <rect x="8" y="422" width="359" height="110" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="450" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">AND THEN JULY 2026</text>
  <text x="26" y="476" font-size="15" font-weight="700" fill="#0F1115">Core produced a remote code<tspan x="26" dy="1.45em">execution chain of its own.</tspan></text>
  <text x="26" y="524" font-size="13" fill="#5C6167">7.0.2 forced auto-updates on affected branches.</text>
</svg>
