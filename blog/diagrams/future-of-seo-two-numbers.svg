<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The two numbers that describe what changed in search</title>
  <desc id="d">Left: people clicked a traditional result on 15 per cent of visits without an AI summary and 8 per cent of visits with one, and clicked links inside the summary on 1 per cent. Right: AI Overview citations that also rank in Google's top ten fell from about 76 per cent in July 2025 to 37.9 per cent in March 2026.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO NUMBERS TELL YOU WHAT IT COSTS YOU</text>

  <!-- clicks -->
  <rect x="14" y="46" width="380" height="272" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="380" height="272" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="70" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">PEW RESEARCH CENTER, JULY 2025</text>
  <text x="28" y="100" font-size="18" font-weight="700" fill="#0F1115">Clicks on a<tspan x="28" dy="1.3em">traditional result</tspan></text>

  <text x="28" y="156" font-size="13" fill="#5C6167">Without an AI summary</text>
  <text x="368" y="156" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">15% of visits</text>
  <rect x="28" y="162" width="280" height="18" rx="9" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>

  <text x="28" y="210" font-size="13" fill="#5C6167">With an AI summary</text>
  <text x="368" y="210" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">8% of visits</text>
  <rect x="28" y="216" width="149" height="18" rx="9" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <text x="28" y="264" font-size="13" fill="#5C6167">Links inside the summary</text>
  <text x="368" y="264" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">1% of visits</text>
  <rect x="28" y="270" width="19" height="18" rx="9" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <!-- citations -->
  <rect x="418" y="46" width="380" height="272" rx="16" fill="#FDB914"/>
  <rect x="412" y="40" width="380" height="272" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="432" y="70" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AHREFS, 863,000 KEYWORD SERPS</text>
  <text x="432" y="100" font-size="18" font-weight="700" fill="#0F1115">AI citations that also<tspan x="432" dy="1.3em">rank in the top 10</tspan></text>

  <text x="432" y="156" font-size="13" fill="#5C6167">July 2025</text>
  <text x="772" y="156" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">about 76%</text>
  <rect x="432" y="162" width="280" height="18" rx="9" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>

  <text x="432" y="210" font-size="13" fill="#5C6167">March 2026</text>
  <text x="772" y="210" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">37.9%</text>
  <rect x="432" y="216" width="140" height="18" rx="9" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <path d="M432 252 L772 252" stroke="#E7E9EC" stroke-width="2"/>
  <text x="432" y="280" font-size="14" fill="#5C6167">A page can be the answer without being<tspan x="432" dy="1.35em">a ranking.</tspan></text>

  <!-- the whole change -->
  <rect x="14" y="350" width="784" height="72" rx="16" fill="#0F1115"/>
  <rect x="8" y="344" width="784" height="72" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="374" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE WHOLE CHANGE, IN ONE LINE</text>
  <text x="34" y="402" font-size="17" font-weight="700" fill="#0F1115">Halve the clicks, and break the link between ranking and being quoted.</text>
</svg>
