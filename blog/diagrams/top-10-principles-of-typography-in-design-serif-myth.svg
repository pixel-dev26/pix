<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The serif-versus-sans readability rule has no study behind it</title>
  <desc id="d">On the left, the rule everyone repeats, with no measurement behind it: reading speed showed no effect of serifs at all. On the right, what the same body of work does show moves legibility: x-height, counter size, letter spacing and stroke width.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE MOST QUOTED RULE IN THE FIELD</text>

  <rect x="14" y="40" width="384" height="216" rx="16" fill="#EE3D41"/>
  <rect x="8" y="34" width="384" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="30" y="54" width="154" height="28" rx="14" fill="#0F1115"/>
  <text x="107" y="73" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">NOT MEASURED</text>
  <text x="30" y="124" font-size="19" font-weight="700" fill="#0F1115">Serifs read better in<tspan x="30" dy="1.3em">print, sans on screen</tspan></text>
  <text x="30" y="186" font-size="14" fill="#5C6167">Reading speed showed no effect of serifs<tspan x="30" dy="1.4em">at all, in either reading condition.</tspan><tspan x="30" dy="1.4em">Arditi and Cho, Vision Research, 2005.</tspan></text>

  <rect x="414" y="40" width="384" height="216" rx="16" fill="#5FBFA8"/>
  <rect x="408" y="34" width="384" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="430" y="54" width="118" height="28" rx="14" fill="#0F1115"/>
  <text x="489" y="73" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MEASURED</text>
  <text x="430" y="124" font-size="19" font-weight="700" fill="#0F1115">What actually moves legibility</text>

  <rect x="430" y="146" width="170" height="40" rx="12" fill="#5FBFA8"/>
  <text x="515" y="172" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">x-height</text>
  <rect x="612" y="146" width="170" height="40" rx="12" fill="#5FBFA8"/>
  <text x="697" y="172" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">counter size</text>
  <rect x="430" y="196" width="170" height="40" rx="12" fill="#5FBFA8"/>
  <text x="515" y="222" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">letter spacing</text>
  <rect x="612" y="196" width="170" height="40" rx="12" fill="#5FBFA8"/>
  <text x="697" y="222" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">stroke width</text>

  <rect x="14" y="280" width="784" height="80" rx="16" fill="#FDB914"/>
  <rect x="8" y="274" width="784" height="80" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="304" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SO WHY PICK A SERIF</text>
  <text x="34" y="334" font-size="18" font-weight="700" fill="#0F1115">For tone, which is a good reason. Just not a readability one.</text>
</svg>
