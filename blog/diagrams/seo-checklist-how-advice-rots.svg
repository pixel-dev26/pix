<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" width="800" height="332" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three ways SEO checklist advice stops being true</title>
  <desc id="d">Stale checklist items fall into three kinds: retired, where the tool or feature was switched off; renamed, where the same product has a new name; and never true, where the advice was wrong when it was written.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE WAYS A CHECKLIST GOES WRONG</text>

  <!-- retired -->
  <rect x="14" y="50" width="246" height="246" rx="16" fill="#EE3D41"/>
  <rect x="8" y="44" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="88" height="26" rx="13" ry="13" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="72" y="80" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">RETIRED</text>
  <text x="28" y="114" font-size="13" fill="#5C6167">The tool or the feature<tspan x="28" dy="1.3em">was switched off.</tspan></text>
  <path d="M28 148 L234 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="172" font-size="13" font-weight="700" fill="#0F1115">First Input Delay</text>
  <text x="28" y="189" font-size="13" fill="#5C6167">INP replaced it, 12 Mar 2024</text>
  <text x="28" y="217" font-size="13" font-weight="700" fill="#0F1115">Mobile-Friendly Test</text>
  <text x="28" y="234" font-size="13" fill="#5C6167">retired 1 December 2023</text>
  <text x="28" y="262" font-size="13" font-weight="700" fill="#0F1115">FAQ rich results</text>
  <text x="28" y="279" font-size="13" fill="#5C6167">stopped 7 May 2026</text>

  <!-- renamed -->
  <rect x="283" y="50" width="246" height="246" rx="16" fill="#4A90C7"/>
  <rect x="277" y="44" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="62" width="92" height="26" rx="13" ry="13" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="343" y="80" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">RENAMED</text>
  <text x="297" y="114" font-size="13" fill="#5C6167">Same product, new name,<tspan x="297" dy="1.3em">and often a new URL.</tspan></text>
  <path d="M297 148 L503 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="297" y="172" font-size="13" font-weight="700" fill="#0F1115">EAT</text>
  <text x="297" y="189" font-size="13" fill="#5C6167">E-E-A-T since December 2022</text>
  <text x="297" y="217" font-size="13" font-weight="700" fill="#0F1115">Google My Business</text>
  <text x="297" y="234" font-size="13" fill="#5C6167">Google Business Profile, 2021</text>
  <text x="297" y="262" font-size="13" font-weight="700" fill="#0F1115">AdWords</text>
  <text x="297" y="279" font-size="13" fill="#5C6167">Google Ads, renamed in 2018</text>

  <!-- never true -->
  <rect x="552" y="50" width="246" height="246" rx="16" fill="#FDB914"/>
  <rect x="546" y="44" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="62" width="116" height="26" rx="13" ry="13" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="624" y="80" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">NEVER TRUE</text>
  <text x="566" y="114" font-size="13" fill="#5C6167">It was wrong on the day<tspan x="566" dy="1.3em">it was written.</tspan></text>
  <path d="M566 148 L772 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="172" font-size="13" font-weight="700" fill="#0F1115">LSI keywords</text>
  <text x="566" y="189" font-size="13" fill="#5C6167">Google never used them</text>
  <text x="566" y="217" font-size="13" font-weight="700" fill="#0F1115">Shorter URLs rank better</text>
  <text x="566" y="234" font-size="13" fill="#5C6167">Google does not say this</text>
  <text x="566" y="262" font-size="13" font-weight="700" fill="#0F1115">Guest posts for the link</text>
  <text x="566" y="279" font-size="13" fill="#5C6167">named in the spam policy</text>

  <text x="8" y="322" font-size="14" fill="#5C6167">None of it was dishonest when it was written. It is what a checklist becomes when nobody audits it.</text>
</svg>
