<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Books about tools rot; books about judgement do not</title>
  <desc id="d">Two columns. On the left, books about tools carry a dateable expiry: Duckett's HTML and CSS from 2011 started expiring the day CSS grid shipped, and Building Progressive Web Apps from 2017 turned on a platform question iOS 16.4 answered in 2023. On the right, books about judgement do not expire: Grid Systems in Graphic Design from 1981, Design Systems from 2017 and Burn Your Portfolio from 2013 are all still in print.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE SPLIT IS NOT RANDOM</text>

  <!-- tools -->
  <rect x="14" y="50" width="382" height="340" rx="16" fill="#EE3D41"/>
  <rect x="8" y="44" width="382" height="340" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="66" width="210" height="30" rx="999" fill="#EE3D41"/>
  <text x="133" y="86" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">BOOKS ABOUT TOOLS</text>
  <text x="28" y="126" font-size="20" font-weight="700" fill="#0F1115">They rot, and on a date</text>
  <path d="M28 146 L370 146" stroke="#E7E9EC" stroke-width="2"/>

  <text x="28" y="178" font-size="15" font-weight="700" fill="#0F1115">HTML and CSS &#8212; 2011</text>
  <text x="28" y="200" font-size="13" fill="#5C6167">Started expiring the day CSS grid shipped.</text>

  <text x="28" y="250" font-size="15" font-weight="700" fill="#0F1115">Building Progressive Web Apps &#8212; 2017</text>
  <text x="28" y="272" font-size="13" fill="#5C6167">The platform question it hangs on was answered<tspan x="28" dy="1.3em">by iOS 16.4, six years after it went to print.</tspan></text>

  <rect x="28" y="310" width="342" height="60" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="334" font-size="14" font-weight="700" fill="#0F1115">The one question before buying:</text>
  <text x="44" y="356" font-size="14" fill="#0F1115">a syntax, or a way of deciding?</text>

  <!-- judgement -->
  <rect x="416" y="50" width="382" height="340" rx="16" fill="#5FBFA8"/>
  <rect x="410" y="44" width="382" height="340" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="430" y="66" width="248" height="30" rx="999" fill="#5FBFA8"/>
  <text x="554" y="86" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">BOOKS ABOUT JUDGEMENT</text>
  <text x="430" y="126" font-size="20" font-weight="700" fill="#0F1115">They do not</text>
  <path d="M430 146 L772 146" stroke="#E7E9EC" stroke-width="2"/>

  <text x="430" y="178" font-size="15" font-weight="700" fill="#0F1115">Grid Systems in Graphic Design &#8212; 1981</text>
  <text x="430" y="200" font-size="13" fill="#5C6167">Forty-five years old, still in print, and nothing<tspan x="430" dy="1.3em">in it has expired.</tspan></text>

  <text x="430" y="250" font-size="15" font-weight="700" fill="#0F1115">Design Systems &#8212; 2017</text>
  <text x="430" y="272" font-size="13" fill="#5C6167">Never revised. It has needed no second edition<tspan x="430" dy="1.3em">while every tool it might have named was replaced.</tspan></text>

  <text x="430" y="322" font-size="15" font-weight="700" fill="#0F1115">Burn Your Portfolio &#8212; 2013</text>
  <text x="430" y="344" font-size="13" fill="#5C6167">Still in print. None of it is about software.</text>

  <text x="8" y="420" font-size="14" font-weight="700" fill="#0F1115">Spend the budget on judgement, and read the syntax from whatever is current and free.</text>
</svg>
