<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What a first-place ranking now buys</title>
  <desc id="d">Pew found users clicked a traditional result on 15 per cent of searches without an AI summary, 8 per cent with one, and 1 per cent on links inside the summary. Ahrefs found the share of AI Overview citations that also rank in the top 10 fell from roughly 76 per cent in July 2025 to 37.9 per cent in March 2026.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO MEASUREMENTS, ONE DIRECTION</text>

  <!-- Pew -->
  <rect x="14" y="46" width="382" height="262" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="382" height="262" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">PEW RESEARCH CENTER, MARCH 2025</text>
  <text x="28" y="94" font-size="17" font-weight="700" fill="#0F1115">Clicks on a traditional result</text>

  <text x="28" y="126" font-size="13" fill="#5C6167">No AI summary on the page</text>
  <rect x="28" y="134" width="260" height="20" rx="6" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="298" y="150" font-size="14" font-weight="700" fill="#0F1115">15%</text>

  <text x="28" y="178" font-size="13" fill="#5C6167">An AI summary on the page</text>
  <rect x="28" y="186" width="139" height="20" rx="6" fill="#FA6B45" stroke="#0F1115" stroke-width="2"/>
  <text x="177" y="202" font-size="14" font-weight="700" fill="#0F1115">8%</text>

  <text x="28" y="230" font-size="13" fill="#5C6167">Links inside the summary</text>
  <rect x="28" y="238" width="17" height="20" rx="4" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="55" y="254" font-size="14" font-weight="700" fill="#0F1115">1%</text>

  <text x="28" y="286" font-size="12" fill="#6A6F75">900 US adults, 68,879 real searches</text>

  <!-- Ahrefs -->
  <rect x="416" y="46" width="382" height="262" rx="16" fill="#5FBFA8"/>
  <rect x="410" y="40" width="382" height="262" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AHREFS, 863,000 KEYWORD SERPS</text>
  <text x="430" y="94" font-size="17" font-weight="700" fill="#0F1115">AI Overview citations that<tspan x="430" dy="1.35em">also rank in the top 10</tspan></text>

  <text x="500" y="186" font-size="38" font-weight="700" fill="#0F1115" text-anchor="middle">~76%</text>
  <text x="700" y="186" font-size="38" font-weight="700" fill="#EE3D41" text-anchor="middle">37.9%</text>
  <path d="M568 174 L616 174" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="212" font-size="13" fill="#5C6167" text-anchor="middle">July 2025</text>
  <text x="700" y="212" font-size="13" fill="#5C6167" text-anchor="middle">March 2026</text>

  <text x="430" y="258" font-size="14" fill="#5C6167">Ranking and getting quoted<tspan x="430" dy="1.4em">have come apart.</tspan></text>

  <!-- the conclusion -->
  <rect x="14" y="334" width="784" height="62" rx="16" fill="#FDB914"/>
  <rect x="8" y="328" width="784" height="62" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="354" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">PUT THE TWO TOGETHER</text>
  <text x="34" y="378" font-size="15" font-weight="700" fill="#0F1115">Fewer clicks per ranking, and no guarantee of a place inside the AI answer.</text>
</svg>
