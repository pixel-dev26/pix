<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The Answer-Ready Website: two audiences, three jobs</title>
  <desc id="d">One site serving AI systems that read, trust and quote it, and the humans who arrive from those answers. Its three jobs are citation source, feeding clear structured quotable answers to machines; verification layer, letting buyers who heard about you from ChatGPT confirm you are real; and agent interface, giving agents the hard facts they scan for.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE ANSWER-READY WEBSITE &#8212; TWO AUDIENCES, ONE SITE</text>

  <rect x="8" y="34" width="382" height="40" rx="999" fill="#0F1115"/>
  <text x="199" y="59" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI systems that read, trust and quote it</text>
  <rect x="410" y="34" width="382" height="40" rx="999" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="601" y="59" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">Humans who arrive and have to convert</text>

  <!-- job 1 -->
  <rect x="14" y="110" width="246" height="164" rx="16" fill="#0F1115"/>
  <rect x="8" y="104" width="246" height="164" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="122" width="110" height="24" rx="999" fill="#0F1115"/>
  <text x="83" y="139" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR MACHINES</text>
  <text x="28" y="178" font-size="18" font-weight="700" fill="#0F1115">Citation source</text>
  <text x="28" y="208" font-size="13" fill="#5C6167">Clear, structured, quotable<tspan x="28" dy="1.4em">answers, so your brand</tspan><tspan x="28" dy="1.4em">appears in recommendations.</tspan></text>

  <!-- job 2 -->
  <rect x="283" y="110" width="246" height="164" rx="16" fill="#FDB914"/>
  <rect x="277" y="104" width="246" height="164" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="122" width="96" height="24" rx="999" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="139" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">FOR HUMANS</text>
  <text x="297" y="178" font-size="18" font-weight="700" fill="#0F1115">Verification layer</text>
  <text x="297" y="208" font-size="13" fill="#5C6167">Buyers who heard about you<tspan x="297" dy="1.4em">from ChatGPT still visit to</tspan><tspan x="297" dy="1.4em">confirm that you are real.</tspan></text>

  <!-- job 3 -->
  <rect x="552" y="110" width="246" height="164" rx="16" fill="#0F1115"/>
  <rect x="546" y="104" width="246" height="164" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="122" width="110" height="24" rx="999" fill="#0F1115"/>
  <text x="621" y="139" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR MACHINES</text>
  <text x="566" y="178" font-size="18" font-weight="700" fill="#0F1115">Agent interface</text>
  <text x="566" y="208" font-size="13" fill="#5C6167">Agents scan for hard facts:<tspan x="566" dy="1.4em">what you do, what it costs,</tspan><tspan x="566" dy="1.4em">proof that it works.</tspan></text>

  <!-- the gap -->
  <rect x="14" y="294" width="784" height="90" rx="16" fill="#FA6B45"/>
  <rect x="8" y="288" width="784" height="90" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="316" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHERE MOST SITES FAIL</text>
  <text x="34" y="342" font-size="15" font-weight="700" fill="#0F1115">Adobe&#8217;s readability scan: home pages 75%, category pages 74%, product pages 66%.</text>
  <text x="34" y="366" font-size="14" fill="#5C6167">The money pages are the least machine-readable of all.</text>
</svg>
