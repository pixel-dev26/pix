<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 578" width="380" height="578" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Theme update dates against the WordPress release they claim to support</title>
  <desc id="d">WordPress 7.0 was released on 20 May 2026. Iteck last changed its files on 28 September 2025, Spring on 7 January 2026 and Softwerk on 3 February 2026, and all three declare WordPress 7.0.x support. Engitech last changed its files on 4 April 2026 and honestly stops at 6.9.x. Stratus shipped on 21 May 2026, the day after 7.0.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT A 7.0 COMPATIBLE CLAIM IS WORTH</text>

  <rect x="13" y="45" width="359" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="359" height="56" rx="16" fill="#0F1115"/>
  <text x="187" y="68" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">WordPress 7.0</text>
  <text x="187" y="88" font-size="13" fill="#FFFFFF" text-anchor="middle">released 20 May 2026</text>

  <text x="8" y="128" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TOUCHED BEFORE IT EXISTED</text>

  <rect x="13" y="145" width="359" height="56" rx="16" fill="#EE3D41"/>
  <rect x="8" y="140" width="359" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="166" font-size="15" font-weight="700" fill="#0F1115">Iteck</text>
  <text x="24" y="186" font-size="13" fill="#5C6167">28 Sep 2025</text>
  <rect x="232" y="156" width="120" height="26" rx="999" fill="#EE3D41"/>
  <text x="292" y="174" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="13" y="211" width="359" height="56" rx="16" fill="#EE3D41"/>
  <rect x="8" y="206" width="359" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="232" font-size="15" font-weight="700" fill="#0F1115">Spring</text>
  <text x="24" y="252" font-size="13" fill="#5C6167">7 Jan 2026</text>
  <rect x="232" y="222" width="120" height="26" rx="999" fill="#EE3D41"/>
  <text x="292" y="240" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="13" y="277" width="359" height="56" rx="16" fill="#EE3D41"/>
  <rect x="8" y="272" width="359" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="298" font-size="15" font-weight="700" fill="#0F1115">Softwerk</text>
  <text x="24" y="318" font-size="13" fill="#5C6167">3 Feb 2026</text>
  <rect x="232" y="288" width="120" height="26" rx="999" fill="#EE3D41"/>
  <text x="292" y="306" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="13" y="343" width="359" height="56" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="338" width="359" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="364" font-size="15" font-weight="700" fill="#0F1115">Engitech</text>
  <text x="24" y="384" font-size="13" fill="#5C6167">4 Apr 2026</text>
  <rect x="232" y="354" width="120" height="26" rx="999" fill="#5FBFA8"/>
  <text x="292" y="372" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Stops at 6.9</text>

  <text x="8" y="428" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TOUCHED AFTER</text>

  <rect x="13" y="445" width="359" height="76" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="440" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="466" font-size="16" font-weight="700" fill="#0F1115">Stratus</text>
  <text x="24" y="488" font-size="13" fill="#5C6167">21 May 2026</text>
  <text x="24" y="508" font-size="13" fill="#5C6167">The day after 7.0 shipped.</text>
  <rect x="232" y="458" width="120" height="26" rx="999" fill="#5FBFA8"/>
  <text x="292" y="476" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <text x="8" y="548" font-size="14" font-weight="700" fill="#0F1115">Three declare support for a release<tspan x="8" dy="1.35em">that did not exist when they shipped.</tspan></text>
</svg>
