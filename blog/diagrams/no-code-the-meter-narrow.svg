<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 566" width="380" height="566" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The no-code sticker price is a floor; the meters sit on top of it</title>
  <desc id="d">A stack. At the bottom, your monthly plan, the price on the pricing page. Stacked above it: workload units on Bubble, extra editors at 20 dollars a month on Framer and 5 dollars a user on Glide, bandwidth blocks at 20 dollars per 50 GB on Webflow, and tasks and credits on Zapier, Make and Softr. Your bill becomes a function of your traffic.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE STICKER PRICE IS THE FLOOR</text>

  <rect x="8" y="34" width="359" height="44" rx="10" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="62" font-size="13" fill="#0F1115">+ Tasks, credits &#8212; Zapier, Make, Softr</text>

  <rect x="8" y="86" width="359" height="44" rx="10" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="114" font-size="13" fill="#0F1115">+ Bandwidth &#8212; Webflow $20 per 50 GB</text>

  <rect x="8" y="138" width="359" height="44" rx="10" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="166" font-size="13" fill="#0F1115">+ Editors &#8212; Framer $20/mo, Glide $5/user</text>

  <rect x="8" y="190" width="359" height="44" rx="10" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="218" font-size="13" fill="#0F1115">+ Workload units &#8212; Bubble</text>

  <rect x="8" y="242" width="359" height="44" rx="10" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="270" font-size="13" font-weight="700" fill="#0F1115">Your monthly plan, the sticker price</text>

  <rect x="13" y="311" width="359" height="210" rx="16" fill="#FDB914"/>
  <rect x="8" y="306" width="359" height="210" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="334" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THAT MEANS</text>
  <text x="26" y="360" font-size="15" font-weight="700" fill="#0F1115">Your bill is a function of<tspan x="26" dy="1.35em">your traffic.</tspan></text>
  <text x="26" y="414" font-size="13" fill="#5C6167">The successful version of your project<tspan x="26" dy="1.45em">costs more than the failed one.</tspan></text>
  <path d="M26 452 L349 452" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="476" font-size="13" fill="#5C6167">Adalo is the counterexample: it markets<tspan x="26" dy="1.45em">flat pricing, no usage-based charges.</tspan></text>

  <text x="8" y="550" font-size="14" font-weight="700" fill="#0F1115">Compare three years, not one month.</text>
</svg>
