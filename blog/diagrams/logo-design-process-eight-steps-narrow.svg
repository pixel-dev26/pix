<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 560" width="380" height="560" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The eight-step logo design process</title>
  <desc id="d">Eight numbered stages in two columns: understand the brand, gather inspiration, sketch and conceptualise, feedback and iteration, digital rendering, typography and colours, scalability and versatility, finalise and deliver. Feedback loops back to sketching.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">EIGHT STAGES, ONE LOOP</text>

  <!-- 1 -->
  <rect x="13" y="39" width="172" height="96" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="62" r="14" fill="#0F1115"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="24" y="99" font-size="15" font-weight="700" fill="#0F1115">Understand<tspan x="24" dy="1.3em">the brand</tspan></text>
  <!-- 2 -->
  <rect x="205" y="39" width="172" height="96" rx="16" fill="#FDB914"/>
  <rect x="200" y="34" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="62" r="14" fill="#0F1115"/>
  <text x="228" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="216" y="99" font-size="15" font-weight="700" fill="#0F1115">Gather<tspan x="216" dy="1.3em">inspiration</tspan></text>

  <!-- 3 -->
  <rect x="13" y="159" width="172" height="96" rx="16" fill="#FDB914"/>
  <rect x="8" y="154" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="182" r="14" fill="#0F1115"/>
  <text x="36" y="187" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="24" y="219" font-size="15" font-weight="700" fill="#0F1115">Sketch and<tspan x="24" dy="1.3em">conceptualise</tspan></text>
  <!-- 4 -->
  <rect x="205" y="159" width="172" height="96" rx="16" fill="#EE3D41"/>
  <rect x="200" y="154" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="182" r="14" fill="#0F1115"/>
  <text x="228" y="187" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="216" y="219" font-size="15" font-weight="700" fill="#0F1115">Feedback and<tspan x="216" dy="1.3em">iteration</tspan></text>

  <text x="190" y="277" font-size="13" font-weight="700" fill="#EE3D41" text-anchor="middle">4 loops back to 3 until it holds</text>

  <!-- 5 -->
  <rect x="13" y="300" width="172" height="96" rx="16" fill="#4A90C7"/>
  <rect x="8" y="295" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="323" r="14" fill="#0F1115"/>
  <text x="36" y="328" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="24" y="360" font-size="15" font-weight="700" fill="#0F1115">Digital<tspan x="24" dy="1.3em">rendering</tspan></text>
  <!-- 6 -->
  <rect x="205" y="300" width="172" height="96" rx="16" fill="#4A90C7"/>
  <rect x="200" y="295" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="323" r="14" fill="#0F1115"/>
  <text x="228" y="328" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="216" y="360" font-size="15" font-weight="700" fill="#0F1115">Typography<tspan x="216" dy="1.3em">and colours</tspan></text>

  <!-- 7 -->
  <rect x="13" y="420" width="172" height="96" rx="16" fill="#4A90C7"/>
  <rect x="8" y="415" width="172" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="443" r="14" fill="#0F1115"/>
  <text x="36" y="448" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="24" y="480" font-size="15" font-weight="700" fill="#0F1115">Scalability and<tspan x="24" dy="1.3em">versatility</tspan></text>
  <!-- 8 -->
  <rect x="205" y="420" width="172" height="96" rx="16" fill="#0F1115"/>
  <rect x="200" y="415" width="172" height="96" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="443" r="14" fill="#0F1115"/>
  <text x="228" y="448" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="216" y="480" font-size="15" font-weight="700" fill="#0F1115">Finalise and<tspan x="216" dy="1.3em">deliver</tspan></text>

  <text x="8" y="546" font-size="14" fill="#5C6167">Step 4 repeats. After it, execution.</text>
</svg>
