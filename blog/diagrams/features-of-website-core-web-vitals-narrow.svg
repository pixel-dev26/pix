<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="380" height="490" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The three Core Web Vitals and their published good thresholds</title>
  <desc id="d">Largest Contentful Paint within 2.5 seconds, Interaction to Next Paint at 200 milliseconds or less, Cumulative Layout Shift at 0.1 or less. Each is measured at the 75th percentile of real page loads, not on studio wi-fi. First Input Delay is gone; INP replaced it on 12 March 2024.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PUBLISHED THRESHOLDS</text>

  <rect x="13" y="39" width="359" height="78" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="78" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="60" height="25" rx="999" fill="#0F1115"/>
  <text x="56" y="70" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LCP</text>
  <text x="341" y="76" font-size="26" font-weight="700" fill="#0F1115" text-anchor="end">2.5s</text>
  <text x="26" y="100" font-size="13" fill="#5C6167">Largest Contentful Paint, or faster</text>

  <rect x="13" y="133" width="359" height="78" rx="16" fill="#4A90C7"/>
  <rect x="8" y="128" width="359" height="78" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="146" width="60" height="25" rx="999" fill="#0F1115"/>
  <text x="56" y="164" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">INP</text>
  <text x="341" y="170" font-size="26" font-weight="700" fill="#0F1115" text-anchor="end">200ms</text>
  <text x="26" y="194" font-size="13" fill="#5C6167">Interaction to Next Paint, or less</text>

  <rect x="13" y="227" width="359" height="78" rx="16" fill="#D098F9"/>
  <rect x="8" y="222" width="359" height="78" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="240" width="60" height="25" rx="999" fill="#0F1115"/>
  <text x="56" y="258" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLS</text>
  <text x="341" y="264" font-size="26" font-weight="700" fill="#0F1115" text-anchor="end">0.1</text>
  <text x="26" y="288" font-size="13" fill="#5C6167">Cumulative Layout Shift, or less</text>

  <rect x="13" y="331" width="359" height="146" rx="16" fill="#FDB914"/>
  <rect x="8" y="326" width="359" height="146" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="354" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO THINGS THAT FOLLOW</text>
  <text x="26" y="380" font-size="14" fill="#5C6167">Measured at the 75th percentile of<tspan x="26" dy="1.4em">real page loads, not studio wi-fi.</tspan></text>
  <text x="26" y="430" font-size="14" fill="#5C6167">First Input Delay is gone. INP<tspan x="26" dy="1.4em">replaced it on 12 March 2024.</tspan></text>
</svg>
