<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Export of services: five cumulative conditions, or 18% GST</title>
  <desc id="d">Section 2(6) of the IGST Act sets five conditions that must all hold: the supplier is in India, the recipient is outside India, the place of supply is outside India, payment arrives in convertible foreign exchange or in rupees wherever the RBI permits, and the parties are not merely establishments of the same person. Meet all five and the supply is zero rated; miss one and 18% GST applies.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SECTION 2(6) &#8212; FIVE CONDITIONS, ALL OF THEM CUMULATIVE</text>

  <rect x="14" y="46" width="440" height="272" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="440" height="272" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="32" y="74" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ALL FIVE MUST HOLD</text>

  <circle cx="44" cy="112" r="12" fill="#0F1115"/>
  <text x="44" y="117" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="68" y="117" font-size="14" fill="#5C6167">The supplier is in India</text>

  <circle cx="44" cy="146" r="12" fill="#0F1115"/>
  <text x="44" y="151" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="68" y="151" font-size="14" fill="#5C6167">The recipient is outside India</text>

  <circle cx="44" cy="180" r="12" fill="#0F1115"/>
  <text x="44" y="185" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="68" y="185" font-size="14" fill="#5C6167">The place of supply is outside India</text>

  <circle cx="44" cy="214" r="12" fill="#0F1115"/>
  <text x="44" y="219" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="68" y="219" font-size="14" fill="#5C6167">Payment in convertible foreign exchange, or<tspan x="68" dy="1.4em">in rupees wherever the RBI permits it</tspan></text>

  <circle cx="44" cy="262" r="12" fill="#0F1115"/>
  <text x="44" y="267" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="68" y="267" font-size="14" fill="#5C6167">The two parties are not merely<tspan x="68" dy="1.4em">establishments of the same person</tspan></text>

  <rect x="478" y="46" width="320" height="134" rx="16" fill="#5FBFA8"/>
  <rect x="472" y="40" width="320" height="134" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="494" y="62" width="92" height="26" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="540" y="80" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">ALL FIVE</text>
  <text x="494" y="118" font-size="18" font-weight="700" fill="#0F1115">Zero rated supply</text>
  <text x="494" y="142" font-size="13" fill="#5C6167">A Letter of Undertaking lets you invoice<tspan x="494" dy="1.45em">without charging integrated tax.</tspan></text>

  <rect x="478" y="202" width="320" height="116" rx="16" fill="#EE3D41"/>
  <rect x="472" y="196" width="320" height="116" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="494" y="218" width="146" height="26" rx="999" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="567" y="236" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">IF ANY ONE FAILS</text>
  <text x="494" y="274" font-size="18" font-weight="700" fill="#0F1115">18% GST applies</text>
  <text x="494" y="298" font-size="13" fill="#5C6167">Heading 9983, on an overseas client.</text>

  <text x="8" y="350" font-size="15" font-weight="700" fill="#0F1115">The statute allows rupees where the RBI permits. It does not require foreign currency.</text>
  <text x="8" y="374" font-size="14" fill="#5C6167">Which of the two you are in is a question for your chartered accountant, not for a blog.</text>
</svg>
