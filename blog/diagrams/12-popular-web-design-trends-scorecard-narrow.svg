<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 600" width="380" height="600" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The 2022 trend list, marked four years later</title>
  <desc id="d">Of twelve trends called in 2022, eight held cleanly, two held for reasons the original post got wrong, one was half right, and one was never a web design trend at all.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TWELVE CALLS, MARKED IN 2026</text>

  <rect x="13" y="35" width="359" height="216" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="30" width="359" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="56" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">STILL CURRENT</text>
  <text x="26" y="80" font-size="18" font-weight="700" fill="#0F1115">8 of 12 held cleanly</text>

  <rect x="26" y="88" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="102" y="109" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Micro-interactions</text>
  <rect x="196" y="88" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="272" y="109" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Scrapbook</text>

  <rect x="26" y="126" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="102" y="147" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Experimental nav</text>
  <rect x="196" y="126" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="272" y="147" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Brutalism</text>

  <rect x="26" y="164" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="102" y="185" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Neo-gradients</text>
  <rect x="196" y="164" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="272" y="185" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Dark mode</text>

  <rect x="26" y="202" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="102" y="223" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Scroll animations</text>
  <rect x="196" y="202" width="153" height="32" rx="16" fill="#5FBFA8"/>
  <text x="272" y="223" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Structured type</text>

  <rect x="13" y="267" width="359" height="86" rx="16" fill="#4A90C7"/>
  <rect x="8" y="262" width="359" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="290" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">RIGHT, WRONG REASON &#8212; 2</text>
  <text x="26" y="320" font-size="15" fill="#5C6167">Artificial intelligence, 3D design</text>

  <rect x="13" y="374" width="359" height="86" rx="16" fill="#FDB914"/>
  <rect x="8" y="369" width="359" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="397" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">HALF RIGHT &#8212; 1</text>
  <text x="26" y="427" font-size="15" fill="#5C6167">Ultra-minimalism, now the default</text>

  <rect x="13" y="481" width="359" height="96" rx="16" fill="#EE3D41"/>
  <rect x="8" y="476" width="359" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="504" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">NEVER A WEB TREND &#8212; 1</text>
  <text x="26" y="532" font-size="15" fill="#5C6167">Minimal vintage, copied off<tspan x="26" dy="1.4em">a print and packaging list</tspan></text>

  <text x="8" y="594" font-size="14" font-weight="700" fill="#0F1115">The borrowed one is the one that died.</text>
</svg>
