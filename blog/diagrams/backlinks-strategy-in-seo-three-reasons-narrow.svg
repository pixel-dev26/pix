<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 642" width="380" height="642" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three reasons to want a link, in descending order of trust</title>
  <desc id="d">Referral traffic is the only reason you can measure directly. Discovery is mechanical: links are how crawlers find pages nothing else points at. Ranking influence is heavily qualified. None of the three is measured by Domain Authority, Domain Rating, Trust Flow or Spam Score.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">IN DESCENDING ORDER OF TRUST</text>

  <!-- 1 -->
  <rect x="13" y="45" width="359" height="124" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="359" height="124" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="68" r="14" fill="#0F1115"/>
  <text x="34" y="73" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="60" y="56" width="170" height="26" rx="999" fill="#5FBFA8"/>
  <text x="145" y="74" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">YOU CAN SEE IT</text>
  <text x="20" y="106" font-size="17" font-weight="700" fill="#0F1115">Referral traffic</text>
  <text x="20" y="130" font-size="14" fill="#5C6167">A link people read sends people.<tspan x="20" dy="1.35em">You can see them arrive.</tspan></text>

  <!-- 2 -->
  <rect x="13" y="181" width="359" height="124" rx="16" fill="#4A90C7"/>
  <rect x="8" y="176" width="359" height="124" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="204" r="14" fill="#0F1115"/>
  <text x="34" y="209" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="60" y="192" width="170" height="26" rx="999" fill="#4A90C7"/>
  <text x="145" y="210" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">MECHANICAL</text>
  <text x="20" y="242" font-size="17" font-weight="700" fill="#0F1115">Discovery</text>
  <text x="20" y="266" font-size="14" fill="#5C6167">How crawlers find pages that<tspan x="20" dy="1.35em">nothing else points at.</tspan></text>

  <!-- 3 -->
  <rect x="13" y="317" width="359" height="124" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="312" width="359" height="124" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="340" r="14" fill="#0F1115"/>
  <text x="34" y="345" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="60" y="328" width="200" height="26" rx="999" fill="#E7E9EC"/>
  <text x="160" y="346" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">HEAVILY QUALIFIED</text>
  <text x="20" y="378" font-size="17" font-weight="700" fill="#0F1115">Ranking influence</text>
  <text x="20" y="402" font-size="14" fill="#5C6167">Still in the stack; the size of the<tspan x="20" dy="1.35em">effect is not observable.</tspan></text>

  <!-- what measures none of them -->
  <rect x="13" y="461" width="359" height="140" rx="16" fill="#EE3D41"/>
  <rect x="8" y="456" width="359" height="140" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="484" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">MEASURES NONE OF THEM</text>
  <text x="24" y="512" font-size="16" font-weight="700" fill="#0F1115">Domain Authority, Domain<tspan x="24" dy="1.3em">Rating, Trust Flow,</tspan><tspan x="24" dy="1.3em">Spam Score</tspan></text>
  <text x="24" y="584" font-size="13" fill="#5C6167">Vendor estimates, not Google&#8217;s.</text>

  <text x="8" y="630" font-size="13" fill="#5C6167">Google says it uses no site-wide authority score.</text>
</svg>
