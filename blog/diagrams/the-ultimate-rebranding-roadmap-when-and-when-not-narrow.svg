<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 664" width="380" height="664" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">When to rebrand, and when not to</title>
  <desc id="d">Rebrand when the brand no longer excites, the image is wrong or damaged, the business has changed course, two companies merge, you are repositioning, or you are entering a new market. Do not rebrand because a competitor did, because you are bored of the visuals, because you are new with no reputation yet, or when your brand equity is already strong. The test is what will be true about the company afterwards that is not true today.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE QUESTION BEFORE THE BRIEF</text>

  <!-- rebrand when -->
  <rect x="13" y="39" width="359" height="252" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="252" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="70" font-size="17" font-weight="700" fill="#0F1115">Rebrand when</text>
  <circle cx="30" cy="99" r="4" fill="#0F1115"/>
  <text x="44" y="104" font-size="14" fill="#5C6167">The brand no longer excites</text>
  <circle cx="30" cy="131" r="4" fill="#0F1115"/>
  <text x="44" y="136" font-size="14" fill="#5C6167">The image is wrong or damaged</text>
  <circle cx="30" cy="163" r="4" fill="#0F1115"/>
  <text x="44" y="168" font-size="14" fill="#5C6167">The business has changed course</text>
  <circle cx="30" cy="195" r="4" fill="#0F1115"/>
  <text x="44" y="200" font-size="14" fill="#5C6167">Two companies merge</text>
  <circle cx="30" cy="227" r="4" fill="#0F1115"/>
  <text x="44" y="232" font-size="14" fill="#5C6167">You are repositioning</text>
  <circle cx="30" cy="259" r="4" fill="#0F1115"/>
  <text x="44" y="264" font-size="14" fill="#5C6167">You are entering a new market</text>

  <!-- do not rebrand when -->
  <rect x="13" y="311" width="359" height="222" rx="16" fill="#EE3D41"/>
  <rect x="8" y="306" width="359" height="222" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="342" font-size="17" font-weight="700" fill="#0F1115">Do not rebrand when</text>
  <circle cx="30" cy="371" r="4" fill="#0F1115"/>
  <text x="44" y="376" font-size="14" fill="#5C6167">A competitor has just rebranded</text>
  <circle cx="30" cy="403" r="4" fill="#0F1115"/>
  <text x="44" y="408" font-size="14" fill="#5C6167">You are bored of the visuals</text>
  <circle cx="30" cy="435" r="4" fill="#0F1115"/>
  <text x="44" y="440" font-size="14" fill="#5C6167">You are new, with no reputation</text>
  <circle cx="30" cy="467" r="4" fill="#0F1115"/>
  <text x="44" y="472" font-size="14" fill="#5C6167">Your brand equity is strong</text>
  <text x="26" y="508" font-size="13" font-weight="700" fill="#0F1115">Strategy intact? Refresh, do not rebrand.</text>

  <!-- the test -->
  <rect x="13" y="553" width="359" height="104" rx="16" fill="#FDB914"/>
  <rect x="8" y="548" width="359" height="104" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="574" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE TEST BEFORE ANYONE QUOTES</text>
  <text x="26" y="600" font-size="15" font-weight="700" fill="#0F1115">What will be true about your<tspan x="26" dy="1.35em">company after this that is</tspan><tspan x="26" dy="1.35em">not true today?</tspan></text>
</svg>
