<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 622" width="380" height="622" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The eight Web Design 3.0 predictions, marked in July 2026</title>
  <desc id="d">Four stacked verdict groups. Three arrived: ethical design as law, adaptive design as personalisation, collaborative design tools. One arrived in a shape the forecast would not recognise: AI and machine learning. Three did not happen: VR and AR, voice interfaces, the Internet of Things. One is unproven: sustainable web design.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">EIGHT PREDICTIONS, MARKED</text>

  <!-- arrived -->
  <rect x="13" y="39" width="359" height="130" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="80" font-size="30" font-weight="700" fill="#0F1115">3</text>
  <rect x="58" y="60" width="84" height="25" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="100" y="78" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">ARRIVED</text>
  <text x="26" y="110" font-size="13" fill="#5C6167">Ethical design, arrived as law<tspan x="26" dy="1.45em">Adaptive design, as personalisation</tspan><tspan x="26" dy="1.45em">Collaborative design tools</tspan></text>

  <!-- arrived, reshaped -->
  <rect x="13" y="185" width="359" height="114" rx="16" fill="#FDB914"/>
  <rect x="8" y="180" width="359" height="114" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="226" font-size="30" font-weight="700" fill="#0F1115">1</text>
  <rect x="58" y="206" width="162" height="25" rx="999" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="139" y="224" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">ARRIVED, RESHAPED</text>
  <text x="26" y="256" font-size="13" fill="#5C6167">AI and machine learning. It landed in<tspan x="26" dy="1.45em">front of the website, not inside design.</tspan></text>

  <!-- did not happen -->
  <rect x="13" y="315" width="359" height="130" rx="16" fill="#EE3D41"/>
  <rect x="8" y="310" width="359" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="356" font-size="30" font-weight="700" fill="#0F1115">3</text>
  <rect x="58" y="336" width="138" height="25" rx="999" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="127" y="354" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">DID NOT HAPPEN</text>
  <text x="26" y="386" font-size="13" fill="#5C6167">Virtual and augmented reality<tspan x="26" dy="1.45em">Voice and conversational interfaces</tspan><tspan x="26" dy="1.45em">The Internet of Things</tspan></text>

  <!-- unproven -->
  <rect x="13" y="461" width="359" height="114" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="456" width="359" height="114" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="502" font-size="30" font-weight="700" fill="#0F1115">1</text>
  <rect x="58" y="482" width="92" height="25" rx="999" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <text x="104" y="500" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">UNPROVEN</text>
  <text x="26" y="532" font-size="13" fill="#5C6167">Sustainable web design. Sound, but no<tspan x="26" dy="1.45em">evidence it changed what is specified.</tspan></text>

  <text x="8" y="606" font-size="14" font-weight="700" fill="#0F1115">The largest change was on nobody's list.</text>
</svg>
