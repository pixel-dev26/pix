<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Adoption of AI tools is near-universal; trust in them is not</title>
  <desc id="d">Left panel: 90% use AI at work, 84% use or plan to use AI tools, 91% of designers use AI weekly. Right panel: 30% have little or no trust in AI-written code, 45.7% actively distrust its accuracy, and 66% name almost-right output as their biggest frustration.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE SURVEYS, THE SAME SHAPE</text>

  <rect x="14" y="40" width="384" height="250" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="384" height="250" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="30" y="64" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ADOPTION</text>
  <text x="30" y="94" font-size="19" font-weight="700" fill="#0F1115">Nearly everyone uses it</text>

  <text x="30" y="128" font-size="14" font-weight="700" fill="#0F1115">90%<tspan font-weight="400" fill="#5C6167"> use AI at work</tspan></text>
  <text x="370" y="128" font-size="11" fill="#6A6F75" text-anchor="end">Google DORA, 2025</text>
  <rect x="30" y="138" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="30" y="138" width="306" height="20" rx="10" fill="#4A90C7"/>

  <text x="30" y="182" font-size="14" font-weight="700" fill="#0F1115">84%<tspan font-weight="400" fill="#5C6167"> use or plan to use AI</tspan></text>
  <text x="370" y="182" font-size="11" fill="#6A6F75" text-anchor="end">Stack Overflow, 2025</text>
  <rect x="30" y="192" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="30" y="192" width="286" height="20" rx="10" fill="#4A90C7"/>

  <text x="30" y="236" font-size="14" font-weight="700" fill="#0F1115">91%<tspan font-weight="400" fill="#5C6167"> of designers, weekly</tspan></text>
  <text x="370" y="236" font-size="11" fill="#6A6F75" text-anchor="end">AI in Design, 2026</text>
  <rect x="30" y="246" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="30" y="246" width="309" height="20" rx="10" fill="#4A90C7"/>

  <rect x="414" y="40" width="384" height="250" rx="16" fill="#EE3D41"/>
  <rect x="408" y="34" width="384" height="250" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="64" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TRUST</text>
  <text x="430" y="94" font-size="19" font-weight="700" fill="#0F1115">The same people, unconvinced</text>

  <text x="430" y="128" font-size="14" font-weight="700" fill="#0F1115">30%<tspan font-weight="400" fill="#5C6167"> little or no trust in AI code</tspan></text>
  <text x="770" y="128" font-size="11" fill="#6A6F75" text-anchor="end">Google DORA, 2025</text>
  <rect x="430" y="138" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="430" y="138" width="102" height="20" rx="10" fill="#EE3D41"/>

  <text x="430" y="182" font-size="14" font-weight="700" fill="#0F1115">45.7%<tspan font-weight="400" fill="#5C6167"> distrust its accuracy</tspan></text>
  <text x="770" y="182" font-size="11" fill="#6A6F75" text-anchor="end">Stack Overflow, 2025</text>
  <rect x="430" y="192" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="430" y="192" width="155" height="20" rx="10" fill="#EE3D41"/>

  <text x="430" y="236" font-size="14" font-weight="700" fill="#0F1115">66%<tspan font-weight="400" fill="#5C6167"> say &#8220;almost right, not quite&#8221;</tspan></text>
  <text x="770" y="236" font-size="11" fill="#6A6F75" text-anchor="end">Stack Overflow, 2025</text>
  <rect x="430" y="246" width="340" height="20" rx="10" fill="#E7E9EC"/>
  <rect x="430" y="246" width="224" height="20" rx="10" fill="#EE3D41"/>

  <text x="8" y="316" font-size="14" font-weight="700" fill="#0F1115">The people using these tools daily are the least convinced by them.</text>
</svg>
