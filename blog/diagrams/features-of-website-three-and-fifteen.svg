<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three features decide the outcome; the other fifteen are hygiene</title>
  <desc id="d">Three cards carry the decisive features: saying something no competitor could say, staying fast and stable on a mid-range phone, and telling a visitor what to do next. A band underneath lists the remaining fifteen features as hygiene: not optional, but not why anyone chose a supplier.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">EIGHTEEN FEATURES, WEIGHTED HONESTLY</text>

  <rect x="14" y="46" width="246" height="130" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="246" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="45" cy="72" r="15" fill="#0F1115"/>
  <text x="45" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="30" y="120" font-size="17" font-weight="700" fill="#0F1115">Says something no<tspan x="30" dy="1.3em">competitor could say</tspan></text>

  <rect x="283" y="46" width="246" height="130" rx="16" fill="#FDB914"/>
  <rect x="277" y="40" width="246" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="314" cy="72" r="15" fill="#0F1115"/>
  <text x="314" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="299" y="120" font-size="17" font-weight="700" fill="#0F1115">Fast and stable on a<tspan x="299" dy="1.3em">mid-range phone</tspan></text>

  <rect x="552" y="46" width="246" height="130" rx="16" fill="#FDB914"/>
  <rect x="546" y="40" width="246" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="583" cy="72" r="15" fill="#0F1115"/>
  <text x="583" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="568" y="120" font-size="17" font-weight="700" fill="#0F1115">Tells a visitor what<tspan x="568" dy="1.3em">to do next</tspan></text>

  <!-- the fifteen -->
  <rect x="14" y="210" width="784" height="200" rx="16" fill="#8E959D"/>
  <rect x="8" y="204" width="784" height="200" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="232" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE OTHER FIFTEEN</text>
  <text x="34" y="258" font-size="17" font-weight="700" fill="#0F1115">Hygiene. Not optional, and not why anyone ever chose a supplier.</text>

  <circle cx="38" cy="288" r="3" fill="#8E959D"/>
  <text x="50" y="292" font-size="14" fill="#5C6167">Brand name and logo</text>
  <circle cx="38" cy="310" r="3" fill="#8E959D"/>
  <text x="50" y="314" font-size="14" fill="#5C6167">Personalised domain name</text>
  <circle cx="38" cy="332" r="3" fill="#8E959D"/>
  <text x="50" y="336" font-size="14" fill="#5C6167">Clear, concise navigation</text>
  <circle cx="38" cy="354" r="3" fill="#8E959D"/>
  <text x="50" y="358" font-size="14" fill="#5C6167">Responsive design</text>
  <circle cx="38" cy="376" r="3" fill="#8E959D"/>
  <text x="50" y="380" font-size="14" fill="#5C6167">SEO basics</text>

  <circle cx="294" cy="288" r="3" fill="#8E959D"/>
  <text x="306" y="292" font-size="14" fill="#5C6167">Contact and social links</text>
  <circle cx="294" cy="310" r="3" fill="#8E959D"/>
  <text x="306" y="314" font-size="14" fill="#5C6167">SSL certificate</text>
  <circle cx="294" cy="332" r="3" fill="#8E959D"/>
  <text x="306" y="336" font-size="14" fill="#5C6167">Live chat support</text>
  <circle cx="294" cy="354" r="3" fill="#8E959D"/>
  <text x="306" y="358" font-size="14" fill="#5C6167">Testimonials and reviews</text>
  <circle cx="294" cy="376" r="3" fill="#8E959D"/>
  <text x="306" y="380" font-size="14" fill="#5C6167">Analytics and tracking</text>

  <circle cx="550" cy="288" r="3" fill="#8E959D"/>
  <text x="562" y="292" font-size="14" fill="#5C6167">About Us page</text>
  <circle cx="550" cy="310" r="3" fill="#8E959D"/>
  <text x="562" y="314" font-size="14" fill="#5C6167">Footer with essential links</text>
  <circle cx="550" cy="332" r="3" fill="#8E959D"/>
  <text x="562" y="336" font-size="14" fill="#5C6167">Blog</text>
  <circle cx="550" cy="354" r="3" fill="#8E959D"/>
  <text x="562" y="358" font-size="14" fill="#5C6167">FAQs</text>
  <circle cx="550" cy="376" r="3" fill="#8E959D"/>
  <text x="562" y="380" font-size="14" fill="#5C6167">Search functionality</text>
</svg>
