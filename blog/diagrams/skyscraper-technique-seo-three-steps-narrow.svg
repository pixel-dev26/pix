<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 508" width="380" height="508" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The Skyscraper Technique's three steps, and which one still works</title>
  <desc id="d">Step one, identify the best-linked page, still works and is the research half worth keeping. Step two, publish a longer version, is broken because Google's own guidance names that output as commodity content. Step three, email everyone who linked to the original, is broken because only 8.5 per cent of outreach emails get any reply.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE STEPS, ONE SURVIVOR</text>

  <!-- 1. Identify -->
  <rect x="13" y="45" width="359" height="130" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="359" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="58" width="122" height="26" rx="999" fill="#5FBFA8"/>
  <text x="85" y="76" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">STILL WORKS</text>
  <text x="160" y="77" font-size="18" font-weight="700" fill="#0F1115">1. Identify</text>
  <text x="24" y="110" font-size="14" fill="#5C6167">Find the page with the most links.</text>
  <text x="24" y="150" font-size="15" font-weight="700" fill="#0F1115">Still the most useful hour in SEO.</text>

  <!-- 2. Improve -->
  <rect x="13" y="191" width="359" height="130" rx="16" fill="#EE3D41"/>
  <rect x="8" y="186" width="359" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="204" width="92" height="26" rx="999" fill="#EE3D41"/>
  <text x="70" y="222" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">BROKEN</text>
  <text x="130" y="223" font-size="18" font-weight="700" fill="#0F1115">2. Improve</text>
  <text x="24" y="256" font-size="14" fill="#5C6167">Publish a longer version of it.</text>
  <text x="24" y="296" font-size="15" font-weight="700" fill="#0F1115">Google calls that commodity content.</text>

  <!-- 3. Promote -->
  <rect x="13" y="337" width="359" height="130" rx="16" fill="#EE3D41"/>
  <rect x="8" y="332" width="359" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="350" width="92" height="26" rx="999" fill="#EE3D41"/>
  <text x="70" y="368" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">BROKEN</text>
  <text x="130" y="369" font-size="18" font-weight="700" fill="#0F1115">3. Promote</text>
  <text x="24" y="402" font-size="14" fill="#5C6167">Email everyone who linked to it.</text>
  <text x="24" y="442" font-size="15" font-weight="700" fill="#0F1115">8.5% of those emails get a reply.</text>

  <text x="8" y="496" font-size="14" fill="#5C6167">Two steps obsolete. Keep the research.</text>
</svg>
