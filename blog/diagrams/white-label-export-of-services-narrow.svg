<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 606" width="380" height="606" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Export of services: five cumulative conditions, or 18% GST</title>
  <desc id="d">Section 2(6) of the IGST Act sets five conditions that must all hold: the supplier is in India, the recipient is outside India, the place of supply is outside India, payment arrives in convertible foreign exchange or in rupees wherever the RBI permits, and the parties are not merely establishments of the same person. Meet all five and the supply is zero rated; miss one and 18% GST applies.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">FIVE CONDITIONS, ALL CUMULATIVE</text>

  <rect x="13" y="39" width="359" height="234" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="234" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <circle cx="32" cy="70" r="11" fill="#0F1115"/>
  <text x="32" y="75" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="54" y="75" font-size="13" fill="#5C6167">The supplier is in India</text>

  <circle cx="32" cy="104" r="11" fill="#0F1115"/>
  <text x="32" y="109" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="54" y="109" font-size="13" fill="#5C6167">The recipient is outside India</text>

  <circle cx="32" cy="138" r="11" fill="#0F1115"/>
  <text x="32" y="143" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="54" y="143" font-size="13" fill="#5C6167">The place of supply is outside India</text>

  <circle cx="32" cy="172" r="11" fill="#0F1115"/>
  <text x="32" y="177" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="54" y="177" font-size="13" fill="#5C6167">Payment in convertible foreign<tspan x="54" dy="1.45em">exchange, or rupees where the RBI</tspan><tspan x="54" dy="1.45em">permits it</tspan></text>

  <circle cx="32" cy="243" r="11" fill="#0F1115"/>
  <text x="32" y="248" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="54" y="248" font-size="13" fill="#5C6167">Not establishments of one person</text>

  <rect x="13" y="295" width="359" height="112" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="290" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="308" width="92" height="25" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="72" y="326" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">ALL FIVE</text>
  <text x="26" y="360" font-size="17" font-weight="700" fill="#0F1115">Zero rated supply</text>
  <text x="26" y="386" font-size="13" fill="#5C6167">A Letter of Undertaking removes the tax.</text>

  <rect x="13" y="429" width="359" height="112" rx="16" fill="#EE3D41"/>
  <rect x="8" y="424" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="442" width="150" height="25" rx="999" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="101" y="460" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">IF ANY ONE FAILS</text>
  <text x="26" y="494" font-size="17" font-weight="700" fill="#0F1115">18% GST applies</text>
  <text x="26" y="520" font-size="13" fill="#5C6167">Heading 9983, on an overseas client.</text>

  <text x="8" y="574" font-size="14" font-weight="700" fill="#0F1115">Rupees are allowed where the RBI<tspan x="8" dy="1.4em">permits. Ask your accountant.</tspan></text>
</svg>
