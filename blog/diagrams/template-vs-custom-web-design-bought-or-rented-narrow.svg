<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 632" width="380" height="632" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Template means two different commercial arrangements</title>
  <desc id="d">A WordPress theme is a purchase you keep, roughly 19 to 99 dollars on ThemeForest, paid once. A Wix or Squarespace template is included with a subscription of 17 to 159 dollars a month on yearly billing, over 200 dollars a year indefinitely, and it stops being yours the day you stop paying.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE WORD, TWO ARRANGEMENTS</text>

  <!-- bought -->
  <rect x="13" y="39" width="359" height="212" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="34" width="359" height="212" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="98" height="26" rx="999" fill="#0F1115"/>
  <text x="75" y="70" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">BOUGHT</text>
  <text x="26" y="104" font-size="17" font-weight="700" fill="#0F1115">A WordPress theme</text>
  <path d="M26 120 L349 120" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="156" font-size="20" font-weight="700" fill="#0F1115">$19 to $99</text>
  <text x="26" y="180" font-size="14" fill="#5C6167">on ThemeForest, paid once</text>
  <text x="26" y="208" font-size="14" fill="#5C6167">A purchase you keep. It stays<tspan x="26" dy="1.35em">yours whatever you do next.</tspan></text>

  <!-- rented -->
  <rect x="13" y="276" width="359" height="232" rx="16" fill="#FA6B45"/>
  <rect x="8" y="271" width="359" height="232" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="289" width="96" height="26" rx="999" fill="#0F1115"/>
  <text x="74" y="307" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">RENTED</text>
  <text x="26" y="341" font-size="17" font-weight="700" fill="#0F1115">A Wix or Squarespace<tspan x="26" dy="1.3em">template</tspan></text>
  <path d="M26 379 L349 379" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="415" font-size="20" font-weight="700" fill="#0F1115">$17 to $159 a month</text>
  <text x="26" y="439" font-size="14" fill="#5C6167">on yearly billing, over $200 a year</text>
  <text x="26" y="467" font-size="14" fill="#5C6167">Stop paying and it stops<tspan x="26" dy="1.35em">being yours.</tspan></text>

  <!-- the distinction -->
  <rect x="13" y="533" width="359" height="90" rx="16" fill="#FDB914"/>
  <rect x="8" y="528" width="359" height="90" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="556" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE DISTINCTION</text>
  <text x="26" y="582" font-size="15" font-weight="700" fill="#0F1115">Cheap and rented are not<tspan x="26" dy="1.35em">the same word.</tspan></text>
</svg>
