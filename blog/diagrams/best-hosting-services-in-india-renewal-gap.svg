<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What you pay to join a host, and what you pay to stay</title>
  <desc id="d">Hostinger Single joins at 69 rupees a month and renews at 289. MilesWeb Starter joins at 69 and says on its own page that the same price applies at renewal. BigRock Standard joins at 69 and renews at 409, roughly six times. HostPapa Essentials joins at 149.95 and renews at 449.99, about three times.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE SECOND INVOICE</text>

  <rect x="14" y="50" width="784" height="286" rx="16" fill="#FDB914"/>
  <rect x="8" y="44" width="784" height="286" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="34" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">PRICES READ ON EACH VENDOR&#8217;S OWN PAGE, 30 JULY 2026</text>
  <text x="290" y="96" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">JOINING</text>
  <text x="460" y="96" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">RENEWS AT</text>
  <path d="M34 104 L766 104" stroke="#E7E9EC" stroke-width="2"/>

  <text x="34" y="142" font-size="15" font-weight="700" fill="#0F1115">Hostinger Single</text>
  <rect x="290" y="118" width="110" height="36" rx="18" ry="18" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="142" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;69/mo</text>
  <path d="M406 136 L452 136" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="118" width="150" height="36" rx="18" ry="18" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="535" y="142" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;289/mo</text>
  <text x="630" y="142" font-size="13" fill="#5C6167">printed on the page</text>

  <text x="34" y="194" font-size="15" font-weight="700" fill="#0F1115">MilesWeb Starter</text>
  <rect x="290" y="170" width="110" height="36" rx="18" ry="18" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="194" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;69/mo</text>
  <path d="M406 188 L452 188" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="170" width="150" height="36" rx="18" ry="18" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="535" y="194" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;69/mo</text>
  <text x="630" y="194" font-size="13" fill="#5C6167">their own claim</text>

  <text x="34" y="246" font-size="15" font-weight="700" fill="#0F1115">BigRock Standard</text>
  <rect x="290" y="222" width="110" height="36" rx="18" ry="18" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="246" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;69/mo</text>
  <path d="M406 240 L452 240" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="222" width="150" height="36" rx="18" ry="18" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="535" y="246" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;409/mo</text>
  <text x="630" y="246" font-size="13" fill="#5C6167">roughly six times</text>

  <text x="34" y="298" font-size="15" font-weight="700" fill="#0F1115">HostPapa Essentials</text>
  <rect x="290" y="274" width="110" height="36" rx="18" ry="18" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="298" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;149.95</text>
  <path d="M406 292 L452 292" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="274" width="150" height="36" rx="18" ry="18" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="535" y="298" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">&#8377;449.99/mo</text>
  <text x="630" y="298" font-size="13" fill="#5C6167">about three times</text>

  <text x="8" y="364" font-size="14" fill="#5C6167">The renewal is the real price. Nothing about the ranking survives once you sort by the second number.</text>
</svg>
