<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 346" width="800" height="346" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What an AI summary does to the click</title>
  <desc id="d">Pew Research Center tracked 900 US adults across 68,879 Google searches in July 2025. Users clicked a traditional result on 15 per cent of searches without an AI summary, 8 per cent of searches with one, and clicked a link inside the summary itself on 1 per cent.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT A CLICK IS WORTH NOW</text>

  <rect x="14" y="50" width="784" height="256" rx="16" fill="#FDB914"/>
  <rect x="8" y="44" width="784" height="256" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="34" y="76" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SHARE OF SEARCHES THAT PRODUCED A CLICK</text>
  <path d="M34 88 L766 88" stroke="#E7E9EC" stroke-width="2"/>

  <text x="34" y="127" font-size="14" fill="#5C6167">No AI summary shown</text>
  <rect x="300" y="102" width="396" height="40" rx="20" ry="20" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="710" y="129" font-size="18" font-weight="700" fill="#0F1115">15%</text>

  <text x="34" y="183" font-size="14" fill="#5C6167">An AI summary shown</text>
  <rect x="300" y="158" width="211" height="40" rx="20" ry="20" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="525" y="185" font-size="18" font-weight="700" fill="#0F1115">8%</text>

  <text x="34" y="239" font-size="14" fill="#5C6167">A link inside the summary</text>
  <rect x="300" y="214" width="26" height="40" rx="20" ry="20" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="340" y="241" font-size="18" font-weight="700" fill="#0F1115">1%</text>

  <text x="34" y="282" font-size="13" fill="#6A6F75">Pew Research Center, July 2025: 900 US adults across 68,879 Google searches.</text>

  <text x="8" y="334" font-size="14" fill="#5C6167">Still the best position on the page, and worth less per impression than it was.</text>
</svg>
