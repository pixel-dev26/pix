<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 666" width="380" height="666" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The Indian compliance clock: six hours, 180 days, and the penalty ladder</title>
  <desc id="d">CERT-In's directions under section 70B require a listed incident to be reported within six hours of noticing it, and ICT logs to be kept for a rolling 180 days inside Indian jurisdiction. Under the DPDP Act the maximum penalties are 250 crore rupees for failing to maintain reasonable security safeguards, 200 crore for failing to notify a personal data breach, and 50 crore for any other violation.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT INDIAN LAW PUTS ON THE CLOCK</text>

  <!-- CERT-In -->
  <rect x="13" y="39" width="359" height="222" rx="16" fill="#EE3D41"/>
  <rect x="8" y="34" width="359" height="222" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="60" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">CERT-IN, SECTION 70B</text>
  <text x="26" y="104" font-size="32" font-weight="700" fill="#0F1115">6 hours</text>
  <text x="26" y="132" font-size="13" fill="#5C6167">to report a listed incident, from<tspan x="26" dy="1.4em">the moment you notice it.</tspan></text>
  <path d="M26 178 L350 178" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="216" font-size="32" font-weight="700" fill="#0F1115">180 days</text>
  <text x="26" y="244" font-size="13" fill="#5C6167">of ICT logs, held inside India.</text>

  <!-- DPDP penalties -->
  <rect x="13" y="281" width="359" height="228" rx="16" fill="#FDB914"/>
  <rect x="8" y="276" width="359" height="228" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="302" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">DPDP ACT, MAXIMUM PENALTIES</text>
  <text x="26" y="340" font-size="20" font-weight="700" fill="#0F1115">&#8377;250 crore</text>
  <text x="26" y="362" font-size="13" fill="#5C6167">Failure to keep reasonable safeguards</text>
  <text x="26" y="402" font-size="20" font-weight="700" fill="#0F1115">&#8377;200 crore</text>
  <text x="26" y="424" font-size="13" fill="#5C6167">Failure to notify a data breach</text>
  <text x="26" y="464" font-size="20" font-weight="700" fill="#0F1115">&#8377;50 crore</text>
  <text x="26" y="486" font-size="13" fill="#5C6167">Any other violation</text>

  <!-- evidence -->
  <rect x="13" y="529" width="359" height="130" rx="16" fill="#4A90C7"/>
  <rect x="8" y="524" width="359" height="130" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="550" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT COUNTS AS EVIDENCE</text>
  <text x="26" y="576" font-size="15" font-weight="700" fill="#0F1115">The Act sets no checklist.</text>
  <text x="26" y="606" font-size="14" fill="#5C6167">Dated test reports, a remediation<tspan x="26" dy="1.4em">log and a retest are the evidence.</tspan></text>
</svg>
