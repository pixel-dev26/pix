<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Paying the invoice does not transfer copyright in your website</title>
  <desc id="d">Three stages. You pay in full. Under Section 17 of the Copyright Act 1957 the author is the first owner, and the commissioned-work exception covers photographs, paintings and films rather than code. Under Section 19 an assignment must be in writing and signed, stating the work, the rights, the duration and the territory — and if the duration is not stated it is deemed to be five years.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT PAYING THE INVOICE DOES NOT BUY, UNDER INDIAN LAW</text>

  <rect x="14" y="50" width="246" height="220" rx="16" fill="#4A90C7"/>
  <rect x="8" y="44" width="246" height="220" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="74" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE ASSUMPTION</text>
  <text x="28" y="110" font-size="18" font-weight="700" fill="#0F1115">You pay the<tspan x="28" dy="1.25em">invoice in full</tspan></text>
  <text x="28" y="168" font-size="14" fill="#5C6167">It is natural to assume<tspan x="28" dy="1.4em">that this buys you the</tspan><tspan x="28" dy="1.4em">copyright in the work.</tspan></text>

  <rect x="283" y="50" width="246" height="220" rx="16" fill="#FDB914"/>
  <rect x="277" y="44" width="246" height="220" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="297" y="74" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SECTION 17</text>
  <text x="297" y="110" font-size="18" font-weight="700" fill="#0F1115">The author is the<tspan x="297" dy="1.25em">first owner</tspan></text>
  <text x="297" y="168" font-size="14" fill="#5C6167">The commissioned-work<tspan x="297" dy="1.4em">exception covers photos,</tspan><tspan x="297" dy="1.4em">paintings and films.</tspan><tspan x="297" dy="1.4em">Not code, not design files.</tspan></text>

  <rect x="552" y="50" width="246" height="220" rx="16" fill="#FDB914"/>
  <rect x="546" y="44" width="246" height="220" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="566" y="74" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SECTION 19</text>
  <text x="566" y="110" font-size="18" font-weight="700" fill="#0F1115">Assignment must<tspan x="566" dy="1.25em">be in writing</tspan></text>
  <text x="566" y="168" font-size="14" fill="#5C6167">Signed, and it must state<tspan x="566" dy="1.4em">the work, the rights, the</tspan><tspan x="566" dy="1.4em">duration and the territory.</tspan><tspan x="566" dy="1.4em">Nothing less transfers it.</tspan></text>

  <path d="M258 154 L272 154" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M527 154 L541 154" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="14" y="294" width="784" height="88" rx="16" fill="#EE3D41"/>
  <rect x="8" y="288" width="784" height="88" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="316" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE CLAUSE THAT CATCHES PEOPLE OUT</text>
  <text x="34" y="344" font-size="17" font-weight="700" fill="#0F1115">If the period of assignment is not stated, it is deemed to be five years.</text>
  <text x="34" y="366" font-size="14" fill="#5C6167">A cheerful email saying all the IP is yours can amount to a five-year licence over your own website.</text>

  <text x="8" y="410" font-size="12" fill="#6A6F75">Copyright Act, 1957, sections 17 and 19. A reason to ask your lawyer, not legal advice.</text>
</svg>
