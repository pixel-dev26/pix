<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 530" width="380" height="530" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where the 18% GST on web design comes from</title>
  <desc id="d">Heading 9983, other professional, technical and business services, sits at serial 21 of Notification 11/2017-Central Tax (Rate). Three SAC codes sit under it: 998314 for IT design and development, 998315 for hosting and infrastructure, 998391 for specialty design. Nine per cent central tax plus nine per cent state tax makes 18 per cent under any of them.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE CODE THE TAX SITS UNDER</text>

  <rect x="13" y="39" width="359" height="110" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="110" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="62" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">NOTIFICATION 11/2017, SERIAL 21</text>
  <text x="26" y="92" font-size="19" font-weight="700" fill="#0F1115">Heading 9983</text>
  <text x="26" y="116" font-size="14" fill="#5C6167">Other professional, technical<tspan x="26" dy="1.35em">and business services</tspan></text>

  <path d="M190 154 L190 166" stroke="#8E959D" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="13" y="175" width="359" height="150" rx="16" fill="#4A90C7"/>
  <rect x="8" y="170" width="359" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="196" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE SAC CODES UNDER IT</text>
  <rect x="26" y="212" width="96" height="26" rx="999" fill="#0F1115"/>
  <text x="74" y="230" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998314</text>
  <text x="134" y="230" font-size="13" font-weight="700" fill="#0F1115">IT design and development</text>
  <rect x="26" y="248" width="96" height="26" rx="999" fill="#0F1115"/>
  <text x="74" y="266" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998315</text>
  <text x="134" y="266" font-size="13" font-weight="700" fill="#0F1115">Hosting and infrastructure</text>
  <rect x="26" y="284" width="96" height="26" rx="999" fill="#0F1115"/>
  <text x="74" y="302" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998391</text>
  <text x="134" y="302" font-size="13" font-weight="700" fill="#0F1115">Specialty design services</text>

  <rect x="13" y="351" width="359" height="124" rx="16" fill="#0F1115"/>
  <rect x="8" y="346" width="359" height="124" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="374" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHERE THE 18% COMES FROM</text>
  <text x="26" y="410" font-size="20" font-weight="700" fill="#0F1115">9% central + 9% state = 18%</text>
  <text x="26" y="438" font-size="13" fill="#5C6167">Unchanged by the September 2025<tspan x="26" dy="1.35em">amendment to serial 21.</tspan></text>

  <text x="8" y="498" font-size="13" fill="#5C6167">All three codes sit under Heading 9983,<tspan x="8" dy="1.35em">so it is 18% either way.</tspan></text>
</svg>
