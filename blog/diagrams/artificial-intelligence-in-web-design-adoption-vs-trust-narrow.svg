<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="380" height="520" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Adoption of AI tools is near-universal; trust in them is not</title>
  <desc id="d">Top card: 90% use AI at work, 84% use or plan to use AI tools, 91% of designers use AI weekly. Bottom card: 30% have little or no trust in AI-written code, 45.7% actively distrust its accuracy, and 66% name almost-right output as their biggest frustration.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE SURVEYS, THE SAME SHAPE</text>

  <rect x="13" y="39" width="359" height="210" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="210" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="30" y="58" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ADOPTION</text>
  <text x="30" y="84" font-size="18" font-weight="700" fill="#0F1115">Nearly everyone uses it</text>

  <text x="30" y="114" font-size="14" font-weight="700" fill="#0F1115">90%<tspan font-weight="400" fill="#5C6167"> use AI at work</tspan></text>
  <text x="345" y="114" font-size="13" fill="#6A6F75" text-anchor="end">DORA 2025</text>
  <rect x="30" y="122" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="122" width="284" height="18" rx="9" fill="#4A90C7"/>

  <text x="30" y="160" font-size="14" font-weight="700" fill="#0F1115">84%<tspan font-weight="400" fill="#5C6167"> use or plan to</tspan></text>
  <text x="345" y="160" font-size="13" fill="#6A6F75" text-anchor="end">Stack Overflow 2025</text>
  <rect x="30" y="168" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="168" width="265" height="18" rx="9" fill="#4A90C7"/>

  <text x="30" y="206" font-size="14" font-weight="700" fill="#0F1115">91%<tspan font-weight="400" fill="#5C6167"> of designers, weekly</tspan></text>
  <text x="345" y="206" font-size="13" fill="#6A6F75" text-anchor="end">AI in Design 2026</text>
  <rect x="30" y="214" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="214" width="287" height="18" rx="9" fill="#4A90C7"/>

  <rect x="13" y="269" width="359" height="210" rx="16" fill="#EE3D41"/>
  <rect x="8" y="264" width="359" height="210" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="30" y="288" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TRUST</text>
  <text x="30" y="314" font-size="18" font-weight="700" fill="#0F1115">The same people, unconvinced</text>

  <text x="30" y="344" font-size="14" font-weight="700" fill="#0F1115">30%<tspan font-weight="400" fill="#5C6167"> little or no trust</tspan></text>
  <text x="345" y="344" font-size="13" fill="#6A6F75" text-anchor="end">DORA 2025</text>
  <rect x="30" y="352" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="352" width="95" height="18" rx="9" fill="#EE3D41"/>

  <text x="30" y="390" font-size="14" font-weight="700" fill="#0F1115">45.7%<tspan font-weight="400" fill="#5C6167"> distrust accuracy</tspan></text>
  <text x="345" y="390" font-size="13" fill="#6A6F75" text-anchor="end">Stack Overflow 2025</text>
  <rect x="30" y="398" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="398" width="144" height="18" rx="9" fill="#EE3D41"/>

  <text x="30" y="436" font-size="14" font-weight="700" fill="#0F1115">66%<tspan font-weight="400" fill="#5C6167"> say &#8220;almost right&#8221;</tspan></text>
  <text x="345" y="436" font-size="13" fill="#6A6F75" text-anchor="end">Stack Overflow 2025</text>
  <rect x="30" y="444" width="315" height="18" rx="9" fill="#E7E9EC"/>
  <rect x="30" y="444" width="208" height="18" rx="9" fill="#EE3D41"/>

  <text x="8" y="506" font-size="14" font-weight="700" fill="#0F1115">Daily users are the least convinced.</text>
</svg>
