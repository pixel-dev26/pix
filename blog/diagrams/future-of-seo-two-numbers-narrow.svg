<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" width="380" height="640" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The two numbers that describe what changed in search</title>
  <desc id="d">People clicked a traditional result on 15 per cent of visits without an AI summary and 8 per cent with one, and clicked links inside the summary on 1 per cent. AI Overview citations that also rank in Google's top ten fell from about 76 per cent in July 2025 to 37.9 per cent in March 2026.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO NUMBERS, ONE CHANGE</text>

  <!-- clicks -->
  <rect x="13" y="39" width="359" height="246" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="62" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PEW RESEARCH, JULY 2025</text>
  <text x="26" y="92" font-size="17" font-weight="700" fill="#0F1115">Clicks on a traditional result</text>

  <text x="26" y="126" font-size="13" fill="#5C6167">Without an AI summary</text>
  <text x="349" y="126" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">15% of visits</text>
  <rect x="26" y="132" width="260" height="16" rx="8" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="174" font-size="13" fill="#5C6167">With an AI summary</text>
  <text x="349" y="174" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">8% of visits</text>
  <rect x="26" y="180" width="139" height="16" rx="8" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="222" font-size="13" fill="#5C6167">Links inside the summary</text>
  <text x="349" y="222" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">1% of visits</text>
  <rect x="26" y="228" width="17" height="16" rx="8" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <!-- citations -->
  <rect x="13" y="305" width="359" height="222" rx="16" fill="#FDB914"/>
  <rect x="8" y="300" width="359" height="222" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="328" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">AHREFS, 863,000 SERPS</text>
  <text x="26" y="358" font-size="17" font-weight="700" fill="#0F1115">AI citations in the top 10</text>

  <text x="26" y="392" font-size="13" fill="#5C6167">July 2025</text>
  <text x="349" y="392" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">about 76%</text>
  <rect x="26" y="398" width="260" height="16" rx="8" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="440" font-size="13" fill="#5C6167">March 2026</text>
  <text x="349" y="440" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">37.9%</text>
  <rect x="26" y="446" width="130" height="16" rx="8" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <path d="M26 480 L349 480" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="504" font-size="14" fill="#5C6167">A page can be the answer without being a ranking.</text>

  <!-- the whole change -->
  <rect x="13" y="547" width="359" height="84" rx="16" fill="#0F1115"/>
  <rect x="8" y="542" width="359" height="84" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="570" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE WHOLE CHANGE</text>
  <text x="26" y="594" font-size="15" font-weight="700" fill="#0F1115">Halve the clicks, and break the<tspan x="26" dy="1.35em">link between rank and citation.</tspan></text>
</svg>
