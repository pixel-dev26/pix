<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 386" width="800" height="386" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Three reasons to want a link, in descending order of trust</title>
  <desc id="d">Referral traffic is the only reason you can measure directly. Discovery is mechanical: links are how crawlers find pages nothing else points at. Ranking influence is heavily qualified. None of the three is measured by Domain Authority, Domain Rating, Trust Flow or Spam Score.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE REASONS TO WANT A LINK, IN DESCENDING ORDER OF TRUST</text>

  <!-- 1 -->
  <rect x="14" y="50" width="246" height="180" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="44" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="74" r="15" fill="#0F1115"/>
  <text x="38" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="64" y="60" width="170" height="28" rx="999" fill="#5FBFA8"/>
  <text x="149" y="79" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">YOU CAN SEE IT</text>
  <text x="28" y="128" font-size="18" font-weight="700" fill="#0F1115">Referral traffic</text>
  <text x="28" y="168" font-size="14" fill="#5C6167">A link on a page people<tspan x="28" dy="1.4em">read sends people. You</tspan><tspan x="28" dy="1.4em">can see them arrive.</tspan></text>

  <!-- 2 -->
  <rect x="283" y="50" width="246" height="180" rx="16" fill="#4A90C7"/>
  <rect x="277" y="44" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="307" cy="74" r="15" fill="#0F1115"/>
  <text x="307" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <rect x="333" y="60" width="170" height="28" rx="999" fill="#4A90C7"/>
  <text x="418" y="79" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">MECHANICAL</text>
  <text x="297" y="128" font-size="18" font-weight="700" fill="#0F1115">Discovery</text>
  <text x="297" y="168" font-size="14" fill="#5C6167">Links are how crawlers<tspan x="297" dy="1.4em">find pages that nothing</tspan><tspan x="297" dy="1.4em">else points at.</tspan></text>

  <!-- 3 -->
  <rect x="552" y="50" width="246" height="180" rx="16" fill="#E7E9EC"/>
  <rect x="546" y="44" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="576" cy="74" r="15" fill="#0F1115"/>
  <text x="576" y="80" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <rect x="602" y="60" width="170" height="28" rx="999" fill="#E7E9EC"/>
  <text x="687" y="79" font-size="12" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">HEAVILY QUALIFIED</text>
  <text x="566" y="128" font-size="18" font-weight="700" fill="#0F1115">Ranking influence</text>
  <text x="566" y="168" font-size="14" fill="#5C6167">Still in the stack, but the<tspan x="566" dy="1.4em">size of the effect is not</tspan><tspan x="566" dy="1.4em">something you can see.</tspan></text>

  <!-- what measures none of them -->
  <rect x="14" y="254" width="784" height="94" rx="16" fill="#EE3D41"/>
  <rect x="8" y="248" width="784" height="94" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="278" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">MEASURES NONE OF THE THREE</text>
  <text x="34" y="306" font-size="17" font-weight="700" fill="#0F1115">Domain Authority, Domain Rating, Authority Score, Trust Flow, Spam Score</text>
  <text x="34" y="330" font-size="14" fill="#5C6167">Third-party estimates sold by the companies whose product is the estimate.</text>

  <text x="8" y="376" font-size="14" fill="#5C6167">Google has said for years that it does not have or use a site-wide authority score of that kind.</text>
</svg>
