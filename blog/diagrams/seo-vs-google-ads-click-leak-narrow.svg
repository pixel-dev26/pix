<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 606" width="380" height="606" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What a first-place ranking now buys</title>
  <desc id="d">Pew found users clicked a traditional result on 15 per cent of searches without an AI summary, 8 per cent with one, and 1 per cent on links inside the summary. Ahrefs found the share of AI Overview citations that also rank in the top 10 fell from roughly 76 per cent in July 2025 to 37.9 per cent in March 2026.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO MEASUREMENTS, ONE DIRECTION</text>

  <!-- Pew -->
  <rect x="13" y="39" width="359" height="232" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="232" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="60" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PEW, MARCH 2025</text>
  <text x="26" y="88" font-size="18" font-weight="700" fill="#0F1115">Clicks on a real result</text>

  <text x="26" y="118" font-size="13" fill="#5C6167">No AI summary on the page</text>
  <rect x="26" y="126" width="250" height="20" rx="6" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="286" y="142" font-size="14" font-weight="700" fill="#0F1115">15%</text>

  <text x="26" y="170" font-size="13" fill="#5C6167">An AI summary on the page</text>
  <rect x="26" y="178" width="133" height="20" rx="6" fill="#FA6B45" stroke="#0F1115" stroke-width="2"/>
  <text x="169" y="194" font-size="14" font-weight="700" fill="#0F1115">8%</text>

  <text x="26" y="222" font-size="13" fill="#5C6167">Links inside the summary</text>
  <rect x="26" y="230" width="17" height="20" rx="4" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="53" y="246" font-size="14" font-weight="700" fill="#0F1115">1%</text>

  <!-- Ahrefs -->
  <rect x="13" y="291" width="359" height="180" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="286" width="359" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="312" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">AHREFS, 863,000 SERPS</text>
  <text x="26" y="340" font-size="17" font-weight="700" fill="#0F1115">AI Overview citations that<tspan x="26" dy="1.35em">also rank in the top 10</tspan></text>

  <text x="100" y="418" font-size="34" font-weight="700" fill="#0F1115" text-anchor="middle">~76%</text>
  <text x="280" y="418" font-size="34" font-weight="700" fill="#EE3D41" text-anchor="middle">37.9%</text>
  <path d="M158 406 L200 406" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <text x="100" y="442" font-size="13" fill="#5C6167" text-anchor="middle">July 2025</text>
  <text x="280" y="442" font-size="13" fill="#5C6167" text-anchor="middle">March 2026</text>

  <!-- the conclusion -->
  <rect x="13" y="493" width="359" height="104" rx="16" fill="#FDB914"/>
  <rect x="8" y="488" width="359" height="104" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="514" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PUT THEM TOGETHER</text>
  <text x="26" y="540" font-size="15" font-weight="700" fill="#0F1115">Fewer clicks per ranking,<tspan x="26" dy="1.35em">and no guaranteed place</tspan><tspan x="26" dy="1.35em">inside the AI answer.</tspan></text>
</svg>
