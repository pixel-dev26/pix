<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 442" width="800" height="442" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Two cost shapes: Shopify grows with your sales, WooCommerce mostly does not</title>
  <desc id="d">A schematic with no numbers on either axis. Shopify starts cheap and rises with every order because it charges a fee on any payment provider other than Shopify Payments, which is not offered in India. WooCommerce starts higher and stays roughly flat, taking no cut of sales. The two lines cross, and where they cross depends on your own volume.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">COST TO YOU, EACH MONTH</text>

  <path d="M70 40 L70 268 L604 268" fill="none" stroke="#8E959D" stroke-width="2"/>

  <path d="M70 240 L600 70" fill="none" stroke="#4A90C7" stroke-width="3"/>
  <path d="M70 150 L600 120" fill="none" stroke="#5FBFA8" stroke-width="3"/>

  <path d="M411 131 L411 268" stroke="#8E959D" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="411" cy="131" r="6" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="70" y="290" font-size="13" fill="#6A6F75">YOUR MONTHLY SALES &#8594;</text>
  <text x="411" y="290" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">they cross here</text>

  <rect x="616" y="56" width="22" height="10" rx="5" fill="#4A90C7"/>
  <text x="646" y="66" font-size="14" font-weight="700" fill="#0F1115">SHOPIFY</text>
  <text x="616" y="92" font-size="13" fill="#5C6167">Low fixed cost, plus a<tspan x="616" dy="1.35em">percentage of every order,</tspan><tspan x="616" dy="1.35em">permanently, in India.</tspan></text>

  <rect x="616" y="156" width="22" height="10" rx="5" fill="#5FBFA8"/>
  <text x="646" y="166" font-size="14" font-weight="700" fill="#0F1115">WOOCOMMERCE</text>
  <text x="616" y="192" font-size="13" fill="#5C6167">Higher fixed cost, and<tspan x="616" dy="1.35em">no cut of your sales.</tspan></text>

  <rect x="14" y="318" width="784" height="96" rx="16" fill="#FDB914"/>
  <rect x="8" y="312" width="784" height="96" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="340" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE FEE ON EVERY ORDER, BECAUSE SHOPIFY PAYMENTS IS NOT OFFERED IN INDIA</text>

  <rect x="34" y="354" width="136" height="44" rx="12" fill="#4A90C7"/>
  <text x="102" y="382" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">Basic 2%</text>
  <rect x="183" y="354" width="136" height="44" rx="12" fill="#4A90C7"/>
  <text x="251" y="382" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">Grow 1%</text>
  <rect x="332" y="354" width="136" height="44" rx="12" fill="#4A90C7"/>
  <text x="400" y="382" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">Advanced 0.6%</text>
  <rect x="481" y="354" width="136" height="44" rx="12" fill="#4A90C7"/>
  <text x="549" y="382" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">Plus 0.2%</text>
  <rect x="630" y="354" width="136" height="44" rx="12" fill="#5FBFA8"/>
  <text x="698" y="382" font-size="15" font-weight="700" fill="#0F1115" text-anchor="middle">Woo 0%</text>

  <text x="8" y="432" font-size="13" fill="#5C6167">Shape, not scale. There are no numbers on the axes because where the lines cross depends on your own volume.</text>
</svg>
