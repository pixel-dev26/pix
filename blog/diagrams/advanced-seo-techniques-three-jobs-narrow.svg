<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 612" width="380" height="612" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Advanced SEO in 2026 is three jobs</title>
  <desc id="d">Three jobs: publish something a competitor cannot copy; make the page fast and machine-readable, with LCP within 2.5 seconds, INP of 200 milliseconds or less and CLS of 0.1 or less; and earn mentions. Every technique is a way of doing one of the three, and anything that is not is decoration.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE JOBS, AND THE REST</text>

  <!-- 1 -->
  <rect x="13" y="39" width="359" height="136" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="136" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="62" r="14" fill="#0F1115"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="24" y="100" font-size="17" font-weight="700" fill="#0F1115">Publish what a competitor<tspan x="24" dy="1.3em">cannot copy</tspan></text>
  <text x="24" y="150" font-size="14" fill="#5C6167">The lever Google itself names first.</text>

  <!-- 2 -->
  <rect x="13" y="191" width="359" height="164" rx="16" fill="#4A90C7"/>
  <rect x="8" y="186" width="359" height="164" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="214" r="14" fill="#0F1115"/>
  <text x="36" y="219" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="24" y="252" font-size="17" font-weight="700" fill="#0F1115">Fast and machine-readable</text>
  <text x="24" y="282" font-size="14" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">LCP</tspan> within 2.5 seconds</text>
  <text x="24" y="306" font-size="14" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">INP</tspan> 200 milliseconds or less</text>
  <text x="24" y="330" font-size="14" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">CLS</tspan> 0.1 or less</text>

  <!-- 3 -->
  <rect x="13" y="371" width="359" height="136" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="366" width="359" height="136" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="394" r="14" fill="#0F1115"/>
  <text x="36" y="399" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="24" y="432" font-size="17" font-weight="700" fill="#0F1115">Earn mentions</text>
  <text x="24" y="462" font-size="14" fill="#5C6167">Google and the AI engines both decide<tspan x="24" dy="1.55em">who to trust by reading what others say.</tspan></text>

  <rect x="13" y="523" width="359" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="518" width="359" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="546" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">EVERY TECHNIQUE IS ONE OF THESE</text>
  <text x="24" y="574" font-size="16" font-weight="700" fill="#0F1115">Anything else is decoration.</text>
</svg>
