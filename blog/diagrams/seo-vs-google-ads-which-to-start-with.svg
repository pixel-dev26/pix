<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 498" width="800" height="498" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Which channel to start with</title>
  <desc id="d">A two-way decision. Start with Google Ads if you need revenue this quarter, do not yet know which services people search for, sell against unambiguous search intent, or have a margin that covers a cost per lead you worked out yourself. Start with SEO if your buyer researches for weeks, you are routinely compared against other firms, your cost per click is punishing, or you want to be quotable by AI assistants as well as rankable.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE QUESTION, TWO HONEST ANSWERS</text>

  <rect x="256" y="40" width="300" height="48" rx="999" fill="#FDB914"/>
  <rect x="250" y="34" width="300" height="48" rx="999" fill="#0F1115"/>
  <text x="400" y="64" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Which do you start with?</text>

  <path d="M400 90 L400 108 M180 108 L620 108" fill="none" stroke="#0F1115" stroke-width="2"/>
  <path d="M180 108 L180 128" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M620 108 L620 128" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Google Ads -->
  <rect x="14" y="140" width="382" height="268" rx="16" fill="#FA6B45"/>
  <rect x="8" y="134" width="382" height="268" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="174" font-size="18" font-weight="700" fill="#0F1115">Start with Google Ads if</text>

  <circle cx="34" cy="201" r="4" fill="#0F1115"/>
  <text x="50" y="206" font-size="13" fill="#5C6167">You need revenue inside the current quarter</text>
  <circle cx="34" cy="249" r="4" fill="#0F1115"/>
  <text x="50" y="254" font-size="13" fill="#5C6167">You do not yet know which services people<tspan x="50" dy="1.35em">actually search for</tspan></text>
  <circle cx="34" cy="297" r="4" fill="#0F1115"/>
  <text x="50" y="302" font-size="13" fill="#5C6167">The buyer&#8217;s search is unambiguous: emergency<tspan x="50" dy="1.35em">plumbing, a replacement part, a product code</tspan></text>
  <circle cx="34" cy="345" r="4" fill="#0F1115"/>
  <text x="50" y="350" font-size="13" fill="#5C6167">Your margin covers a cost per lead you worked<tspan x="50" dy="1.35em">out yourself, not one from a blog post</tspan></text>

  <!-- SEO -->
  <rect x="416" y="140" width="382" height="268" rx="16" fill="#4A90C7"/>
  <rect x="410" y="134" width="382" height="268" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="174" font-size="18" font-weight="700" fill="#0F1115">Start with SEO if</text>

  <circle cx="436" cy="201" r="4" fill="#0F1115"/>
  <text x="452" y="206" font-size="13" fill="#5C6167">Your buyer researches for weeks before<tspan x="452" dy="1.35em">contacting anyone at all</tspan></text>
  <circle cx="436" cy="249" r="4" fill="#0F1115"/>
  <text x="452" y="254" font-size="13" fill="#5C6167">You are compared against three other firms<tspan x="452" dy="1.35em">and have to look like you know the subject</tspan></text>
  <circle cx="436" cy="297" r="4" fill="#0F1115"/>
  <text x="452" y="302" font-size="13" fill="#5C6167">Your cost per click is punishing and the<tspan x="452" dy="1.35em">budget cannot absorb a learning period</tspan></text>
  <circle cx="436" cy="345" r="4" fill="#0F1115"/>
  <text x="452" y="350" font-size="13" fill="#5C6167">You want to be quotable by AI assistants<tspan x="452" dy="1.35em">as well as rankable</tspan></text>

  <!-- both -->
  <rect x="14" y="428" width="784" height="62" rx="16" fill="#FDB914"/>
  <rect x="8" y="422" width="784" height="62" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="448" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AND IF YOU CAN AFFORD BOTH</text>
  <text x="34" y="472" font-size="15" font-weight="700" fill="#0F1115">Run both. Paid search teaches you in weeks what organic would take a year to teach you.</text>
</svg>
