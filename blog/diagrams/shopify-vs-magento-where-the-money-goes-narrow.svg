<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 434" width="380" height="434" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">On a Shopify Basic store in India, the plan fee is dwarfed by transaction costs</title>
  <desc id="d">Two bars to scale. The Shopify Basic plan fee of 1,499 rupees a month is a sliver beside about 43,600 rupees of transaction costs on a month of 10,00,000 rupees in sales: 20,000 to Shopify at 2 percent, 20,000 to the gateway at 2 percent, and 3,600 of GST on the gateway fee.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE MONTH AT &#8377;10,00,000 IN SALES</text>

  <rect x="13" y="39" width="359" height="270" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="270" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="64" font-size="15" font-weight="700" fill="#0F1115">Plan fee, Shopify Basic</text>
  <rect x="26" y="76" width="10" height="26" rx="5" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <text x="48" y="95" font-size="17" font-weight="700" fill="#0F1115">&#8377;1,499</text>

  <text x="26" y="140" font-size="15" font-weight="700" fill="#0F1115">Transaction fees, same month</text>
  <rect x="26" y="152" width="138" height="26" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <rect x="164" y="152" width="138" height="26" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <rect x="302" y="152" width="25" height="26" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="204" font-size="20" font-weight="700" fill="#0F1115">&#8377;43,600</text>

  <rect x="26" y="222" width="13" height="13" rx="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="46" y="233" font-size="13" fill="#5C6167">Shopify fee, 2% &#8212; &#8377;20,000</text>
  <rect x="26" y="248" width="13" height="13" rx="4" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="46" y="259" font-size="13" fill="#5C6167">Razorpay, 2% &#8212; &#8377;20,000</text>
  <rect x="26" y="274" width="13" height="13" rx="4" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="46" y="285" font-size="13" fill="#5C6167">18% GST on that fee &#8212; &#8377;3,600</text>

  <text x="8" y="346" font-size="15" font-weight="700" fill="#0F1115">The subscription was never<tspan x="8" dy="1.35em">the expensive part.</tspan></text>
  <text x="8" y="404" font-size="13" fill="#5C6167">Shopify Payments is not offered in India,<tspan x="8" dy="1.4em">so the platform fee is permanent.</tspan></text>
</svg>
