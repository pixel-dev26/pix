<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 600" width="380" height="600" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Generating is free. Publishing is the gate.</title>
  <desc id="d">Three stages. Before the prompt, nobody builds for you: what you sell, who you are against, and what the page has to make somebody do. Generating is free on Wix and Squarespace, with 500 trial credits on Framer. Publishing is where the money starts: Squarespace requires a paid account to publish anything, and Wix requires a Premium Plan for a custom domain or online payments.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">FREE TO BUILD, PAID TO PUBLISH</text>

  <rect x="13" y="39" width="359" height="112" rx="16" fill="#D098F9"/>
  <rect x="8" y="34" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="68" font-size="18" font-weight="700" fill="#0F1115">Before the prompt</text>
  <rect x="284" y="50" width="66" height="24" rx="999" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="317" y="67" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">YOURS</text>
  <text x="26" y="100" font-size="13" fill="#5C6167">What you sell. Who you are against.<tspan x="26" dy="1.4em">What the page must make someone do.</tspan></text>
  <text x="26" y="136" font-size="13" fill="#6A6F75">No builder decides any of it.</text>

  <path d="M187 152 L187 166" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="175" width="359" height="112" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="170" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="204" font-size="18" font-weight="700" fill="#0F1115">Generating</text>
  <rect x="290" y="186" width="60" height="24" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="320" y="203" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">FREE</text>
  <text x="26" y="236" font-size="13" fill="#5C6167">Wix builds with AI for free. Squarespace<tspan x="26" dy="1.4em">Blueprint AI is free to use.</tspan></text>
  <text x="26" y="272" font-size="13" fill="#6A6F75">Framer gives 500 credits to try.</text>

  <path d="M187 288 L187 302" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="311" width="359" height="112" rx="16" fill="#EE3D41"/>
  <rect x="8" y="306" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="340" font-size="18" font-weight="700" fill="#0F1115">Publishing</text>
  <rect x="290" y="322" width="60" height="24" rx="999" fill="#EE3D41"/>
  <text x="320" y="339" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PAID</text>
  <text x="26" y="372" font-size="13" fill="#5C6167">Squarespace needs a paid account to<tspan x="26" dy="1.4em">publish. Wix needs a Premium Plan.</tspan></text>
  <text x="26" y="408" font-size="13" fill="#6A6F75">The gate is here, not earlier.</text>

  <rect x="13" y="443" width="359" height="150" rx="16" fill="#FDB914"/>
  <rect x="8" y="438" width="359" height="150" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="464" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">AND THE AI ITSELF IS METERED</text>
  <text x="26" y="490" font-size="14" font-weight="700" fill="#0F1115">Squarespace: 10 one-time credits<tspan x="26" dy="1.4em">to 120 a month.</tspan></text>
  <text x="26" y="542" font-size="14" fill="#5C6167">Framer: 500 to try, 1,000 on Basic,<tspan x="26" dy="1.4em">3,000 on Pro.</tspan></text>
</svg>
