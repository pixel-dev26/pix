<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 472" width="800" height="472" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Freelancer or agency: which failure you can absorb</title>
  <desc id="d">One question decides it. If nothing much breaks when the work stops for two weeks, hire a freelancer; the work is one person's job and the steps can run in sequence. If a launch date, a campaign or a store is riding on it, hire an agency, because you are buying cover.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">NOT WHICH IS BETTER &#8212; WHICH FAILURE YOU CAN ABSORB</text>

  <rect x="14" y="40" width="784" height="64" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="784" height="64" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="400" y="74" font-size="19" font-weight="700" fill="#0F1115" text-anchor="middle">What breaks if the work stops for two weeks?</text>

  <path d="M400 104 L400 124 L200 124 L200 146" fill="none" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M400 104 L400 124 L600 124 L600 146" fill="none" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="14" y="156" width="384" height="216" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="150" width="384" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="30" y="170" width="132" height="28" rx="14" fill="#0F1115"/>
  <text x="96" y="189" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FREELANCER</text>
  <text x="30" y="234" font-size="19" font-weight="700" fill="#0F1115">If the answer is<tspan x="30" dy="1.3em">&#8220;nothing much&#8221;</tspan></text>
  <text x="30" y="296" font-size="14" fill="#5C6167">The work is genuinely one person&#8217;s job<tspan x="30" dy="1.4em">and the steps can run in sequence.</tspan></text>
  <text x="30" y="348" font-size="14" font-weight="700" fill="#0F1115">Risk you accept: one point of failure.</text>

  <rect x="414" y="156" width="384" height="216" rx="16" fill="#4A90C7"/>
  <rect x="408" y="150" width="384" height="216" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="430" y="170" width="104" height="28" rx="14" fill="#0F1115"/>
  <text x="482" y="189" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AGENCY</text>
  <text x="430" y="234" font-size="19" font-weight="700" fill="#0F1115">If it is a launch date,<tspan x="430" dy="1.3em">a campaign or a store</tspan></text>
  <text x="430" y="296" font-size="14" fill="#5C6167">Design, code, content and coordination<tspan x="430" dy="1.4em">have to run at the same time.</tspan></text>
  <text x="430" y="348" font-size="14" font-weight="700" fill="#0F1115">Cost you accept: you pay for the structure.</text>

  <rect x="14" y="392" width="784" height="72" rx="16" fill="#FDB914"/>
  <rect x="8" y="386" width="784" height="72" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="414" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE ONE TEST THAT WORKS ON BOTH</text>
  <text x="34" y="442" font-size="19" font-weight="700" fill="#0F1115">Which named people will do the work, and what is subcontracted?</text>
</svg>
