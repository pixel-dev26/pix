<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Theme update dates against the WordPress release they claim to support</title>
  <desc id="d">WordPress 7.0 was released on 20 May 2026. Iteck last changed its files on 28 September 2025, Spring on 7 January 2026 and Softwerk on 3 February 2026, and all three declare WordPress 7.0.x support. Engitech last changed its files on 4 April 2026 and honestly stops at 6.9.x. Stratus shipped on 21 May 2026, the day after 7.0.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT A &#8220;WORDPRESS 7.0 COMPATIBLE&#8221; CLAIM IS WORTH</text>

  <rect x="468" y="42" width="220" height="52" rx="16" fill="#FDB914"/>
  <rect x="462" y="36" width="220" height="52" rx="16" fill="#0F1115"/>
  <text x="572" y="60" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">WordPress 7.0</text>
  <text x="572" y="79" font-size="13" fill="#FFFFFF" text-anchor="middle">released 20 May 2026</text>
  <path d="M572 100 L572 286" stroke="#0F1115" stroke-width="2"/>

  <text x="8" y="122" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FILES LAST TOUCHED BEFORE 7.0 EXISTED</text>
  <text x="600" y="122" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AFTER</text>

  <rect x="14" y="140" width="125" height="130" rx="16" fill="#EE3D41"/>
  <rect x="8" y="134" width="125" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="22" y="168" font-size="15" font-weight="700" fill="#0F1115">Iteck</text>
  <text x="22" y="192" font-size="13" fill="#5C6167">28 Sep 2025</text>
  <rect x="22" y="210" width="97" height="26" rx="999" fill="#EE3D41"/>
  <text x="70" y="228" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="152" y="140" width="125" height="130" rx="16" fill="#EE3D41"/>
  <rect x="146" y="134" width="125" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="160" y="168" font-size="15" font-weight="700" fill="#0F1115">Spring</text>
  <text x="160" y="192" font-size="13" fill="#5C6167">7 Jan 2026</text>
  <rect x="160" y="210" width="97" height="26" rx="999" fill="#EE3D41"/>
  <text x="208" y="228" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="290" y="140" width="125" height="130" rx="16" fill="#EE3D41"/>
  <rect x="284" y="134" width="125" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="298" y="168" font-size="15" font-weight="700" fill="#0F1115">Softwerk</text>
  <text x="298" y="192" font-size="13" fill="#5C6167">3 Feb 2026</text>
  <rect x="298" y="210" width="97" height="26" rx="999" fill="#EE3D41"/>
  <text x="346" y="228" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <rect x="428" y="140" width="125" height="130" rx="16" fill="#5FBFA8"/>
  <rect x="422" y="134" width="125" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="436" y="168" font-size="15" font-weight="700" fill="#0F1115">Engitech</text>
  <text x="436" y="192" font-size="13" fill="#5C6167">4 Apr 2026</text>
  <rect x="436" y="210" width="105" height="26" rx="999" fill="#5FBFA8"/>
  <text x="488" y="228" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">Stops at 6.9</text>

  <rect x="606" y="140" width="192" height="130" rx="16" fill="#5FBFA8"/>
  <rect x="600" y="134" width="192" height="130" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="618" y="168" font-size="18" font-weight="700" fill="#0F1115">Stratus</text>
  <text x="618" y="192" font-size="14" fill="#5C6167">21 May 2026</text>
  <text x="618" y="212" font-size="12" fill="#5C6167">The day after 7.0 shipped.</text>
  <rect x="618" y="224" width="110" height="26" rx="999" fill="#5FBFA8"/>
  <text x="673" y="242" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">Claims 7.0</text>

  <text x="8" y="308" font-size="14" font-weight="700" fill="#0F1115">Three of these declare support for a WordPress release that did not<tspan x="8" dy="1.4em">exist when their code was last touched.</tspan></text>
  <text x="8" y="348" font-size="12" fill="#6A6F75">Shown in date order, not to scale. Read on each theme&#8217;s own ThemeForest listing, 30 July 2026.</text>
</svg>
