<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 546" width="380" height="546" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">CMS share of all websites, W3Techs, 30 July 2026</title>
  <desc id="d">Bars of each platform's share of all websites: WordPress 41.2 per cent, sites running no CMS W3Techs tracks 30.4 per cent, Shopify 5.3, Wix 4.3, Squarespace 2.5, Joomla 1.2, Webflow 0.8, Drupal 0.7, Adobe Commerce 0.3 and BigCommerce 0.1 per cent.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SHARE OF ALL WEBSITES, JULY 2026</text>

  <rect x="13" y="39" width="359" height="428" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="428" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="64" font-size="13" fill="#5C6167">WordPress</text>
  <text x="349" y="64" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">41.2%</text>
  <rect x="26" y="70" width="323" height="14" rx="7" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="104" font-size="13" fill="#5C6167">No CMS W3Techs tracks</text>
  <text x="349" y="104" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">30.4%</text>
  <rect x="26" y="110" width="238" height="14" rx="7" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="144" font-size="13" fill="#5C6167">Shopify</text>
  <text x="349" y="144" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">5.3%</text>
  <rect x="26" y="150" width="42" height="14" rx="7" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="184" font-size="13" fill="#5C6167">Wix</text>
  <text x="349" y="184" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">4.3%</text>
  <rect x="26" y="190" width="34" height="14" rx="7" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="224" font-size="13" fill="#5C6167">Squarespace</text>
  <text x="349" y="224" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">2.5%</text>
  <rect x="26" y="230" width="20" height="14" rx="7" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="264" font-size="13" fill="#5C6167">Joomla</text>
  <text x="349" y="264" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">1.2%</text>
  <rect x="26" y="270" width="9" height="14" rx="4" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="304" font-size="13" fill="#5C6167">Webflow</text>
  <text x="349" y="304" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">0.8%</text>
  <rect x="26" y="310" width="6" height="14" rx="3" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="344" font-size="13" fill="#5C6167">Drupal</text>
  <text x="349" y="344" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">0.7%</text>
  <rect x="26" y="350" width="5" height="14" rx="2" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="384" font-size="13" fill="#5C6167">Adobe Commerce</text>
  <text x="349" y="384" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">0.3%</text>
  <rect x="26" y="390" width="3" height="14" rx="1" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="424" font-size="13" fill="#5C6167">BigCommerce</text>
  <text x="349" y="424" font-size="13" font-weight="700" fill="#0F1115" text-anchor="end">0.1%</text>
  <rect x="26" y="430" width="3" height="14" rx="1" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>

  <text x="8" y="492" font-size="14" font-weight="700" fill="#0F1115">Eight times the platform in second place.</text>
  <text x="8" y="516" font-size="14" fill="#5C6167">The 30.4% on no tracked CMS beats<tspan x="8" dy="1.3em">everything below WordPress combined.</tspan></text>
</svg>
