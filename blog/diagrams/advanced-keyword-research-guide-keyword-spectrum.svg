<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Head, body and long-tail terms are one spectrum</title>
  <desc id="d">Three cards along a single spectrum. Head terms are one or two words with high recorded volume, brutal competition and vague intent. Body terms are three or four words with moderate volume, moderate competition and legible intent. Long-tail terms are longer and specific, with low recorded volume, low competition and the clearest intent.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE SPECTRUM, NOT TWO TAXONOMIES</text>

  <!-- head -->
  <rect x="14" y="46" width="246" height="214" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="246" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="74" height="26" rx="999" fill="#0F1115"/>
  <text x="65" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">HEAD</text>
  <text x="28" y="120" font-size="18" font-weight="700" fill="#0F1115">One or two words</text>
  <text x="28" y="144" font-size="14" fill="#6A6F75">&#8220;shoes&#8221;, &#8220;web design&#8221;</text>
  <path d="M28 178 L234 178" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="200" font-size="13" fill="#5C6167">Recorded volume</text>
  <text x="234" y="200" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">High</text>
  <text x="28" y="222" font-size="13" fill="#5C6167">Competition</text>
  <text x="234" y="222" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Brutal</text>
  <text x="28" y="244" font-size="13" fill="#5C6167">Intent</text>
  <text x="234" y="244" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Vague</text>

  <!-- body -->
  <rect x="283" y="46" width="246" height="214" rx="16" fill="#FDB914"/>
  <rect x="277" y="40" width="246" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="62" width="74" height="26" rx="999" fill="#0F1115"/>
  <text x="334" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">BODY</text>
  <text x="297" y="120" font-size="18" font-weight="700" fill="#0F1115">Three or four words</text>
  <text x="297" y="144" font-size="14" fill="#6A6F75">&#8220;ecommerce web design&#8221;</text>
  <path d="M297 178 L503 178" stroke="#E7E9EC" stroke-width="2"/>
  <text x="297" y="200" font-size="13" fill="#5C6167">Recorded volume</text>
  <text x="503" y="200" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Moderate</text>
  <text x="297" y="222" font-size="13" fill="#5C6167">Competition</text>
  <text x="503" y="222" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Moderate</text>
  <text x="297" y="244" font-size="13" fill="#5C6167">Intent</text>
  <text x="503" y="244" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Legible</text>

  <!-- long tail -->
  <rect x="552" y="46" width="246" height="214" rx="16" fill="#5FBFA8"/>
  <rect x="546" y="40" width="246" height="214" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="62" width="110" height="26" rx="999" fill="#0F1115"/>
  <text x="621" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LONG-TAIL</text>
  <text x="566" y="120" font-size="18" font-weight="700" fill="#0F1115">Longer and specific</text>
  <text x="566" y="144" font-size="14" fill="#6A6F75">&#8220;best running shoes<tspan x="566" dy="1.3em">for beginners&#8221;</tspan></text>
  <path d="M566 178 L772 178" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="200" font-size="13" fill="#5C6167">Recorded volume</text>
  <text x="772" y="200" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Low</text>
  <text x="566" y="222" font-size="13" fill="#5C6167">Competition</text>
  <text x="772" y="222" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Low</text>
  <text x="566" y="244" font-size="13" fill="#5C6167">Intent</text>
  <text x="772" y="244" font-size="14" font-weight="700" fill="#0F1115" text-anchor="end">Clearest</text>

  <path d="M262 148 L271 148" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M531 148 L540 148" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- the question that replaces the ratio -->
  <rect x="14" y="284" width="778" height="72" rx="16" fill="#FDB914"/>
  <rect x="8" y="278" width="778" height="72" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="308" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT I ASK INSTEAD OF A RATIO TO HIT</text>
  <text x="34" y="334" font-size="17" font-weight="700" fill="#0F1115">Can this page be the best answer on the internet to this specific question?</text>
</svg>
