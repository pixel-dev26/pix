<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The 2022 trend list, marked four years later</title>
  <desc id="d">Of twelve trends called in 2022, eight held cleanly, two held for reasons the original post got wrong, one was half right, and one was never a web design trend at all.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TWELVE CALLS FROM 2022, MARKED IN 2026</text>

  <rect x="14" y="46" width="784" height="168" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="784" height="168" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">STILL CURRENT, AND FOR THE REASON GIVEN</text>
  <text x="28" y="96" font-size="19" font-weight="700" fill="#0F1115">8 of 12 held cleanly</text>

  <rect x="28" y="112" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="115" y="134" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Micro-interactions</text>
  <rect x="218" y="112" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="305" y="134" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Scrapbook</text>
  <rect x="408" y="112" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="495" y="134" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Experimental nav</text>
  <rect x="598" y="112" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="685" y="134" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Brutalism</text>

  <rect x="28" y="156" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="115" y="178" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Neo-gradients</text>
  <rect x="218" y="156" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="305" y="178" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Dark mode</text>
  <rect x="408" y="156" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="495" y="178" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Scroll animations</text>
  <rect x="598" y="156" width="174" height="34" rx="17" fill="#5FBFA8"/>
  <text x="685" y="178" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Structured type</text>

  <rect x="14" y="234" width="246" height="118" rx="16" fill="#4A90C7"/>
  <rect x="8" y="228" width="246" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="256" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">RIGHT, WRONG REASON</text>
  <text x="28" y="286" font-size="19" font-weight="700" fill="#0F1115">2 of 12</text>
  <text x="28" y="312" font-size="14" fill="#5C6167">Artificial intelligence<tspan x="28" dy="1.4em">3D design</tspan></text>

  <rect x="283" y="234" width="246" height="118" rx="16" fill="#FDB914"/>
  <rect x="277" y="228" width="246" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="297" y="256" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">HALF RIGHT</text>
  <text x="297" y="286" font-size="19" font-weight="700" fill="#0F1115">1 of 12</text>
  <text x="297" y="312" font-size="14" fill="#5C6167">Ultra-minimalism became<tspan x="297" dy="1.4em">the default, not an edge</tspan></text>

  <rect x="552" y="234" width="246" height="118" rx="16" fill="#EE3D41"/>
  <rect x="546" y="228" width="246" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="566" y="256" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">NEVER A WEB TREND</text>
  <text x="566" y="286" font-size="19" font-weight="700" fill="#0F1115">1 of 12</text>
  <text x="566" y="312" font-size="14" fill="#5C6167">Minimal vintage, copied<tspan x="566" dy="1.4em">off a print list</tspan></text>

  <text x="8" y="372" font-size="14" font-weight="700" fill="#0F1115">The only one that died is the one borrowed from another medium.</text>
</svg>
