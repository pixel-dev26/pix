<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The order to work an SEO checklist in</title>
  <desc id="d">Six stages in sequence: access and measurement, technical crawlability, keyword and intent mapping, content, on-page polish, then links and local. Each stage gates the next, and content is the slowest and highest-return stage.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SEVENTY BOXES ARE NOT EQUAL BOXES</text>

  <!-- 1 -->
  <rect x="14" y="50" width="246" height="140" rx="16" fill="#4A90C7"/>
  <rect x="8" y="44" width="246" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="74" r="14" fill="#0F1115"/>
  <text x="38" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="112" font-size="16" font-weight="700" fill="#0F1115">Access and<tspan x="28" dy="1.25em">measurement</tspan></text>
  <text x="28" y="156" font-size="13" fill="#5C6167">Roughly an hour. Everything<tspan x="28" dy="1.3em">later needs this data.</tspan></text>

  <!-- 2 -->
  <rect x="283" y="50" width="246" height="140" rx="16" fill="#4A90C7"/>
  <rect x="277" y="44" width="246" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="307" cy="74" r="14" fill="#0F1115"/>
  <text x="307" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="297" y="112" font-size="16" font-weight="700" fill="#0F1115">Technical<tspan x="297" dy="1.25em">crawlability</tspan></text>
  <text x="297" y="156" font-size="13" fill="#5C6167">A page that cannot be<tspan x="297" dy="1.3em">fetched cannot rank.</tspan></text>

  <!-- 3 -->
  <rect x="552" y="50" width="246" height="140" rx="16" fill="#4A90C7"/>
  <rect x="546" y="44" width="246" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="576" cy="74" r="14" fill="#0F1115"/>
  <text x="576" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="566" y="112" font-size="16" font-weight="700" fill="#0F1115">Keyword and<tspan x="566" dy="1.25em">intent mapping</tspan></text>
  <text x="566" y="156" font-size="13" fill="#5C6167">Cheap to do, expensive<tspan x="566" dy="1.3em">to skip.</tspan></text>

  <path d="M258 114 L273 114" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M527 114 L542 114" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M669 192 L669 202 L131 202 L131 210" fill="none" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect x="14" y="222" width="246" height="140" rx="16" fill="#0F1115"/>
  <rect x="8" y="216" width="246" height="140" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="246" r="14" fill="#0F1115"/>
  <text x="38" y="251" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="28" y="284" font-size="16" font-weight="700" fill="#0F1115">Content</text>
  <text x="28" y="328" font-size="13" fill="#0F1115">The slowest and highest-<tspan x="28" dy="1.3em">return stage.</tspan></text>

  <!-- 5 -->
  <rect x="283" y="222" width="246" height="140" rx="16" fill="#5FBFA8"/>
  <rect x="277" y="216" width="246" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="307" cy="246" r="14" fill="#0F1115"/>
  <text x="307" y="251" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="297" y="284" font-size="16" font-weight="700" fill="#0F1115">On-page polish</text>
  <text x="297" y="328" font-size="13" fill="#5C6167">Fast wins, only on pages<tspan x="297" dy="1.3em">that deserve to rank.</tspan></text>

  <!-- 6 -->
  <rect x="552" y="222" width="246" height="140" rx="16" fill="#5FBFA8"/>
  <rect x="546" y="216" width="246" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="576" cy="246" r="14" fill="#0F1115"/>
  <text x="576" y="251" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="566" y="284" font-size="16" font-weight="700" fill="#0F1115">Links and local</text>
  <text x="566" y="328" font-size="13" fill="#5C6167">They compound, on top of<tspan x="566" dy="1.3em">something worth linking to.</tspan></text>

  <path d="M258 286 L273 286" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M527 286 L542 286" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <text x="8" y="390" font-size="14" fill="#5C6167">Each stage exists so the next one is not wasted. Stage 4 is the slowest and pays the most.</text>
</svg>
