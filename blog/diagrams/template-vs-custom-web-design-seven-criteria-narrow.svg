<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 586" width="380" height="586" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Seven criteria, and which answer each one points at</title>
  <desc id="d">Seven criteria, each with the condition that points at a template and the condition that points at a custom build: budget, complexity, audience, flexibility, outcome, time and functionality.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT DETERMINES THE CHOICE</text>

  <rect x="13" y="39" width="359" height="486" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="486" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <rect x="26" y="52" width="104" height="24" rx="999" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="78" y="69" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">TEMPLATE</text>
  <rect x="142" y="52" width="94" height="24" rx="999" fill="#0F1115"/>
  <text x="189" y="69" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CUSTOM</text>

  <text x="26" y="96" font-size="13" font-weight="700" fill="#0F1115">Budget</text>
  <circle cx="30" cy="114" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="118" font-size="13" fill="#5C6167">What the site must earn is small</text>
  <circle cx="30" cy="134" r="4" fill="#0F1115"/>
  <text x="44" y="138" font-size="13" fill="#5C6167">A professional service, priced like one</text>

  <text x="26" y="158" font-size="13" font-weight="700" fill="#0F1115">Complexity</text>
  <circle cx="30" cy="176" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="180" font-size="13" fill="#5C6167">A simple site with no frills</text>
  <circle cx="30" cy="196" r="4" fill="#0F1115"/>
  <text x="44" y="200" font-size="13" fill="#5C6167">Interactive content or e-commerce</text>

  <text x="26" y="220" font-size="13" font-weight="700" fill="#0F1115">Audience</text>
  <circle cx="30" cy="238" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="242" font-size="13" fill="#5C6167">A general market expecting a normal site</text>
  <circle cx="30" cy="258" r="4" fill="#0F1115"/>
  <text x="44" y="262" font-size="13" fill="#5C6167">A niche templates do not carry</text>

  <text x="26" y="282" font-size="13" font-weight="700" fill="#0F1115">Flexibility</text>
  <circle cx="30" cy="300" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="304" font-size="13" fill="#5C6167">Every extension negotiates with the theme</text>
  <circle cx="30" cy="320" r="4" fill="#0F1115"/>
  <text x="44" y="324" font-size="13" fill="#5C6167">New functions planned from the start</text>

  <text x="26" y="344" font-size="13" font-weight="700" fill="#0F1115">Outcome</text>
  <circle cx="30" cy="362" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="366" font-size="13" fill="#5C6167">A conventional presence is enough</text>
  <circle cx="30" cy="382" r="4" fill="#0F1115"/>
  <text x="44" y="386" font-size="13" fill="#5C6167">A presence recognisably yours</text>

  <text x="26" y="406" font-size="13" font-weight="700" fill="#0F1115">Time</text>
  <circle cx="30" cy="424" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="428" font-size="13" fill="#5C6167">Live this month</text>
  <circle cx="30" cy="444" r="4" fill="#0F1115"/>
  <text x="44" y="448" font-size="13" fill="#5C6167">Three months is the honest minimum</text>

  <text x="26" y="468" font-size="13" font-weight="700" fill="#0F1115">Functionality</text>
  <circle cx="30" cy="486" r="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="44" y="490" font-size="13" fill="#5C6167">Simple transactions</text>
  <circle cx="30" cy="506" r="4" fill="#0F1115"/>
  <text x="44" y="510" font-size="13" fill="#5C6167">Unusual workflows and integrations</text>

  <text x="8" y="552" font-size="15" font-weight="700" fill="#0F1115">A place to be found: template.</text>
  <text x="8" y="574" font-size="15" font-weight="700" fill="#0F1115">Something that must persuade: custom.</text>
</svg>
