<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" width="800" height="374" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The advertised $5 gig costs the buyer $8.78 and pays the seller $4</title>
  <desc id="d">Three figures side by side. The listing says 5 dollars. The buyer pays about 8.78 dollars once the 5.5 percent plus 3.50 dollar small-order fee is applied, a 75 percent markup. The seller receives 4 dollars, because Fiverr takes 20 percent of the order.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE $5 GIG, PRICED HONESTLY</text>

  <rect x="14" y="46" width="246" height="180" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="40" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="30" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ADVERTISED PRICE</text>
  <text x="30" y="128" font-size="44" font-weight="700" fill="#0F1115">$5</text>
  <text x="30" y="162" font-size="13" fill="#5C6167">What the listing says, and<tspan x="30" dy="1.45em">the number in the search</tspan><tspan x="30" dy="1.45em">results.</tspan></text>

  <rect x="283" y="46" width="246" height="180" rx="16" fill="#FA6B45"/>
  <rect x="277" y="40" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="299" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THE BUYER PAYS</text>
  <text x="299" y="128" font-size="44" font-weight="700" fill="#0F1115">$8.78</text>
  <text x="299" y="162" font-size="13" fill="#5C6167">5.5% plus $3.50 on any<tspan x="299" dy="1.45em">order under $200. A 75%</tspan><tspan x="299" dy="1.45em">markup on the sticker.</tspan></text>

  <rect x="552" y="46" width="246" height="180" rx="16" fill="#EE3D41"/>
  <rect x="546" y="40" width="246" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="568" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT YOU RECEIVE</text>
  <text x="568" y="128" font-size="44" font-weight="700" fill="#0F1115">$4</text>
  <text x="568" y="162" font-size="13" fill="#5C6167">Fiverr takes 20% of the<tspan x="568" dy="1.45em">order, described on the</tspan><tspan x="568" dy="1.45em">seller's side as earning 80%.</tspan></text>

  <rect x="14" y="264" width="784" height="100" rx="16" fill="#FDB914"/>
  <rect x="8" y="258" width="784" height="100" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="286" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">AND THE MARKETPLACE IN THE SEC FILING IS A DIFFERENT PLACE</text>
  <text x="34" y="312" font-size="14" fill="#5C6167">Fiverr's own Form 20-F reports annual spend per buyer of $342, and that 66% of revenue comes</text>
  <text x="34" y="336" font-size="14" fill="#5C6167">from buyers spending more than $500. The $5 floor is a doorway, not a price.</text>
</svg>
