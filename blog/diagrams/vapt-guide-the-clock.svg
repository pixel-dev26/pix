<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The Indian compliance clock: six hours, 180 days, and the penalty ladder</title>
  <desc id="d">CERT-In's directions under section 70B require a listed incident to be reported within six hours of noticing it, and ICT logs to be kept for a rolling 180 days inside Indian jurisdiction. Under the DPDP Act the maximum penalties are 250 crore rupees for failing to maintain reasonable security safeguards, 200 crore for failing to notify a personal data breach, and 50 crore for any other violation.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT INDIAN LAW PUTS ON THE CLOCK</text>

  <!-- CERT-In -->
  <rect x="14" y="46" width="382" height="252" rx="16" fill="#EE3D41"/>
  <rect x="8" y="40" width="382" height="252" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">CERT-IN, SECTION 70B DIRECTIONS</text>
  <text x="28" y="118" font-size="34" font-weight="700" fill="#0F1115">6 hours</text>
  <text x="28" y="146" font-size="14" fill="#5C6167">to report a listed incident, from the<tspan x="28" dy="1.4em">moment you notice it.</tspan></text>
  <path d="M28 190 L370 190" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="232" font-size="34" font-weight="700" fill="#0F1115">180 days</text>
  <text x="28" y="260" font-size="14" fill="#5C6167">of ICT logs, maintained inside<tspan x="28" dy="1.4em">Indian jurisdiction.</tspan></text>

  <!-- DPDP penalties -->
  <rect x="416" y="46" width="382" height="252" rx="16" fill="#FDB914"/>
  <rect x="410" y="40" width="382" height="252" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">DPDP ACT, MAXIMUM PENALTIES</text>
  <text x="430" y="112" font-size="22" font-weight="700" fill="#0F1115">&#8377;250 crore</text>
  <text x="430" y="134" font-size="13" fill="#5C6167">Failure to maintain reasonable security safeguards</text>
  <text x="430" y="180" font-size="22" font-weight="700" fill="#0F1115">&#8377;200 crore</text>
  <text x="430" y="202" font-size="13" fill="#5C6167">Failure to notify a personal data breach</text>
  <text x="430" y="248" font-size="22" font-weight="700" fill="#0F1115">&#8377;50 crore</text>
  <text x="430" y="270" font-size="13" fill="#5C6167">Any other violation</text>

  <!-- evidence -->
  <rect x="14" y="318" width="784" height="76" rx="16" fill="#4A90C7"/>
  <rect x="8" y="312" width="784" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="340" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT COUNTS AS EVIDENCE</text>
  <text x="34" y="366" font-size="15" font-weight="700" fill="#0F1115">No checklist is provided. Dated test reports, a remediation log and a retest are it.</text>
</svg>
