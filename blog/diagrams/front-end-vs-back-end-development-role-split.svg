<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Full-stack, back-end and front-end as declared developer roles</title>
  <desc id="d">Three bars from the Stack Overflow 2025 Developer Survey of 43,560 respondents: full-stack developer 27 per cent, back-end developer 14.2 per cent, front-end developer 4.3 per cent.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT 43,560 DEVELOPERS SAID THEY DO</text>

  <text x="8" y="87" font-size="17" font-weight="700" fill="#0F1115">Full-stack</text>
  <rect x="244" y="62" width="548" height="48" rx="16" fill="#FDB914"/>
  <rect x="238" y="56" width="548" height="48" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="256" y="87" font-size="17" font-weight="700" fill="#0F1115">27%</text>

  <text x="8" y="163" font-size="17" font-weight="700" fill="#0F1115">Back-end</text>
  <rect x="244" y="138" width="288" height="48" rx="16" fill="#5FBFA8"/>
  <rect x="238" y="132" width="288" height="48" rx="16" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="256" y="163" font-size="17" font-weight="700" fill="#0F1115">14.2%</text>

  <text x="8" y="239" font-size="17" font-weight="700" fill="#0F1115">Front-end</text>
  <rect x="244" y="214" width="87" height="48" rx="16" fill="#4A90C7"/>
  <rect x="238" y="208" width="87" height="48" rx="16" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="256" y="239" font-size="17" font-weight="700" fill="#0F1115">4.3%</text>

  <text x="8" y="294" font-size="14" font-weight="700" fill="#0F1115">Full-stack came first. This split describes a syllabus better than it<tspan x="8" dy="1.4em">describes a person.</tspan></text>
  <text x="8" y="340" font-size="12" fill="#6A6F75">Stack Overflow 2025 Developer Survey. Front-end ties with desktop and enterprise developers.</text>
</svg>
