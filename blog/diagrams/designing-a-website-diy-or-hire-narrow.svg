<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="380" height="620" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where do-it-yourself is the right call, and where it stops being one</title>
  <desc id="d">The dividing line is not budget but whether the site has a job that can fail. Build it yourself when you are testing the business, the site is a formality, you are the product, or you enjoy it. Stop and hire when you look identical to your competitor, the site must sell something complicated, search and AI visibility are the point, or you have outgrown the plan.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">BUILD IT YOURSELF, OR NOT</text>

  <rect x="13" y="39" width="359" height="88" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="88" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="58" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE DIVIDING LINE</text>
  <text x="24" y="82" font-size="16" font-weight="700" fill="#0F1115">Not budget &#8212; whether the site<tspan x="24" dy="1.35em">has a job that can fail.</tspan></text>

  <!-- build it yourself -->
  <rect x="13" y="149" width="359" height="206" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="144" width="359" height="206" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="158" width="192" height="28" rx="14" ry="14" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="120" y="177" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">BUILD IT YOURSELF</text>
  <path d="M24 200 L351 200" stroke="#E7E9EC" stroke-width="2"/>

  <circle cx="30" cy="215" r="4" fill="#0F1115"/>
  <text x="44" y="220" font-size="14" fill="#5C6167">You are testing whether the<tspan x="44" dy="1.3em">business works at all.</tspan></text>
  <circle cx="30" cy="257" r="4" fill="#0F1115"/>
  <text x="44" y="262" font-size="14" fill="#5C6167">The site is a formality: address,<tspan x="44" dy="1.3em">hours, phone, a form.</tspan></text>
  <circle cx="30" cy="299" r="4" fill="#0F1115"/>
  <text x="44" y="304" font-size="14" fill="#5C6167">You are the product.</text>
  <circle cx="30" cy="329" r="4" fill="#0F1115"/>
  <text x="44" y="334" font-size="14" fill="#5C6167">You genuinely enjoy it.</text>

  <!-- stop and hire -->
  <rect x="13" y="377" width="359" height="206" rx="16" fill="#FA6B45"/>
  <rect x="8" y="372" width="359" height="206" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="386" width="152" height="28" rx="14" ry="14" fill="#FA6B45" stroke="#0F1115" stroke-width="2"/>
  <text x="100" y="405" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">STOP AND HIRE</text>
  <path d="M24 428 L351 428" stroke="#E7E9EC" stroke-width="2"/>

  <circle cx="30" cy="443" r="4" fill="#0F1115"/>
  <text x="44" y="448" font-size="14" fill="#5C6167">You look identical to your competitor.</text>
  <circle cx="30" cy="475" r="4" fill="#0F1115"/>
  <text x="44" y="480" font-size="14" fill="#5C6167">The site has to sell something<tspan x="44" dy="1.3em">complicated.</tspan></text>
  <circle cx="30" cy="517" r="4" fill="#0F1115"/>
  <text x="44" y="522" font-size="14" fill="#5C6167">Search and AI visibility are the point.</text>
  <circle cx="30" cy="551" r="4" fill="#0F1115"/>
  <text x="44" y="556" font-size="14" fill="#5C6167">You have outgrown the plan.</text>

  <text x="8" y="608" font-size="14" fill="#5C6167">Either answer can be right. Not knowing is not.</text>
</svg>
