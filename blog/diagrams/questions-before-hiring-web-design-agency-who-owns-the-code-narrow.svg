<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 650" width="380" height="650" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Paying the invoice does not transfer copyright in your website</title>
  <desc id="d">Three stages. You pay in full. Under Section 17 of the Copyright Act 1957 the author is the first owner, and the commissioned-work exception covers photographs, paintings and films rather than code. Under Section 19 an assignment must be in writing and signed, stating the work, the rights, the duration and the territory — and if the duration is not stated it is deemed to be five years.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THE INVOICE DOES NOT BUY</text>

  <rect x="13" y="45" width="359" height="118" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="359" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="64" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE ASSUMPTION</text>
  <text x="24" y="90" font-size="16" font-weight="700" fill="#0F1115">You pay in full</text>
  <text x="24" y="116" font-size="13" fill="#5C6167">It is natural to assume this buys<tspan x="24" dy="1.3em">you the copyright in the work.</tspan></text>

  <path d="M190 167 L190 187" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="197" width="359" height="118" rx="16" fill="#FDB914"/>
  <rect x="8" y="192" width="359" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="216" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SECTION 17</text>
  <text x="24" y="242" font-size="16" font-weight="700" fill="#0F1115">The author is first owner</text>
  <text x="24" y="268" font-size="13" fill="#5C6167">The commissioned-work exception<tspan x="24" dy="1.3em">covers photos and films, not code.</tspan></text>

  <path d="M190 319 L190 339" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="349" width="359" height="118" rx="16" fill="#FDB914"/>
  <rect x="8" y="344" width="359" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="368" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SECTION 19</text>
  <text x="24" y="394" font-size="16" font-weight="700" fill="#0F1115">Assignment must be written</text>
  <text x="24" y="420" font-size="13" fill="#5C6167">Signed, stating the work, the rights,<tspan x="24" dy="1.3em">the duration and the territory.</tspan></text>

  <rect x="13" y="491" width="359" height="120" rx="16" fill="#EE3D41"/>
  <rect x="8" y="486" width="359" height="120" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="512" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE CLAUSE THAT CATCHES PEOPLE OUT</text>
  <text x="24" y="540" font-size="15" font-weight="700" fill="#0F1115">Duration not stated? Deemed<tspan x="24" dy="1.3em">five years from the assignment.</tspan></text>
  <text x="24" y="590" font-size="13" fill="#5C6167">A five-year licence over your own site.</text>

  <text x="8" y="640" font-size="13" fill="#6A6F75">Copyright Act, 1957, sections 17 and 19.</text>
</svg>
