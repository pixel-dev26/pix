<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 696" width="380" height="696" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The OWASP Top 10:2025, in order</title>
  <desc id="d">The current released order is Broken Access Control, Security Misconfiguration, Software Supply Chain Failures, Cryptographic Failures, Injection, Insecure Design, Authentication Failures, Software or Data Integrity Failures, Security Logging and Alerting Failures, and Mishandling of Exceptional Conditions. Server-side request forgery was merged into Broken Access Control, misconfiguration is now second, supply chain replaced Vulnerable and Outdated Components, and the tenth category is new.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">OWASP TOP 10:2025, IN ORDER</text>

  <rect x="13" y="39" width="359" height="52" rx="14" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="52" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="60" r="15" fill="#0F1115"/>
  <text x="36" y="65" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="58" font-size="14" font-weight="700" fill="#0F1115">Broken Access Control</text>
  <text x="62" y="76" font-size="13" fill="#6A6F75">SSRF was merged in here</text>

  <rect x="13" y="99" width="359" height="52" rx="14" fill="#FDB914"/>
  <rect x="8" y="94" width="359" height="52" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="120" r="15" fill="#0F1115"/>
  <text x="36" y="125" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="118" font-size="14" font-weight="700" fill="#0F1115">Security Misconfiguration</text>
  <text x="62" y="136" font-size="13" fill="#6A6F75">Now second</text>

  <rect x="13" y="159" width="359" height="52" rx="14" fill="#FDB914"/>
  <rect x="8" y="154" width="359" height="52" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="180" r="15" fill="#0F1115"/>
  <text x="36" y="185" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="178" font-size="14" font-weight="700" fill="#0F1115">Software Supply Chain</text>
  <text x="62" y="196" font-size="13" fill="#6A6F75">Was Vulnerable and Outdated</text>

  <rect x="8" y="214" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="240" r="15" fill="#8E959D"/>
  <text x="36" y="245" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">4</text>
  <text x="62" y="245" font-size="14" font-weight="700" fill="#0F1115">Cryptographic Failures</text>

  <rect x="8" y="274" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="300" r="15" fill="#8E959D"/>
  <text x="36" y="305" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">5</text>
  <text x="62" y="305" font-size="14" font-weight="700" fill="#0F1115">Injection</text>

  <rect x="8" y="334" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="360" r="15" fill="#8E959D"/>
  <text x="36" y="365" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">6</text>
  <text x="62" y="365" font-size="14" font-weight="700" fill="#0F1115">Insecure Design</text>

  <rect x="8" y="394" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="420" r="15" fill="#8E959D"/>
  <text x="36" y="425" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">7</text>
  <text x="62" y="425" font-size="14" font-weight="700" fill="#0F1115">Authentication Failures</text>

  <rect x="8" y="454" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="480" r="15" fill="#8E959D"/>
  <text x="36" y="485" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">8</text>
  <text x="62" y="485" font-size="14" font-weight="700" fill="#0F1115">Software or Data Integrity</text>

  <rect x="8" y="514" width="359" height="52" rx="14" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="540" r="15" fill="#8E959D"/>
  <text x="36" y="545" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">9</text>
  <text x="62" y="545" font-size="14" font-weight="700" fill="#0F1115">Logging and Alerting</text>

  <rect x="13" y="579" width="359" height="52" rx="14" fill="#D098F9"/>
  <rect x="8" y="574" width="359" height="52" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="600" r="15" fill="#0F1115"/>
  <text x="36" y="605" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
  <text x="62" y="598" font-size="14" font-weight="700" fill="#0F1115">Exceptional Conditions</text>
  <text x="62" y="616" font-size="13" fill="#6A6F75">New category</text>

  <text x="8" y="664" font-size="14" fill="#5C6167">A proposal that says 2021 is buying<tspan x="8" dy="1.4em">last generation&#8217;s checklist.</tspan></text>
</svg>
