<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What a TLS certificate covers, and the four things it does not</title>
  <desc id="d">The certificate's entire scope is the encrypted channel between the visitor's browser and your server. Outside it sit SQL injection and cross-site scripting, data at rest in your database, whether the business is honest, and a stolen private key.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THE CERTIFICATE ACTUALLY COVERS</text>

  <rect x="14" y="46" width="180" height="92" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="180" height="92" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="98" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="middle">VISITOR</text>
  <text x="98" y="102" font-size="19" font-weight="700" fill="#0F1115" text-anchor="middle">Browser</text>

  <rect x="234" y="46" width="344" height="92" rx="16" fill="#0F1115"/>
  <rect x="228" y="40" width="344" height="92" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="400" y="70" font-size="11" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">THE ENTIRE SCOPE</text>
  <text x="400" y="98" font-size="19" font-weight="700" fill="#0F1115" text-anchor="middle">Encrypted in transit</text>
  <text x="400" y="120" font-size="13" fill="#0F1115" text-anchor="middle">Unreadable, and not silently altered</text>

  <rect x="618" y="46" width="180" height="92" rx="16" fill="#4A90C7"/>
  <rect x="612" y="40" width="180" height="92" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="702" y="72" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="middle">YOURS</text>
  <text x="702" y="102" font-size="19" font-weight="700" fill="#0F1115" text-anchor="middle">Server</text>

  <path d="M194 86 L222 86" stroke="#0F1115" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path d="M578 86 L606 86" stroke="#0F1115" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <text x="8" y="166" font-size="14" font-weight="700" fill="#0F1115">A certificate protects data in transit between browser and server. That is the entire scope.</text>

  <text x="8" y="196" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">OUTSIDE IT &#8212; WHERE THE CERTIFICATE DOES NOTHING</text>

  <rect x="14" y="216" width="181" height="150" rx="16" fill="#EE3D41"/>
  <rect x="8" y="210" width="181" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="248" font-size="15" font-weight="700" fill="#0F1115">SQL injection<tspan x="28" dy="1.3em">and XSS</tspan></text>
  <text x="28" y="302" font-size="13" fill="#5C6167">They travel happily<tspan x="28" dy="1.35em">over an encrypted</tspan><tspan x="28" dy="1.35em">connection.</tspan></text>

  <rect x="215" y="216" width="181" height="150" rx="16" fill="#EE3D41"/>
  <rect x="209" y="210" width="181" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="229" y="248" font-size="15" font-weight="700" fill="#0F1115">Data at rest in<tspan x="229" dy="1.3em">your database</tspan></text>
  <text x="229" y="302" font-size="13" fill="#5C6167">A separate problem<tspan x="229" dy="1.35em">with separate</tspan><tspan x="229" dy="1.35em">controls.</tspan></text>

  <rect x="416" y="216" width="181" height="150" rx="16" fill="#EE3D41"/>
  <rect x="410" y="210" width="181" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="248" font-size="15" font-weight="700" fill="#0F1115">Whether the<tspan x="430" dy="1.3em">business is honest</tspan></text>
  <text x="430" y="302" font-size="13" fill="#5C6167">A DV certificate proves<tspan x="430" dy="1.35em">control of a domain,</tspan><tspan x="430" dy="1.35em">not honesty.</tspan></text>

  <rect x="617" y="216" width="181" height="150" rx="16" fill="#EE3D41"/>
  <rect x="611" y="210" width="181" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="631" y="248" font-size="15" font-weight="700" fill="#0F1115">A stolen<tspan x="631" dy="1.3em">private key</tspan></text>
  <text x="631" y="302" font-size="13" fill="#5C6167">Which is why the<tspan x="631" dy="1.35em">industry is shortening</tspan><tspan x="631" dy="1.35em">lifetimes instead.</tspan></text>

  <text x="8" y="390" font-size="14" fill="#5C6167">Encryption and security are related, and they are not the same purchase.</text>
</svg>
