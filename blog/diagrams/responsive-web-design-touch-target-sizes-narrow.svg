<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 404" width="380" height="404" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Touch target sizes: 20, 24 and 44 CSS pixels compared</title>
  <desc id="d">Three squares on a shared baseline. A 20 by 20 pixel icon fails both requirements. 24 by 24 CSS pixels is WCAG 2.2 Success Criterion 2.5.8 Target Size Minimum at Level AA, the compliance floor. 44 by 44 CSS pixels is Success Criterion 2.5.5 Target Size Enhanced at Level AAA, the design target.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TAP TARGETS, DRAWN TO SCALE</text>

  <rect x="13" y="39" width="359" height="180" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="180" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="66" font-size="17" font-weight="700" fill="#0F1115">Three sizes, one baseline</text>

  <rect x="52" y="120" width="20" height="20" rx="4" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <rect x="160" y="116" width="24" height="24" rx="5" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <rect x="270" y="96" width="44" height="44" rx="8" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <path d="M26 146 L349 146" stroke="#E7E9EC" stroke-width="2"/>

  <text x="62" y="172" font-size="16" font-weight="700" fill="#0F1115" text-anchor="middle">20 px</text>
  <text x="172" y="172" font-size="16" font-weight="700" fill="#0F1115" text-anchor="middle">24 px</text>
  <text x="292" y="172" font-size="16" font-weight="700" fill="#0F1115" text-anchor="middle">44 px</text>
  <text x="62" y="194" font-size="13" fill="#5C6167" text-anchor="middle">fails both</text>
  <text x="172" y="194" font-size="13" fill="#5C6167" text-anchor="middle">Level AA</text>
  <text x="292" y="194" font-size="13" fill="#5C6167" text-anchor="middle">Level AAA</text>

  <rect x="13" y="244" width="359" height="152" rx="16" fill="#0F1115"/>
  <rect x="8" y="239" width="359" height="152" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="267" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE RULE</text>
  <text x="26" y="295" font-size="15" font-weight="700" fill="#0F1115">24 by 24 is the compliance floor<tspan x="26" dy="1.45em">(SC 2.5.8, Level AA). 44 by 44 is</tspan><tspan x="26" dy="1.45em">the design target (SC 2.5.5, AAA).</tspan></text>
  <text x="26" y="365" font-size="13" fill="#5C6167">SC 2.5.7 also requires a tap alternative<tspan x="26" dy="1.35em">for anything a user can drag.</tspan></text>
</svg>
