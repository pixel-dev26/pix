<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 696" width="380" height="696" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Which branding job, and which of the twelve books covers it</title>
  <desc id="d">Personal branding maps to Personal Branding For Dummies and The Brand You50. Product branding maps to The 22 Immutable Laws of Branding and Building Strong Brands. Service branding maps to Building a StoryBrand 2.0. Corporate branding maps to Designing Brand Identity. Co-branding maps to Building Strong Brands. Place branding and no-brand branding have no dedicated book on the list.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SEVEN JOBS, TWELVE BOOKS</text>

  <rect x="13" y="39" width="359" height="76" rx="14" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="62" font-size="15" font-weight="700" fill="#0F1115">Personal branding</text>
  <text x="26" y="84" font-size="13" fill="#5C6167">Personal Branding For Dummies<tspan x="26" dy="1.4em">The Brand You50</tspan></text>

  <rect x="13" y="125" width="359" height="76" rx="14" fill="#FDB914"/>
  <rect x="8" y="120" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="148" font-size="15" font-weight="700" fill="#0F1115">Product branding</text>
  <text x="26" y="170" font-size="13" fill="#5C6167">The 22 Immutable Laws of Branding<tspan x="26" dy="1.4em">Building Strong Brands</tspan></text>

  <rect x="13" y="211" width="359" height="76" rx="14" fill="#FDB914"/>
  <rect x="8" y="206" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="234" font-size="15" font-weight="700" fill="#0F1115">Service branding</text>
  <text x="26" y="256" font-size="13" fill="#5C6167">Building a StoryBrand 2.0</text>

  <rect x="13" y="297" width="359" height="76" rx="14" fill="#FDB914"/>
  <rect x="8" y="292" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="320" font-size="15" font-weight="700" fill="#0F1115">Corporate branding</text>
  <text x="26" y="342" font-size="13" fill="#5C6167">Designing Brand Identity, the one<tspan x="26" dy="1.4em">written for a whole team</tspan></text>

  <rect x="13" y="383" width="359" height="76" rx="14" fill="#FDB914"/>
  <rect x="8" y="378" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="406" font-size="15" font-weight="700" fill="#0F1115">Co-branding</text>
  <text x="26" y="428" font-size="13" fill="#5C6167">Building Strong Brands. It is a trade<tspan x="26" dy="1.4em">in borrowed equity.</tspan></text>

  <rect x="13" y="469" width="359" height="76" rx="14" fill="#EE3D41"/>
  <rect x="8" y="464" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="492" font-size="15" font-weight="700" fill="#0F1115">Place branding</text>
  <text x="26" y="514" font-size="13" font-weight="700" fill="#EE3D41">No book here.<tspan dx="6" font-weight="400" fill="#5C6167">Take The Brand Gap</tspan><tspan x="26" dy="1.4em" font-weight="400" fill="#5C6167">as the framework instead.</tspan></text>

  <rect x="13" y="555" width="359" height="76" rx="14" fill="#EE3D41"/>
  <rect x="8" y="550" width="359" height="76" rx="14" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="578" font-size="15" font-weight="700" fill="#0F1115">No-brand branding</text>
  <text x="26" y="600" font-size="13" font-weight="700" fill="#EE3D41">No book here.<tspan dx="6" font-weight="400" fill="#5C6167">It is a decision,</tspan><tspan x="26" dy="1.4em" font-weight="400" fill="#5C6167">not the absence of branding.</tspan></text>

  <text x="8" y="662" font-size="14" fill="#5C6167">No book covers more than two of<tspan x="8" dy="1.4em">these well. Read for the job you have.</tspan></text>
</svg>
