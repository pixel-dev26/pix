<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" width="800" height="392" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Choosing a framework, in the order the decisions actually bind</title>
  <desc id="d">Six criteria ranked: what the project is, the team you have, whether the project is still shipping, documentation, security defaults, and performance last.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">IN THE ORDER THE DECISIONS ACTUALLY BIND</text>

  <rect x="14" y="50" width="784" height="44" rx="16" fill="#FDB914"/>
  <rect x="8" y="44" width="784" height="44" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="66" r="14" fill="#0F1115"/>
  <text x="38" y="71" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="64" y="71" font-size="15" font-weight="700" fill="#0F1115">What the project is</text>
  <text x="300" y="71" font-size="14" fill="#5C6167">A brochure site needs a CMS decision, not a framework one.</text>

  <rect x="14" y="102" width="784" height="44" rx="16" fill="#FDB914"/>
  <rect x="8" y="96" width="784" height="44" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="118" r="14" fill="#0F1115"/>
  <text x="38" y="123" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="64" y="123" font-size="15" font-weight="700" fill="#0F1115">The team you have</text>
  <text x="300" y="123" font-size="14" fill="#5C6167">Familiarity beats fit at the margin, almost always.</text>

  <rect x="14" y="154" width="784" height="44" rx="16" fill="#EE3D41"/>
  <rect x="8" y="148" width="784" height="44" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="170" r="14" fill="#0F1115"/>
  <text x="38" y="175" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="64" y="175" font-size="15" font-weight="700" fill="#0F1115">Is it still shipping?</text>
  <text x="300" y="175" font-size="14" fill="#5C6167">Last release, a support policy with dates, security fixes.</text>

  <rect x="14" y="206" width="784" height="44" rx="16" fill="#4A90C7"/>
  <rect x="8" y="200" width="784" height="44" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="222" r="14" fill="#0F1115"/>
  <text x="38" y="227" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="64" y="227" font-size="15" font-weight="700" fill="#0F1115">Documentation</text>
  <text x="300" y="227" font-size="14" fill="#5C6167">Search the docs for file uploads and background jobs.</text>

  <rect x="14" y="258" width="784" height="44" rx="16" fill="#4A90C7"/>
  <rect x="8" y="252" width="784" height="44" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="274" r="14" fill="#0F1115"/>
  <text x="38" y="279" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="64" y="279" font-size="15" font-weight="700" fill="#0F1115">Security defaults</text>
  <text x="300" y="279" font-size="14" fill="#5C6167">Not what it can be secured to do, but what it does alone.</text>

  <rect x="14" y="310" width="784" height="44" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="304" width="784" height="44" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="38" cy="326" r="14" fill="#0F1115"/>
  <text x="38" y="331" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="64" y="331" font-size="15" font-weight="700" fill="#0F1115">Performance</text>
  <text x="300" y="331" font-size="14" fill="#5C6167">Almost never the deciding factor. Measure, then fix.</text>

  <text x="8" y="382" font-size="14" fill="#5C6167">Performance is where these arguments start. It is where the decision should end.</text>
</svg>
