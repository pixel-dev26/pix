<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 592" width="380" height="592" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Choosing a framework, in the order the decisions actually bind</title>
  <desc id="d">Six criteria ranked: what the project is, the team you have, whether the project is still shipping, documentation, security defaults, and performance last.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE ORDER THEY ACTUALLY BIND</text>

  <rect x="13" y="39" width="359" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="60" r="14" fill="#0F1115"/>
  <text x="36" y="65" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="62" y="66" font-size="16" font-weight="700" fill="#0F1115">What the project is</text>
  <text x="24" y="94" font-size="13" fill="#5C6167">A brochure site needs a CMS decision.</text>

  <rect x="13" y="127" width="359" height="76" rx="16" fill="#FDB914"/>
  <rect x="8" y="122" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="148" r="14" fill="#0F1115"/>
  <text x="36" y="153" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="62" y="154" font-size="16" font-weight="700" fill="#0F1115">The team you have</text>
  <text x="24" y="182" font-size="13" fill="#5C6167">Familiarity beats fit, almost always.</text>

  <rect x="13" y="215" width="359" height="76" rx="16" fill="#EE3D41"/>
  <rect x="8" y="210" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="236" r="14" fill="#0F1115"/>
  <text x="36" y="241" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="62" y="242" font-size="16" font-weight="700" fill="#0F1115">Is it still shipping?</text>
  <text x="24" y="270" font-size="13" fill="#5C6167">Last release, support dates, security fixes.</text>

  <rect x="13" y="303" width="359" height="76" rx="16" fill="#4A90C7"/>
  <rect x="8" y="298" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="324" r="14" fill="#0F1115"/>
  <text x="36" y="329" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="62" y="330" font-size="16" font-weight="700" fill="#0F1115">Documentation</text>
  <text x="24" y="358" font-size="13" fill="#5C6167">Search the docs for file uploads.</text>

  <rect x="13" y="391" width="359" height="76" rx="16" fill="#4A90C7"/>
  <rect x="8" y="386" width="359" height="76" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="412" r="14" fill="#0F1115"/>
  <text x="36" y="417" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="62" y="418" font-size="16" font-weight="700" fill="#0F1115">Security defaults</text>
  <text x="24" y="446" font-size="13" fill="#5C6167">What it does when nobody is watching.</text>

  <rect x="13" y="479" width="359" height="76" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="474" width="359" height="76" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="36" cy="500" r="14" fill="#0F1115"/>
  <text x="36" y="505" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="62" y="506" font-size="16" font-weight="700" fill="#0F1115">Performance</text>
  <text x="24" y="534" font-size="13" fill="#5C6167">Almost never the deciding factor.</text>

  <text x="8" y="580" font-size="14" fill="#5C6167">Where the argument starts, and should end.</text>
</svg>
