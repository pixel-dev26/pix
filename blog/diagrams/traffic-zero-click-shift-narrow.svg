<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 332" width="380" height="332" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The share of US Google searches ending without a click has risen</title>
  <desc id="d">Two bars to scale. In 2024, 60.45 percent of US Google searches ended without a click. Between January and April 2026 the figure was 68.01 percent, on SparkToro's analysis of Similarweb clickstream data.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">US SEARCHES WITH NO CLICK</text>

  <rect x="13" y="39" width="359" height="226" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="226" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="76" font-size="15" font-weight="700" fill="#0F1115">2024</text>
  <text x="341" y="76" font-size="24" font-weight="700" fill="#0F1115" text-anchor="end">60.45%</text>
  <rect x="26" y="88" width="315" height="28" rx="8" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="88" width="190" height="28" rx="8" fill="#8E959D" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="158" font-size="15" font-weight="700" fill="#0F1115">2026</text>
  <text x="341" y="158" font-size="24" font-weight="700" fill="#0F1115" text-anchor="end">68.01%</text>
  <rect x="26" y="170" width="315" height="28" rx="8" fill="#E7E9EC" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="170" width="214" height="28" rx="8" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>

  <text x="26" y="226" font-size="13" fill="#5C6167">SparkToro on Similarweb clickstream<tspan x="26" dy="1.45em">data, January to April 2026, vs 2024.</tspan></text>

  <text x="8" y="296" font-size="14" font-weight="700" fill="#0F1115">Traffic is a proxy for the goal, and<tspan x="8" dy="1.4em">it is a proxy that has got worse.</tspan></text>
</svg>
