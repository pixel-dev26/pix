<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Shopify versus Magento is really three separate products</title>
  <desc id="d">Three cards. Shopify is hosted with a published plan grid and can be run by a non-technical person. Adobe Commerce is licensed with no published price, quoted against your gross merchandise value, and sold to enterprises with procurement departments. Magento Open Source is free code with no licence fee, billed in hosting and engineering, and assumes a developer is available.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE QUESTION, THREE DIFFERENT PRODUCTS</text>

  <!-- Shopify -->
  <rect x="14" y="46" width="246" height="276" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="246" height="276" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="30" y="62" width="76" height="26" rx="999" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="68" y="80" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">HOSTED</text>
  <text x="30" y="126" font-size="19" font-weight="700" fill="#0F1115">Shopify</text>
  <path d="M30 170 L232 170" stroke="#E7E9EC" stroke-width="2"/>
  <text x="30" y="192" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT IT COSTS</text>
  <text x="30" y="216" font-size="14" fill="#5C6167">Subscription with a<tspan x="30" dy="1.35em">published plan grid.</tspan></text>
  <text x="30" y="264" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHO RUNS IT</text>
  <text x="30" y="288" font-size="14" fill="#5C6167">A non-technical person<tspan x="30" dy="1.35em">can run the store.</tspan></text>

  <!-- Adobe Commerce -->
  <rect x="283" y="46" width="246" height="276" rx="16" fill="#D098F9"/>
  <rect x="277" y="40" width="246" height="276" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="299" y="62" width="92" height="26" rx="999" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="345" y="80" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">LICENSED</text>
  <text x="299" y="126" font-size="19" font-weight="700" fill="#0F1115">Adobe Commerce</text>
  <path d="M299 170 L501 170" stroke="#E7E9EC" stroke-width="2"/>
  <text x="299" y="192" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT IT COSTS</text>
  <text x="299" y="216" font-size="14" fill="#5C6167">No published price;<tspan x="299" dy="1.35em">quoted against your GMV.</tspan></text>
  <text x="299" y="264" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHO RUNS IT</text>
  <text x="299" y="288" font-size="14" fill="#5C6167">Enterprises with a<tspan x="299" dy="1.35em">procurement department.</tspan></text>

  <!-- Magento Open Source -->
  <rect x="552" y="46" width="246" height="276" rx="16" fill="#5FBFA8"/>
  <rect x="546" y="40" width="246" height="276" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="568" y="62" width="100" height="26" rx="999" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="618" y="80" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">FREE CODE</text>
  <text x="568" y="126" font-size="19" font-weight="700" fill="#0F1115">Magento<tspan x="568" dy="1.25em">Open Source</tspan></text>
  <path d="M568 170 L770 170" stroke="#E7E9EC" stroke-width="2"/>
  <text x="568" y="192" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT IT COSTS</text>
  <text x="568" y="216" font-size="14" fill="#5C6167">No licence fee. Billed in<tspan x="568" dy="1.35em">hosting and engineering.</tspan></text>
  <text x="568" y="264" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHO RUNS IT</text>
  <text x="568" y="288" font-size="14" fill="#5C6167">It assumes a developer<tspan x="568" dy="1.35em">is available.</tspan></text>

  <text x="8" y="352" font-size="14" font-weight="700" fill="#0F1115">Magento Commerce became Adobe Commerce in April 2021. The rename changed who it is sold to.</text>
</svg>
