<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" width="800" height="396" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a campaign statistic gets manufactured</title>
  <desc id="d">A real, narrow measurement is rounded up to a tidy number, re-scoped onto something much bigger, then handed the name of a publication that never ran it. Old Spice body wash sales were up 11 per cent over twelve months, 55 per cent over three months and 107 per cent over the previous month, per Nielsen reported by Adweek in July 2010, alongside a two-for-one coupon. What circulates instead is a 125 per cent sales increase credited to The Guardian, which never published it.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">HOW A CAMPAIGN STATISTIC GETS MANUFACTURED</text>

  <rect x="14" y="46" width="181" height="104" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="181" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="70" r="15" fill="#0F1115"/>
  <text x="38" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="110" font-size="15" font-weight="700" fill="#0F1115">A real, narrow<tspan x="28" dy="1.3em">measurement</tspan></text>

  <rect x="215" y="46" width="181" height="104" rx="16" fill="#FDB914"/>
  <rect x="209" y="40" width="181" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="239" cy="70" r="15" fill="#0F1115"/>
  <text x="239" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="229" y="110" font-size="15" font-weight="700" fill="#0F1115">Rounded up to<tspan x="229" dy="1.3em">a tidy number</tspan></text>

  <rect x="416" y="46" width="181" height="104" rx="16" fill="#FA6B45"/>
  <rect x="410" y="40" width="181" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="440" cy="70" r="15" fill="#0F1115"/>
  <text x="440" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="430" y="110" font-size="15" font-weight="700" fill="#0F1115">Re-scoped onto<tspan x="430" dy="1.3em">something bigger</tspan></text>

  <rect x="617" y="46" width="181" height="104" rx="16" fill="#EE3D41"/>
  <rect x="611" y="40" width="181" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="641" cy="70" r="15" fill="#0F1115"/>
  <text x="641" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="631" y="110" font-size="15" font-weight="700" fill="#0F1115">Handed a masthead<tspan x="631" dy="1.3em">that never ran it</tspan></text>

  <path d="M191 92 L205 92" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 92 L406 92" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M593 92 L607 92" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- worked example -->
  <rect x="14" y="182" width="382" height="176" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="176" width="382" height="176" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="204" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT IS ACTUALLY DOCUMENTED</text>
  <text x="28" y="232" font-size="15" font-weight="700" fill="#0F1115">Old Spice body wash sales</text>
  <text x="28" y="258" font-size="13" fill="#5C6167">Up 11% over twelve months<tspan x="28" dy="1.4em">Up 55% over three months</tspan><tspan x="28" dy="1.4em">Up 107% over the previous month</tspan></text>
  <text x="28" y="322" font-size="12" fill="#6A6F75">Nielsen, reported by Adweek, July 2010.<tspan x="28" dy="1.5em">A two-for-one coupon ran at the same time.</tspan></text>

  <rect x="416" y="182" width="382" height="176" rx="16" fill="#EE3D41"/>
  <rect x="410" y="176" width="382" height="176" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="204" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT CIRCULATES INSTEAD</text>
  <text x="430" y="232" font-size="15" font-weight="700" fill="#0F1115">&#8220;A 125% sales increase&#8221;</text>
  <text x="430" y="258" font-size="13" fill="#5C6167">Credited to The Guardian.</text>
  <text x="430" y="288" font-size="14" font-weight="700" fill="#EE3D41">The Guardian never published it.</text>
  <text x="430" y="322" font-size="12" fill="#6A6F75">125% matches nothing in the primary<tspan x="430" dy="1.5em">reporting either.</tspan></text>

  <text x="8" y="384" font-size="14" fill="#5C6167">A round number is a warning. Real measurements are 11% and 55%.</text>
</svg>
