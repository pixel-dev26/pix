<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" width="800" height="422" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Why a component needs a container query, not a media query</title>
  <desc id="d">One window at one width holds a wide main column and a narrow sidebar. The same card sits in both: horizontal in the main column, stacked in the sidebar. A media query only knows the window width, so it gives both slots the same answer. A container query lets the component ask how much space it has been given.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE WINDOW WIDTH, TWO DIFFERENT SLOTS</text>

  <!-- the window -->
  <rect x="14" y="46" width="784" height="232" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="784" height="232" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">ONE WINDOW, ONE WIDTH</text>
  <text x="764" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="end">THE SAME COMPONENT, TWICE</text>

  <!-- main column -->
  <rect x="28" y="82" width="470" height="176" rx="12" fill="#FFFFFF" stroke="#8E959D" stroke-width="2"/>
  <text x="44" y="104" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">MAIN COLUMN</text>
  <rect x="49" y="119" width="438" height="130" rx="12" fill="#4A90C7"/>
  <rect x="44" y="114" width="438" height="130" rx="12" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="60" y="130" width="120" height="98" rx="8" fill="#E7E9EC" stroke="#8E959D" stroke-width="2"/>
  <rect x="196" y="134" width="200" height="12" rx="6" fill="#0F1115"/>
  <rect x="196" y="162" width="260" height="8" rx="4" fill="#E7E9EC"/>
  <rect x="196" y="180" width="250" height="8" rx="4" fill="#E7E9EC"/>
  <rect x="196" y="198" width="210" height="8" rx="4" fill="#E7E9EC"/>

  <!-- sidebar -->
  <rect x="514" y="82" width="250" height="176" rx="12" fill="#FFFFFF" stroke="#8E959D" stroke-width="2"/>
  <text x="530" y="104" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SIDEBAR</text>
  <rect x="535" y="119" width="218" height="130" rx="12" fill="#5FBFA8"/>
  <rect x="530" y="114" width="218" height="130" rx="12" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="546" y="130" width="186" height="44" rx="8" fill="#E7E9EC" stroke="#8E959D" stroke-width="2"/>
  <rect x="546" y="188" width="140" height="12" rx="6" fill="#0F1115"/>
  <rect x="546" y="212" width="186" height="8" rx="4" fill="#E7E9EC"/>
  <rect x="546" y="228" width="150" height="8" rx="4" fill="#E7E9EC"/>

  <!-- the two questions -->
  <rect x="14" y="304" width="380" height="110" rx="16" fill="#E7E9EC"/>
  <rect x="8" y="298" width="380" height="110" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="316" width="132" height="26" rx="999" fill="#0F1115"/>
  <text x="94" y="334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MEDIA QUERY</text>
  <text x="28" y="368" font-size="15" fill="#5C6167">Asks how wide the <tspan font-weight="700" fill="#0F1115">window</tspan> is.<tspan x="28" dy="1.35em">One answer for both slots.</tspan></text>

  <rect x="418" y="304" width="380" height="110" rx="16" fill="#FDB914"/>
  <rect x="412" y="298" width="380" height="110" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="432" y="316" width="164" height="26" rx="999" fill="#0F1115"/>
  <text x="514" y="334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTAINER QUERY</text>
  <text x="432" y="368" font-size="15" fill="#5C6167">Asks how much space <tspan font-weight="700" fill="#0F1115">it</tspan> has.<tspan x="432" dy="1.35em">A different answer in each.</tspan></text>
</svg>
