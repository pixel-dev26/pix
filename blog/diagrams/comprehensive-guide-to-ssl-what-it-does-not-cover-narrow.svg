<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 652" width="380" height="652" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What a TLS certificate covers, and the four things it does not</title>
  <desc id="d">The certificate's entire scope is the encrypted channel between the visitor's browser and your server. Outside it sit SQL injection and cross-site scripting, data at rest in your database, whether the business is honest, and a stolen private key.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT THE CERTIFICATE COVERS</text>

  <rect x="13" y="45" width="359" height="54" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="359" height="54" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="187" y="74" font-size="18" font-weight="700" fill="#0F1115" text-anchor="middle">Browser</text>

  <path d="M187 98 L187 126" stroke="#0F1115" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <rect x="13" y="135" width="359" height="92" rx="16" fill="#0F1115"/>
  <rect x="8" y="130" width="359" height="92" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="187" y="160" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">THE ENTIRE SCOPE</text>
  <text x="187" y="188" font-size="18" font-weight="700" fill="#0F1115" text-anchor="middle">Encrypted in transit</text>
  <text x="187" y="210" font-size="13" fill="#0F1115" text-anchor="middle">Unreadable, and not altered</text>

  <path d="M187 226 L187 254" stroke="#0F1115" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <rect x="13" y="263" width="359" height="54" rx="16" fill="#4A90C7"/>
  <rect x="8" y="258" width="359" height="54" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="187" y="292" font-size="18" font-weight="700" fill="#0F1115" text-anchor="middle">Server</text>

  <text x="8" y="344" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">OUTSIDE IT, IT DOES NOTHING</text>

  <rect x="13" y="363" width="172" height="118" rx="16" fill="#EE3D41"/>
  <rect x="8" y="358" width="172" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="388" font-size="15" font-weight="700" fill="#0F1115">SQL injection<tspan x="24" dy="1.25em">and XSS</tspan></text>
  <text x="24" y="434" font-size="13" fill="#5C6167">They travel over<tspan x="24" dy="1.3em">an encrypted link.</tspan></text>

  <rect x="205" y="363" width="172" height="118" rx="16" fill="#EE3D41"/>
  <rect x="200" y="358" width="172" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="216" y="388" font-size="15" font-weight="700" fill="#0F1115">Data in your<tspan x="216" dy="1.25em">database</tspan></text>
  <text x="216" y="434" font-size="13" fill="#5C6167">A separate problem,<tspan x="216" dy="1.3em">separate controls.</tspan></text>

  <rect x="13" y="493" width="172" height="118" rx="16" fill="#EE3D41"/>
  <rect x="8" y="488" width="172" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="518" font-size="15" font-weight="700" fill="#0F1115">Whether you<tspan x="24" dy="1.25em">are honest</tspan></text>
  <text x="24" y="564" font-size="13" fill="#5C6167">DV proves domain<tspan x="24" dy="1.3em">control only.</tspan></text>

  <rect x="205" y="493" width="172" height="118" rx="16" fill="#EE3D41"/>
  <rect x="200" y="488" width="172" height="118" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="216" y="518" font-size="15" font-weight="700" fill="#0F1115">A stolen<tspan x="216" dy="1.25em">private key</tspan></text>
  <text x="216" y="564" font-size="13" fill="#5C6167">Why lifetimes are<tspan x="216" dy="1.3em">shortening instead.</tspan></text>

  <text x="8" y="642" font-size="13" fill="#5C6167">Encryption and security are not the same purchase.</text>
</svg>
