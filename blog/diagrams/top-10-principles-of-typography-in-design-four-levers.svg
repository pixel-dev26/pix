<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Fix bad typography in this order: hierarchy, contrast, spacing, alignment</title>
  <desc id="d">Four levers decide whether a layout works, attacked in that order. Typeface choice sits outside them: a branding decision wearing a legibility costume, and not where the damage happens.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FIXING A BROKEN LAYOUT, IN THIS ORDER</text>

  <rect x="14" y="40" width="181" height="120" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="181" height="120" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="46" cy="68" r="15" fill="#0F1115"/>
  <text x="46" y="74" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="116" font-size="17" font-weight="700" fill="#0F1115">Hierarchy</text>
  <text x="28" y="138" font-size="13" fill="#5C6167">what gets read first</text>

  <rect x="215" y="40" width="181" height="120" rx="16" fill="#FDB914"/>
  <rect x="209" y="34" width="181" height="120" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="247" cy="68" r="15" fill="#0F1115"/>
  <text x="247" y="74" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="229" y="116" font-size="17" font-weight="700" fill="#0F1115">Contrast</text>
  <text x="229" y="138" font-size="13" fill="#5C6167">make it obvious</text>

  <rect x="416" y="40" width="181" height="120" rx="16" fill="#FDB914"/>
  <rect x="410" y="34" width="181" height="120" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="448" cy="68" r="15" fill="#0F1115"/>
  <text x="448" y="74" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="430" y="116" font-size="17" font-weight="700" fill="#0F1115">Spacing</text>
  <text x="430" y="138" font-size="13" fill="#5C6167">group by proximity</text>

  <rect x="617" y="40" width="181" height="120" rx="16" fill="#FDB914"/>
  <rect x="611" y="34" width="181" height="120" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="649" cy="68" r="15" fill="#0F1115"/>
  <text x="649" y="74" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="631" y="116" font-size="17" font-weight="700" fill="#0F1115">Alignment</text>
  <text x="631" y="138" font-size="13" fill="#5C6167">one edge, not four</text>

  <path d="M191 94 L205 94" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 94 L406 94" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M593 94 L607 94" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="8" y="190" width="784" height="96" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="34" y="218" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SET THIS ONE ASIDE</text>
  <text x="34" y="248" font-size="19" font-weight="700" fill="#0F1115">Typeface choice</text>
  <text x="34" y="272" font-size="14" fill="#5C6167">A branding decision wearing a legibility costume. A competent typeface will not be your problem.</text>

  <text x="8" y="316" font-size="14" font-weight="700" fill="#0F1115">All four are free to fix, and all four are where the reading is won or lost.</text>
</svg>
