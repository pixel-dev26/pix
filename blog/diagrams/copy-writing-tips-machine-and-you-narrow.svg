<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 668" width="380" height="668" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What to give the machine and what to write yourself</title>
  <desc id="d">Two stacked cards. The machine handles volume, variants, structure and compression: the first ugly draft, compressing by a third, twenty headline variants, meeting notes into a structure, one proposition in six lengths, second-language editing. You supply the specifics: the number, the name, the date, the loss, the opinion you would defend.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE SPLIT, FOR ANY WRITER</text>

  <!-- the machine -->
  <rect x="13" y="39" width="359" height="264" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="264" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="130" height="26" rx="999" fill="#0F1115"/>
  <text x="91" y="70" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE MACHINE</text>
  <text x="26" y="104" font-size="17" font-weight="700" fill="#0F1115">Volume, variants,<tspan x="26" dy="1.3em">structure, compression</tspan></text>
  <path d="M26 142 L349 142" stroke="#E7E9EC" stroke-width="2"/>
  <circle cx="32" cy="157" r="3" fill="#8E959D"/>
  <text x="46" y="162" font-size="14" fill="#5C6167">The first ugly draft</text>
  <circle cx="32" cy="181" r="3" fill="#8E959D"/>
  <text x="46" y="186" font-size="14" fill="#5C6167">Compressing it by a third</text>
  <circle cx="32" cy="205" r="3" fill="#8E959D"/>
  <text x="46" y="210" font-size="14" fill="#5C6167">Twenty headline variants</text>
  <circle cx="32" cy="229" r="3" fill="#8E959D"/>
  <text x="46" y="234" font-size="14" fill="#5C6167">Notes into a rough structure</text>
  <circle cx="32" cy="253" r="3" fill="#8E959D"/>
  <text x="46" y="258" font-size="14" fill="#5C6167">One proposition, six lengths</text>
  <circle cx="32" cy="277" r="3" fill="#8E959D"/>
  <text x="46" y="282" font-size="14" fill="#5C6167">Second-language editing</text>

  <!-- you -->
  <rect x="13" y="323" width="359" height="232" rx="16" fill="#FDB914"/>
  <rect x="8" y="318" width="359" height="232" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="336" width="64" height="26" rx="999" fill="#0F1115"/>
  <text x="58" y="354" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">YOU</text>
  <text x="26" y="388" font-size="17" font-weight="700" fill="#0F1115">Do the specifics yourself</text>
  <path d="M26 402 L349 402" stroke="#E7E9EC" stroke-width="2"/>
  <text x="26" y="428" font-size="16" font-weight="700" fill="#0F1115">The number</text>
  <text x="26" y="454" font-size="16" font-weight="700" fill="#0F1115">The name</text>
  <text x="26" y="480" font-size="16" font-weight="700" fill="#0F1115">The date</text>
  <text x="26" y="506" font-size="16" font-weight="700" fill="#0F1115">The loss</text>
  <text x="26" y="532" font-size="16" font-weight="700" fill="#0F1115">The opinion you would defend</text>

  <!-- the test -->
  <rect x="13" y="580" width="359" height="84" rx="16" fill="#0F1115"/>
  <rect x="8" y="575" width="359" height="84" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="602" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE TEST</text>
  <text x="26" y="626" font-size="15" font-weight="700" fill="#0F1115">Strip out what a model could write.<tspan x="26" dy="1.35em">What survives is your positioning.</tspan></text>
</svg>
