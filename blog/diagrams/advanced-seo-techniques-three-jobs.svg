<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Advanced SEO in 2026 is three jobs</title>
  <desc id="d">Three jobs: publish something a competitor cannot copy; make the page fast and machine-readable, with LCP within 2.5 seconds, INP of 200 milliseconds or less and CLS of 0.1 or less; and earn mentions. Every technique is a way of doing one of the three, and anything that is not is decoration.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE JOBS, AND EVERYTHING ELSE</text>

  <!-- 1 -->
  <rect x="14" y="50" width="246" height="200" rx="16" fill="#FDB914"/>
  <rect x="8" y="44" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="74" r="14" fill="#0F1115"/>
  <text x="38" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="112" font-size="16" font-weight="700" fill="#0F1115">Publish something a<tspan x="28" dy="1.25em">competitor cannot copy</tspan></text>
  <path d="M28 148 L234 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="170" font-size="13" fill="#5C6167">The lever Google itself<tspan x="28" dy="1.3em">names first, ahead of</tspan><tspan x="28" dy="1.3em">schema and structure.</tspan></text>

  <!-- 2 -->
  <rect x="283" y="50" width="246" height="200" rx="16" fill="#4A90C7"/>
  <rect x="277" y="44" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="307" cy="74" r="14" fill="#0F1115"/>
  <text x="307" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="297" y="112" font-size="16" font-weight="700" fill="#0F1115">Make the page fast<tspan x="297" dy="1.25em">and machine-readable</tspan></text>
  <path d="M297 148 L503 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="297" y="172" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">LCP</tspan> within 2.5 seconds</text>
  <text x="297" y="196" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">INP</tspan> 200 milliseconds or less</text>
  <text x="297" y="220" font-size="13" fill="#5C6167"><tspan font-weight="700" fill="#0F1115">CLS</tspan> 0.1 or less</text>

  <!-- 3 -->
  <rect x="552" y="50" width="246" height="200" rx="16" fill="#5FBFA8"/>
  <rect x="546" y="44" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="576" cy="74" r="14" fill="#0F1115"/>
  <text x="576" y="79" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="566" y="112" font-size="16" font-weight="700" fill="#0F1115">Earn mentions</text>
  <path d="M566 148 L772 148" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="170" font-size="13" fill="#5C6167">Google and the AI answer<tspan x="566" dy="1.3em">engines both decide who to</tspan><tspan x="566" dy="1.3em">trust by reading what other</tspan><tspan x="566" dy="1.3em">people say about you.</tspan></text>

  <rect x="14" y="274" width="784" height="64" rx="16" fill="#FDB914"/>
  <rect x="8" y="268" width="784" height="64" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="294" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">EVERY TECHNIQUE IS ONE OF THOSE THREE</text>
  <text x="34" y="320" font-size="18" font-weight="700" fill="#0F1115">Anything that is not is decoration.</text>
</svg>
