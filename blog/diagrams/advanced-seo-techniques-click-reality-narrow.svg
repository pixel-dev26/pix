<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 368" width="380" height="368" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What an AI summary does to the click</title>
  <desc id="d">Pew Research Center tracked 900 US adults across 68,879 Google searches in July 2025. Users clicked a traditional result on 15 per cent of searches without an AI summary, 8 per cent of searches with one, and clicked a link inside the summary itself on 1 per cent.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT A CLICK IS WORTH NOW</text>

  <rect x="13" y="39" width="359" height="288" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="288" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>

  <text x="24" y="62" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SEARCHES THAT PRODUCED A CLICK</text>
  <path d="M24 76 L351 76" stroke="#E7E9EC" stroke-width="2"/>

  <text x="24" y="104" font-size="14" fill="#5C6167">No AI summary shown</text>
  <rect x="24" y="114" width="276" height="32" rx="16" ry="16" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="312" y="137" font-size="17" font-weight="700" fill="#0F1115">15%</text>

  <text x="24" y="176" font-size="14" fill="#5C6167">An AI summary shown</text>
  <rect x="24" y="186" width="147" height="32" rx="16" ry="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="183" y="209" font-size="17" font-weight="700" fill="#0F1115">8%</text>

  <text x="24" y="248" font-size="14" fill="#5C6167">A link inside the summary</text>
  <rect x="24" y="258" width="18" height="32" rx="16" ry="16" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="54" y="281" font-size="17" font-weight="700" fill="#0F1115">1%</text>

  <text x="24" y="310" font-size="13" fill="#6A6F75">Pew Research Center, July 2025.</text>

  <text x="8" y="356" font-size="14" fill="#5C6167">Still the best position, worth less than it was.</text>
</svg>
