<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 362" width="800" height="362" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The eight-step logo design process</title>
  <desc id="d">A left-to-right sequence of eight numbered stages: understand the brand, gather inspiration, sketch and conceptualise, feedback and iteration, digital rendering, typography and colours, scalability and versatility, finalise and deliver. Feedback loops back to sketching.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EE3D41"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">EIGHT STAGES, ONE LOOP</text>

  <!-- row 1 -->
  <rect x="14" y="48" width="181" height="94" rx="16" fill="#FDB914"/>
  <rect x="8" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="72" r="15" fill="#0F1115"/>
  <text x="38" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="110" font-size="15" font-weight="700" fill="#0F1115">Understand<tspan x="28" dy="1.3em">the brand</tspan></text>

  <rect x="215" y="48" width="181" height="94" rx="16" fill="#FDB914"/>
  <rect x="209" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="239" cy="72" r="15" fill="#0F1115"/>
  <text x="239" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="229" y="110" font-size="15" font-weight="700" fill="#0F1115">Gather<tspan x="229" dy="1.3em">inspiration</tspan></text>

  <rect x="416" y="48" width="181" height="94" rx="16" fill="#FDB914"/>
  <rect x="410" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="440" cy="72" r="15" fill="#0F1115"/>
  <text x="440" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="430" y="110" font-size="15" font-weight="700" fill="#0F1115">Sketch and<tspan x="430" dy="1.3em">conceptualise</tspan></text>

  <rect x="617" y="48" width="181" height="94" rx="16" fill="#EE3D41"/>
  <rect x="611" y="42" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="641" cy="72" r="15" fill="#0F1115"/>
  <text x="641" y="78" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="631" y="110" font-size="15" font-weight="700" fill="#0F1115">Feedback and<tspan x="631" dy="1.3em">iteration</tspan></text>

  <path d="M191 89 L205 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 89 L406 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M593 89 L607 89" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- the loop back to sketching -->
  <path d="M701 142 L701 168 L500 168 L500 142" fill="none" stroke="#EE3D41" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="600" y="188" font-size="12" font-weight="700" fill="#EE3D41" text-anchor="middle">repeat until it holds</text>

  <!-- row 2 -->
  <rect x="14" y="214" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="8" y="208" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="238" r="15" fill="#0F1115"/>
  <text x="38" y="244" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="28" y="276" font-size="15" font-weight="700" fill="#0F1115">Digital<tspan x="28" dy="1.3em">rendering</tspan></text>

  <rect x="215" y="214" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="209" y="208" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="239" cy="238" r="15" fill="#0F1115"/>
  <text x="239" y="244" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="229" y="276" font-size="15" font-weight="700" fill="#0F1115">Typography<tspan x="229" dy="1.3em">and colours</tspan></text>

  <rect x="416" y="214" width="181" height="94" rx="16" fill="#4A90C7"/>
  <rect x="410" y="208" width="181" height="94" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="440" cy="238" r="15" fill="#0F1115"/>
  <text x="440" y="244" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="430" y="276" font-size="15" font-weight="700" fill="#0F1115">Scalability and<tspan x="430" dy="1.3em">versatility</tspan></text>

  <rect x="617" y="214" width="181" height="94" rx="16" fill="#0F1115"/>
  <rect x="611" y="208" width="181" height="94" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="641" cy="238" r="15" fill="#0F1115"/>
  <text x="641" y="244" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="631" y="276" font-size="15" font-weight="700" fill="#0F1115">Finalise and<tspan x="631" dy="1.3em">deliver</tspan></text>

  <path d="M191 255 L205 255" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M392 255 L406 255" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M593 255 L607 255" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <text x="8" y="346" font-size="14" fill="#5C6167">Step 4 is the one that repeats. Everything after it is execution, not exploration.</text>
</svg>
