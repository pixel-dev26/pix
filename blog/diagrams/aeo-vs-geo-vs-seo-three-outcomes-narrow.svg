<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 540" width="380" height="540" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">SEO, AEO and GEO: three outcomes on one shared foundation</title>
  <desc id="d">Three stacked cards — SEO gets a page ranked, AEO gets it quoted, GEO gets it cited — all resting on a band labelled one technical foundation, not three retainers.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE ACRONYMS, THREE OUTCOMES</text>

  <!-- SEO -->
  <rect x="13" y="39" width="359" height="112" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="52" width="64" height="27" rx="999" fill="#0F1115"/>
  <text x="58" y="71" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">SEO</text>
  <text x="104" y="72" font-size="20" font-weight="700" fill="#0F1115">Gets you ranked</text>
  <text x="26" y="106" font-size="15" fill="#5C6167">In the list of blue links a human<tspan x="26" dy="1.4em">then clicks.</tspan></text>

  <!-- AEO -->
  <rect x="13" y="171" width="359" height="112" rx="16" fill="#FDB914"/>
  <rect x="8" y="166" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="184" width="64" height="27" rx="999" fill="#0F1115"/>
  <text x="58" y="203" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AEO</text>
  <text x="104" y="204" font-size="20" font-weight="700" fill="#0F1115">Gets you quoted</text>
  <text x="26" y="238" font-size="15" fill="#5C6167">Lifted into the answer shown<tspan x="26" dy="1.4em">above the list.</tspan></text>

  <!-- GEO -->
  <rect x="13" y="303" width="359" height="112" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="298" width="359" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="26" y="316" width="64" height="27" rx="999" fill="#0F1115"/>
  <text x="58" y="335" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">GEO</text>
  <text x="104" y="336" font-size="20" font-weight="700" fill="#0F1115">Gets you cited</text>
  <text x="26" y="370" font-size="15" fill="#5C6167">Named as a source inside a<tspan x="26" dy="1.4em">generated response.</tspan></text>

  <path d="M190 418 L190 436" stroke="#8E959D" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- the shared foundation -->
  <rect x="13" y="447" width="359" height="60" rx="16" fill="#FDB914"/>
  <rect x="8" y="442" width="359" height="60" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="26" y="468" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">ALL THREE STAND ON</text>
  <text x="26" y="491" font-size="16" font-weight="700" fill="#0F1115">One crawlable, fast site</text>

  <text x="8" y="530" font-size="15" font-weight="700" fill="#0F1115">One strategy, not three retainers.</text>
</svg>
