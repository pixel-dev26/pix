<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 446" width="800" height="446" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">What to give the machine and what to write yourself</title>
  <desc id="d">Two columns. The machine handles volume, variants, structure and compression: the first ugly draft, compressing by a third, twenty headline variants, meeting notes into a structure, one proposition in six lengths, second-language editing. You supply the specifics: the number, the name, the date, the loss, the opinion you would defend.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE SPLIT I WOULD GIVE ANY WRITER ON MY TEAM</text>

  <!-- the machine -->
  <rect x="14" y="46" width="380" height="290" rx="16" fill="#4A90C7"/>
  <rect x="8" y="40" width="380" height="290" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="128" height="26" rx="999" fill="#0F1115"/>
  <text x="92" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE MACHINE</text>
  <text x="28" y="114" font-size="18" font-weight="700" fill="#0F1115">Volume, variants,<tspan x="28" dy="1.3em">structure, compression</tspan></text>
  <path d="M28 154 L368 154" stroke="#E7E9EC" stroke-width="2"/>
  <circle cx="34" cy="171" r="3" fill="#8E959D"/>
  <text x="48" y="176" font-size="14" fill="#5C6167">The first ugly draft you will throw away</text>
  <circle cx="34" cy="197" r="3" fill="#8E959D"/>
  <text x="48" y="202" font-size="14" fill="#5C6167">Compressing something by a third</text>
  <circle cx="34" cy="223" r="3" fill="#8E959D"/>
  <text x="48" y="228" font-size="14" fill="#5C6167">Twenty headline variants</text>
  <circle cx="34" cy="249" r="3" fill="#8E959D"/>
  <text x="48" y="254" font-size="14" fill="#5C6167">Meeting notes into a rough structure</text>
  <circle cx="34" cy="275" r="3" fill="#8E959D"/>
  <text x="48" y="280" font-size="14" fill="#5C6167">One proposition in six lengths</text>
  <circle cx="34" cy="301" r="3" fill="#8E959D"/>
  <text x="48" y="306" font-size="14" fill="#5C6167">Second-language editing</text>

  <!-- you -->
  <rect x="418" y="46" width="380" height="290" rx="16" fill="#FDB914"/>
  <rect x="412" y="40" width="380" height="290" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="432" y="62" width="64" height="26" rx="999" fill="#0F1115"/>
  <text x="464" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">YOU</text>
  <text x="432" y="114" font-size="18" font-weight="700" fill="#0F1115">Do the specifics<tspan x="432" dy="1.3em">yourself</tspan></text>
  <path d="M432 154 L772 154" stroke="#E7E9EC" stroke-width="2"/>
  <text x="432" y="184" font-size="17" font-weight="700" fill="#0F1115">The number</text>
  <text x="432" y="214" font-size="17" font-weight="700" fill="#0F1115">The name</text>
  <text x="432" y="244" font-size="17" font-weight="700" fill="#0F1115">The date</text>
  <text x="432" y="274" font-size="17" font-weight="700" fill="#0F1115">The loss</text>
  <text x="432" y="304" font-size="17" font-weight="700" fill="#0F1115">The opinion you would defend</text>

  <!-- the test -->
  <rect x="14" y="362" width="784" height="76" rx="16" fill="#0F1115"/>
  <rect x="8" y="356" width="784" height="76" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="386" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE TEST</text>
  <text x="34" y="414" font-size="16" font-weight="700" fill="#0F1115">Strip out everything a model could have written. What survives is your positioning.</text>
</svg>
