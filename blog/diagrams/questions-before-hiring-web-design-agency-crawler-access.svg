<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Search access and training access are separate permissions</title>
  <desc id="d">A two-by-two grid. OpenAI splits its crawlers into OAI-SearchBot, which surfaces websites in ChatGPT's search features, and GPTBot, which crawls content that may be used to train foundation models. Anthropic splits the same way, with Claude-SearchBot improving search result quality and ClaudeBot collecting training content.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FOUR CRAWLERS, TWO DIFFERENT PERMISSIONS</text>

  <rect x="216" y="40" width="282" height="34" rx="999" fill="#4A90C7"/>
  <text x="357" y="63" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">SEARCH ACCESS</text>
  <rect x="510" y="40" width="282" height="34" rx="999" fill="#FDB914"/>
  <text x="651" y="63" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">TRAINING ACCESS</text>

  <text x="8" y="150" font-size="19" font-weight="700" fill="#0F1115">OpenAI</text>
  <text x="8" y="172" font-size="12" fill="#6A6F75">ChatGPT</text>

  <rect x="222" y="94" width="282" height="112" rx="16" fill="#4A90C7"/>
  <rect x="216" y="88" width="282" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="236" y="126" font-size="18" font-weight="700" fill="#0F1115">OAI-SearchBot</text>
  <text x="236" y="156" font-size="14" fill="#5C6167">Surfaces websites in search<tspan x="236" dy="1.35em">results in ChatGPT search.</tspan></text>

  <rect x="516" y="94" width="282" height="112" rx="16" fill="#FDB914"/>
  <rect x="510" y="88" width="282" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="530" y="126" font-size="18" font-weight="700" fill="#0F1115">GPTBot</text>
  <text x="530" y="156" font-size="14" fill="#5C6167">Crawls content that may be<tspan x="530" dy="1.35em">used to train the models.</tspan></text>

  <text x="8" y="278" font-size="19" font-weight="700" fill="#0F1115">Anthropic</text>
  <text x="8" y="300" font-size="12" fill="#6A6F75">Claude</text>

  <rect x="222" y="222" width="282" height="112" rx="16" fill="#4A90C7"/>
  <rect x="216" y="216" width="282" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="236" y="254" font-size="18" font-weight="700" fill="#0F1115">Claude-SearchBot</text>
  <text x="236" y="284" font-size="14" fill="#5C6167">Improves search result quality.</text>

  <rect x="516" y="222" width="282" height="112" rx="16" fill="#FDB914"/>
  <rect x="510" y="216" width="282" height="112" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="530" y="254" font-size="18" font-weight="700" fill="#0F1115">ClaudeBot</text>
  <text x="530" y="284" font-size="14" fill="#5C6167">Collects training content.</text>

  <text x="8" y="368" font-size="14" font-weight="700" fill="#0F1115">A robots.txt inherited from your host&#8217;s default can lock you out of AI answers</text>
  <text x="8" y="390" font-size="14" font-weight="700" fill="#0F1115">while you believe you only opted out of training, or the exact reverse.</text>
</svg>
