<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" width="800" height="436" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How Adobe absorbs a plugin category</title>
  <desc id="d">A plugin proves a feature is worth money, Adobe ships it in the base app, and the plugin becomes a rounding error. It has happened three times already: sky replacement, upscaling and compositing. What survives is a narrow, unglamorous job Adobe has no commercial reason to build, such as grids, noise, brushes and colour panels.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHY A PLUGIN LIST AGES BADLY</text>

  <rect x="14" y="46" width="240" height="104" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="240" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="38" cy="70" r="15" fill="#0F1115"/>
  <text x="38" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="28" y="110" font-size="15" font-weight="700" fill="#0F1115">A plugin proves a<tspan x="28" dy="1.3em">feature is worth money</tspan></text>

  <rect x="286" y="46" width="240" height="104" rx="16" fill="#FA6B45"/>
  <rect x="280" y="40" width="240" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="310" cy="70" r="15" fill="#0F1115"/>
  <text x="310" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="300" y="110" font-size="15" font-weight="700" fill="#0F1115">Adobe ships it in<tspan x="300" dy="1.3em">the base app</tspan></text>

  <rect x="558" y="46" width="240" height="104" rx="16" fill="#EE3D41"/>
  <rect x="552" y="40" width="240" height="104" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="582" cy="70" r="15" fill="#0F1115"/>
  <text x="582" y="76" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="572" y="110" font-size="15" font-weight="700" fill="#0F1115">The plugin becomes<tspan x="572" dy="1.3em">a rounding error</tspan></text>

  <path d="M258 92 L274 92" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M530 92 L546 92" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <!-- worked examples -->
  <rect x="14" y="176" width="784" height="136" rx="16" fill="#4A90C7"/>
  <rect x="8" y="170" width="784" height="136" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="198" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THIS HAS ALREADY HAPPENED THREE TIMES</text>
  <text x="34" y="228" font-size="14" font-weight="700" fill="#0F1115">Sky replacement</text>
  <text x="210" y="228" font-size="14" fill="#5C6167">Luminar AI&#8217;s headline feature. Photoshop shipped it in October 2020.</text>
  <text x="34" y="258" font-size="14" font-weight="700" fill="#0F1115">Upscaling</text>
  <text x="210" y="258" font-size="14" fill="#5C6167">Generative Upscale shipped in October 2025, running Topaz Labs&#8217; models.</text>
  <text x="34" y="288" font-size="14" font-weight="700" fill="#0F1115">Compositing</text>
  <text x="210" y="288" font-size="14" fill="#5C6167">Harmonize blends objects into new scenes, matching light, colour and tone.</text>

  <!-- what survives -->
  <rect x="14" y="332" width="784" height="90" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="326" width="784" height="90" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="354" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHAT SURVIVES</text>
  <text x="34" y="380" font-size="15" font-weight="700" fill="#0F1115">A narrow, unglamorous job Adobe has no commercial reason to build.</text>
  <text x="34" y="404" font-size="14" fill="#5C6167">Grids. Noise. Brushes. Colour panels. Nothing in that list is exciting.</text>
</svg>
