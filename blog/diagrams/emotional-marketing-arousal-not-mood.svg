<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" width="800" height="406" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Arousal, not mood, is what gets content shared</title>
  <desc id="d">A two-by-two of valence against arousal. High-arousal emotions get shared whether they are negative, such as anger and anxiety, or positive, such as awe. Low-arousal emotions do not: Berger and Milkman name sadness as deactivating and found content evoking it less viral, not more, and calm agreeable work is the least likely thing to move.</desc>

  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E959D"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">BERGER AND MILKMAN, JOURNAL OF MARKETING RESEARCH, 2012</text>

  <text x="307" y="44" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="middle">NEGATIVE FEELING</text>
  <text x="637" y="44" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75" text-anchor="middle">POSITIVE FEELING</text>

  <path d="M140 340 L140 70" fill="none" stroke="#8E959D" stroke-width="2" marker-end="url(#up)"/>

  <text x="8" y="120" font-size="13" font-weight="700" fill="#0F1115">HIGH</text>
  <text x="8" y="138" font-size="13" font-weight="700" fill="#0F1115">AROUSAL</text>
  <text x="8" y="280" font-size="13" font-weight="700" fill="#5C6167">LOW</text>
  <text x="8" y="298" font-size="13" font-weight="700" fill="#5C6167">AROUSAL</text>

  <!-- high arousal, negative -->
  <rect x="158" y="62" width="310" height="140" rx="16" fill="#EE3D41"/>
  <rect x="152" y="56" width="310" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="172" y="74" width="106" height="24" rx="999" fill="#0F1115"/>
  <text x="225" y="91" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GETS SHARED</text>
  <text x="172" y="132" font-size="19" font-weight="700" fill="#0F1115">Anger. Anxiety.</text>
  <text x="172" y="160" font-size="13" fill="#5C6167">Activating. Physiological arousal is<tspan x="172" dy="1.4em">what drives sharing, not mood.</tspan></text>

  <!-- high arousal, positive -->
  <rect x="488" y="62" width="310" height="140" rx="16" fill="#FDB914"/>
  <rect x="482" y="56" width="310" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="502" y="74" width="106" height="24" rx="999" fill="#0F1115"/>
  <text x="555" y="91" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GETS SHARED</text>
  <text x="502" y="132" font-size="19" font-weight="700" fill="#0F1115">Awe.</text>
  <text x="502" y="160" font-size="13" fill="#5C6167">The same mechanism, pleasant<tspan x="502" dy="1.4em">instead of unpleasant.</tspan></text>

  <!-- low arousal, negative -->
  <rect x="158" y="222" width="310" height="140" rx="16" fill="#8E959D"/>
  <rect x="152" y="216" width="310" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="172" y="234" width="98" height="24" rx="999" fill="#8E959D"/>
  <text x="221" y="251" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">DOES NOT</text>
  <text x="172" y="292" font-size="19" font-weight="700" fill="#0F1115">Sadness.</text>
  <text x="172" y="320" font-size="13" fill="#5C6167">Deactivating. Content that evokes<tspan x="172" dy="1.4em">it is less viral, not more.</tspan></text>

  <!-- low arousal, positive -->
  <rect x="488" y="222" width="310" height="140" rx="16" fill="#8E959D"/>
  <rect x="482" y="216" width="310" height="140" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="502" y="234" width="98" height="24" rx="999" fill="#8E959D"/>
  <text x="551" y="251" font-size="12" font-weight="700" fill="#0F1115" text-anchor="middle">DOES NOT</text>
  <text x="502" y="292" font-size="19" font-weight="700" fill="#0F1115">Calm and agreeable.</text>
  <text x="502" y="320" font-size="13" fill="#5C6167">The least likely piece of work<tspan x="502" dy="1.4em">to move anywhere.</tspan></text>

  <text x="8" y="392" font-size="14" fill="#5C6167">Positive content outperforms negative overall, but valence alone predicts very little.</text>
</svg>
