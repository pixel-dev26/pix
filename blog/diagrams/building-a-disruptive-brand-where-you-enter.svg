<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" width="800" height="406" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Disruption is about where you enter, not how bold you are</title>
  <desc id="d">The market drawn as four tiers. Tesla started at the top of the market and worked downward. Uber started with the customers incumbents already wanted. Classic disruption starts in the overlooked low end or with people buying nothing at all, is worse by mainstream standards, improves, then moves upmarket.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHERE AN ENTRANT COMES IN</text>

  <path d="M30 300 L30 66" fill="none" stroke="#0F1115" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>

  <!-- top of the market -->
  <rect x="58" y="50" width="548" height="62" rx="16" fill="#E7E9EC"/>
  <rect x="52" y="44" width="548" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="76" y="82" font-size="16" font-weight="700" fill="#0F1115">The top of the market</text>
  <text x="576" y="82" font-size="13" fill="#5C6167" text-anchor="end">where you win by being better</text>

  <!-- mainstream -->
  <rect x="58" y="120" width="548" height="62" rx="16" fill="#E7E9EC"/>
  <rect x="52" y="114" width="548" height="62" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="76" y="152" font-size="16" font-weight="700" fill="#0F1115">The customers incumbents want</text>
  <text x="576" y="152" font-size="13" fill="#5C6167" text-anchor="end">they will fight for these</text>

  <!-- overlooked low end -->
  <rect x="58" y="190" width="548" height="62" rx="16" fill="#0F1115"/>
  <rect x="52" y="184" width="548" height="62" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="76" y="222" font-size="16" font-weight="700" fill="#0F1115">The overlooked low end</text>
  <text x="576" y="222" font-size="13" fill="#0F1115" text-anchor="end">paying for capability they do not use</text>

  <!-- non-consumers -->
  <rect x="58" y="260" width="548" height="62" rx="16" fill="#0F1115"/>
  <rect x="52" y="254" width="548" height="62" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="76" y="292" font-size="16" font-weight="700" fill="#0F1115">People buying nothing at all</text>
  <text x="576" y="292" font-size="13" fill="#0F1115" text-anchor="end">not in anybody&#8217;s data</text>

  <!-- who entered where -->
  <rect x="630" y="58" width="168" height="50" rx="16" fill="#EE3D41"/>
  <rect x="624" y="52" width="168" height="50" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="642" y="74" font-size="13" font-weight="700" fill="#0F1115">Tesla<tspan x="642" dy="1.35em">started here</tspan></text>

  <rect x="630" y="128" width="168" height="50" rx="16" fill="#EE3D41"/>
  <rect x="624" y="122" width="168" height="50" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="642" y="144" font-size="13" font-weight="700" fill="#0F1115">Uber<tspan x="642" dy="1.35em">started here</tspan></text>

  <rect x="630" y="198" width="168" height="120" rx="16" fill="#FDB914"/>
  <rect x="624" y="192" width="168" height="120" rx="16" fill="#0F1115"/>
  <text x="642" y="232" font-size="13" font-weight="700" fill="#FFFFFF">Classic<tspan x="642" dy="1.35em">disruption</tspan><tspan x="642" dy="1.35em">starts here</tspan></text>

  <rect x="14" y="342" width="784" height="52" rx="16" fill="#FDB914"/>
  <rect x="8" y="336" width="784" height="52" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="368" font-size="14" font-weight="700" fill="#0F1115">Worse by the standards the mainstream cares about. It improves. Then it moves upmarket.</text>
</svg>
