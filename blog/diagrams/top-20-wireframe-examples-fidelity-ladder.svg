<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" width="800" height="448" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The fidelity ladder decides what gets argued about</title>
  <desc id="d">Low fidelity keeps the structure open and invites change. Medium fidelity is for hierarchy, once the structure is agreed. High fidelity is for behaviour, states and real data density, and it is the stage that starts costing money. Jumping straight to high fidelity collects the wrong notes.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FIDELITY DECIDES WHAT GETS ARGUED ABOUT</text>

  <!-- low -->
  <rect x="14" y="46" width="246" height="236" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="246" height="236" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="118" height="26" rx="999" fill="#0F1115"/>
  <text x="87" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LOW FIDELITY</text>
  <text x="28" y="118" font-size="18" font-weight="700" fill="#0F1115">Structure is<tspan x="28" dy="1.3em">still open</tspan></text>
  <path d="M28 158 L234 158" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="182" font-size="14" fill="#5C6167">Grey boxes, no type choices,<tspan x="28" dy="1.35em">no brand colour.</tspan></text>
  <text x="28" y="234" font-size="14" fill="#5C6167">It looks unfinished, so people<tspan x="28" dy="1.35em">feel invited to change it.</tspan></text>

  <!-- medium -->
  <rect x="283" y="46" width="246" height="236" rx="16" fill="#4A90C7"/>
  <rect x="277" y="40" width="246" height="236" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="62" width="148" height="26" rx="999" fill="#0F1115"/>
  <text x="371" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MEDIUM FIDELITY</text>
  <text x="297" y="118" font-size="18" font-weight="700" fill="#0F1115">Hierarchy is<tspan x="297" dy="1.3em">the question</tspan></text>
  <path d="M297 158 L503 158" stroke="#E7E9EC" stroke-width="2"/>
  <text x="297" y="182" font-size="14" fill="#5C6167">The structure is agreed. Now<tspan x="297" dy="1.35em">the argument is size.</tspan></text>
  <text x="297" y="234" font-size="14" fill="#5C6167">What is large, what is small,<tspan x="297" dy="1.35em">what the eye lands on first.</tspan></text>

  <!-- high -->
  <rect x="552" y="46" width="246" height="236" rx="16" fill="#FA6B45"/>
  <rect x="546" y="40" width="246" height="236" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="62" width="128" height="26" rx="999" fill="#0F1115"/>
  <text x="630" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">HIGH FIDELITY</text>
  <text x="566" y="118" font-size="18" font-weight="700" fill="#0F1115">Behaviour,<tspan x="566" dy="1.3em">not layout</tspan></text>
  <path d="M566 158 L772 158" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="182" font-size="14" fill="#5C6167">States, interactions and real<tspan x="566" dy="1.35em">data density.</tspan></text>
  <text x="566" y="234" font-size="14" fill="#5C6167">This is the stage that starts<tspan x="566" dy="1.35em">costing money.</tspan></text>

  <text x="8" y="331" font-size="14" fill="#5C6167">cheap to change</text>
  <path d="M130 326 L590 326" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <text x="792" y="331" font-size="14" fill="#5C6167" text-anchor="end">and it starts costing money</text>

  <!-- the mistake -->
  <rect x="14" y="356" width="784" height="84" rx="16" fill="#FDB914"/>
  <rect x="8" y="350" width="784" height="84" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="380" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE MOST EXPENSIVE MISTAKE</text>
  <text x="34" y="406" font-size="17" font-weight="700" fill="#0F1115">Jumping straight to high fidelity because it demos better in a meeting.</text>
  <text x="34" y="426" font-size="14" fill="#5C6167">It does demo better. It also collects the wrong notes, after you have paid to make everything look finished.</text>
</svg>
