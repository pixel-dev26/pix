<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 602" width="380" height="602" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Four repairs on one side, a rebuild on the other</title>
  <desc id="d">Two stacked panels. Repair covers slow pages, copy a competitor could also write, a broken or buried contact route, and a brand the site no longer matches. Rebuild covers routine edits that cost developer time, templates that cannot express what the business now does, and overdue security updates nobody dares apply.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">REPAIR OR REBUILD</text>

  <!-- repair -->
  <rect x="13" y="39" width="359" height="244" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="359" height="244" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="52" width="88" height="28" rx="14" ry="14" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="68" y="71" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">REPAIR</text>
  <text x="24" y="106" font-size="16" font-weight="700" fill="#0F1115">Fix one at a time, measure each</text>
  <path d="M24 122 L351 122" stroke="#E7E9EC" stroke-width="2"/>

  <circle cx="30" cy="141" r="4" fill="#0F1115"/>
  <text x="44" y="146" font-size="14" fill="#5C6167">The pages are slow.</text>
  <circle cx="30" cy="175" r="4" fill="#0F1115"/>
  <text x="44" y="180" font-size="14" fill="#5C6167">The copy says nothing a competitor<tspan x="44" dy="1.3em">could not say.</tspan></text>
  <circle cx="30" cy="219" r="4" fill="#0F1115"/>
  <text x="44" y="224" font-size="14" fill="#5C6167">The contact route is broken or buried.</text>
  <circle cx="30" cy="253" r="4" fill="#0F1115"/>
  <text x="44" y="258" font-size="14" fill="#5C6167">The brand moved on, the site did not.</text>

  <!-- rebuild -->
  <rect x="13" y="307" width="359" height="256" rx="16" fill="#EE3D41"/>
  <rect x="8" y="302" width="359" height="256" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="24" y="320" width="96" height="28" rx="14" ry="14" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <text x="72" y="339" font-size="13" font-weight="700" letter-spacing="1" fill="#0F1115" text-anchor="middle">REBUILD</text>
  <text x="24" y="374" font-size="16" font-weight="700" fill="#0F1115">The structure underneath<tspan x="24" dy="1.35em">is fighting you</tspan></text>
  <path d="M24 412 L351 412" stroke="#E7E9EC" stroke-width="2"/>

  <circle cx="30" cy="431" r="4" fill="#0F1115"/>
  <text x="44" y="436" font-size="14" fill="#5C6167">Routine edits cost developer time.</text>
  <circle cx="30" cy="475" r="4" fill="#0F1115"/>
  <text x="44" y="480" font-size="14" fill="#5C6167">The templates cannot express what<tspan x="44" dy="1.3em">the business now does.</tspan></text>
  <circle cx="30" cy="519" r="4" fill="#0F1115"/>
  <text x="44" y="524" font-size="14" fill="#5C6167">Security updates are overdue because<tspan x="44" dy="1.3em">nobody dares touch it.</tspan></text>

  <text x="8" y="590" font-size="14" fill="#5C6167">A repair can be measured. A rebuild cannot.</text>
</svg>
