<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 428" width="800" height="428" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">When to rebrand, and when not to</title>
  <desc id="d">Rebrand when the brand no longer excites, the image is wrong or damaged, the business has changed course, two companies merge, you are repositioning, or you are entering a market that reads you wrong. Do not rebrand because a competitor did, because you are bored of the visuals, because you are new with no reputation yet, or when your brand equity is already strong. The test is what will be true about the company afterwards that is not true today.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE QUESTION BEFORE THE BRIEF</text>

  <!-- rebrand when -->
  <rect x="14" y="46" width="382" height="286" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="382" height="286" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="78" font-size="18" font-weight="700" fill="#0F1115">Rebrand when</text>
  <circle cx="34" cy="107" r="4" fill="#0F1115"/>
  <text x="50" y="112" font-size="13" fill="#5C6167">The brand has stopped exciting anyone</text>
  <circle cx="34" cy="141" r="4" fill="#0F1115"/>
  <text x="50" y="146" font-size="13" fill="#5C6167">The image is wrong: mixed signals, or damage</text>
  <circle cx="34" cy="175" r="4" fill="#0F1115"/>
  <text x="50" y="180" font-size="13" fill="#5C6167">The business itself has changed course</text>
  <circle cx="34" cy="209" r="4" fill="#0F1115"/>
  <text x="50" y="214" font-size="13" fill="#5C6167">Two companies merge into one offer</text>
  <circle cx="34" cy="243" r="4" fill="#0F1115"/>
  <text x="50" y="248" font-size="13" fill="#5C6167">You are repositioning in the market</text>
  <circle cx="34" cy="277" r="4" fill="#0F1115"/>
  <text x="50" y="282" font-size="13" fill="#5C6167">You are entering a market that reads you wrong</text>

  <!-- do not rebrand when -->
  <rect x="416" y="46" width="382" height="286" rx="16" fill="#EE3D41"/>
  <rect x="410" y="40" width="382" height="286" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="430" y="78" font-size="18" font-weight="700" fill="#0F1115">Do not rebrand when</text>
  <circle cx="436" cy="107" r="4" fill="#0F1115"/>
  <text x="452" y="112" font-size="13" fill="#5C6167">A competitor has just rebranded</text>
  <circle cx="436" cy="141" r="4" fill="#0F1115"/>
  <text x="452" y="146" font-size="13" fill="#5C6167">You are simply bored of the visuals</text>
  <circle cx="436" cy="175" r="4" fill="#0F1115"/>
  <text x="452" y="180" font-size="13" fill="#5C6167">You are new and have no reputation yet</text>
  <circle cx="436" cy="209" r="4" fill="#0F1115"/>
  <text x="452" y="214" font-size="13" fill="#5C6167">Your brand equity is strong and loyal</text>

  <rect x="430" y="244" width="342" height="66" rx="12" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <text x="448" y="270" font-size="13" font-weight="700" fill="#0F1115">Strategy intact, identity merely aged?</text>
  <text x="448" y="292" font-size="13" fill="#5C6167">Refresh it. You keep the recognition.</text>

  <!-- the test -->
  <rect x="14" y="352" width="784" height="68" rx="16" fill="#FDB914"/>
  <rect x="8" y="346" width="784" height="68" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="374" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE TEST BEFORE ANYONE QUOTES</text>
  <text x="34" y="400" font-size="16" font-weight="700" fill="#0F1115">What will be true about your company after this that is not true today?</text>
</svg>
