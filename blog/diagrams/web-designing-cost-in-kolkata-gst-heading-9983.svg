<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" width="800" height="516" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where the 18% GST on web design comes from</title>
  <desc id="d">Heading 9983, Other professional, technical and business services, sits at serial number 21 of Notification 11/2017-Central Tax (Rate). Three SAC codes sit under it: 998314 for IT design and development, 998315 for hosting and infrastructure, and 998391 for specialty design. Nine per cent central tax plus nine per cent state tax makes 18 per cent under any of them.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE CODE THE TAX SITS UNDER</text>

  <rect x="14" y="46" width="784" height="86" rx="16" fill="#FDB914"/>
  <rect x="8" y="40" width="784" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="70" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">NOTIFICATION 11/2017-CENTRAL TAX (RATE), SERIAL 21</text>
  <text x="34" y="102" font-size="19" font-weight="700" fill="#0F1115">Heading 9983 &#8212; other professional, technical and business services</text>

  <path d="M400 138 L400 152 M131 152 L669 152 M131 152 L131 168 M400 152 L400 168 M669 152 L669 168" fill="none" stroke="#8E959D" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="14" y="176" width="246" height="150" rx="16" fill="#4A90C7"/>
  <rect x="8" y="170" width="246" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="192" width="100" height="26" rx="999" fill="#0F1115"/>
  <text x="78" y="210" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998314</text>
  <text x="28" y="248" font-size="17" font-weight="700" fill="#0F1115">IT design and<tspan x="28" dy="1.3em">development</tspan></text>
  <text x="28" y="300" font-size="14" fill="#5C6167">Most website builds sit here.</text>

  <rect x="283" y="176" width="246" height="150" rx="16" fill="#4A90C7"/>
  <rect x="277" y="170" width="246" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="192" width="100" height="26" rx="999" fill="#0F1115"/>
  <text x="347" y="210" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998315</text>
  <text x="297" y="248" font-size="17" font-weight="700" fill="#0F1115">Hosting and IT<tspan x="297" dy="1.3em">infrastructure</tspan></text>
  <text x="297" y="300" font-size="14" fill="#5C6167">If the agency resells hosting.</text>

  <rect x="552" y="176" width="246" height="150" rx="16" fill="#4A90C7"/>
  <rect x="546" y="170" width="246" height="150" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="192" width="100" height="26" rx="999" fill="#0F1115"/>
  <text x="616" y="210" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">998391</text>
  <text x="566" y="248" font-size="17" font-weight="700" fill="#0F1115">Specialty design<tspan x="566" dy="1.3em">services</tspan></text>
  <text x="566" y="300" font-size="14" fill="#5C6167">Where some studios put it.</text>

  <rect x="14" y="358" width="784" height="110" rx="16" fill="#0F1115"/>
  <rect x="8" y="352" width="784" height="110" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="382" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">WHERE THE 18% COMES FROM</text>

  <rect x="34" y="396" width="190" height="48" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="54" y="428" font-size="22" font-weight="700" fill="#0F1115">9%</text>
  <text x="94" y="428" font-size="14" fill="#5C6167">central tax</text>
  <text x="244" y="428" font-size="22" font-weight="700" fill="#0F1115" text-anchor="middle">+</text>
  <rect x="264" y="396" width="180" height="48" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="284" y="428" font-size="22" font-weight="700" fill="#0F1115">9%</text>
  <text x="324" y="428" font-size="14" fill="#5C6167">state tax</text>
  <text x="464" y="428" font-size="22" font-weight="700" fill="#0F1115" text-anchor="middle">=</text>
  <rect x="484" y="396" width="200" height="48" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="504" y="428" font-size="22" font-weight="700" fill="#0F1115">18%</text>
  <text x="552" y="428" font-size="14" fill="#0F1115">on the invoice</text>

  <text x="8" y="490" font-size="14" fill="#5C6167">The September 2025 amendment rewrote serial 21 and left the rate column untouched.</text>
  <text x="8" y="510" font-size="14" fill="#5C6167">All three SAC codes sit under Heading 9983, so the argument about which one applies does not change what you pay.</text>
</svg>
