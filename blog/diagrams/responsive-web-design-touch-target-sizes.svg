<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Touch target sizes: 20, 24 and 44 CSS pixels compared</title>
  <desc id="d">Three squares on a shared baseline. A 20 by 20 pixel icon packed edge to edge fails both requirements. 24 by 24 CSS pixels is WCAG 2.2 Success Criterion 2.5.8 Target Size Minimum at Level AA, the compliance floor. 44 by 44 CSS pixels is Success Criterion 2.5.5 Target Size Enhanced at Level AAA, the design target.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TAP TARGETS, DRAWN AT THE SIZES THE STANDARD NAMES</text>

  <!-- too small -->
  <rect x="14" y="46" width="246" height="246" rx="16" fill="#EE3D41"/>
  <rect x="8" y="40" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="28" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">FAILS BOTH</text>
  <text x="28" y="98" font-size="18" font-weight="700" fill="#0F1115">Too small</text>
  <rect x="28" y="160" width="20" height="20" rx="4" fill="#EE3D41" stroke="#0F1115" stroke-width="2"/>
  <path d="M28 190 L234 190" stroke="#E7E9EC" stroke-width="2"/>
  <text x="28" y="222" font-size="22" font-weight="700" fill="#0F1115">20 &#215; 20 px</text>
  <text x="28" y="248" font-size="14" fill="#5C6167">A row of these packed edge<tspan x="28" dy="1.35em">to edge fails both levels.</tspan></text>

  <!-- the floor -->
  <rect x="283" y="46" width="246" height="246" rx="16" fill="#FDB914"/>
  <rect x="277" y="40" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="297" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SC 2.5.8 &#183; LEVEL AA</text>
  <text x="297" y="98" font-size="18" font-weight="700" fill="#0F1115">The floor</text>
  <rect x="297" y="156" width="24" height="24" rx="5" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <path d="M297 190 L503 190" stroke="#E7E9EC" stroke-width="2"/>
  <text x="297" y="222" font-size="22" font-weight="700" fill="#0F1115">24 &#215; 24 px</text>
  <text x="297" y="248" font-size="14" fill="#5C6167">Target Size (Minimum). The<tspan x="297" dy="1.35em">level you are actually held to.</tspan></text>

  <!-- the target -->
  <rect x="552" y="46" width="246" height="246" rx="16" fill="#5FBFA8"/>
  <rect x="546" y="40" width="246" height="246" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="566" y="68" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">SC 2.5.5 &#183; LEVEL AAA</text>
  <text x="566" y="98" font-size="18" font-weight="700" fill="#0F1115">The target</text>
  <rect x="566" y="136" width="44" height="44" rx="8" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <path d="M566 190 L772 190" stroke="#E7E9EC" stroke-width="2"/>
  <text x="566" y="222" font-size="22" font-weight="700" fill="#0F1115">44 &#215; 44 px</text>
  <text x="566" y="248" font-size="14" fill="#5C6167">Target Size (Enhanced). The<tspan x="566" dy="1.35em">figure everyone quotes.</tspan></text>

  <!-- the rule -->
  <rect x="14" y="330" width="784" height="82" rx="16" fill="#0F1115"/>
  <rect x="8" y="324" width="784" height="82" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="352" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THE RULE</text>
  <text x="34" y="378" font-size="16" font-weight="700" fill="#0F1115">24 by 24 is the compliance floor, 44 by 44 the design target.</text>
  <text x="34" y="398" font-size="14" fill="#5C6167">WCAG 2.2 also added SC 2.5.7 Dragging Movements, so anything draggable needs a tap alternative.</text>
</svg>
