<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 636" width="380" height="636" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The five gaps: the order you check them is not the order you fix them</title>
  <desc id="d">Five stacked cards in diagnostic order — entity consistency, vouching, machine readability, positioning, answer-first pages — each carrying the position it holds in the fix order and the effort it takes. Entity is fixed first in an hour; answer-first pages second; readability third; vouching fourth; positioning last.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">CHECK IN ORDER, FIX OUT OF ORDER</text>

  <!-- Gap 1 -->
  <rect x="13" y="47" width="359" height="100" rx="16" fill="#FDB914"/>
  <rect x="8" y="42" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="68" r="14" fill="#0F1115"/>
  <text x="34" y="73" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="60" y="74" font-size="16" font-weight="700" fill="#0F1115">Entity consistency</text>
  <text x="18" y="100" font-size="14" fill="#5C6167">It cannot confirm who you are</text>
  <rect x="18" y="112" width="98" height="24" rx="999" fill="#FDB914"/>
  <text x="67" y="129" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 1st</text>
  <text x="126" y="129" font-size="13" fill="#5C6167">One hour</text>

  <!-- Gap 2 -->
  <rect x="13" y="159" width="359" height="100" rx="16" fill="#D098F9"/>
  <rect x="8" y="154" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="180" r="14" fill="#0F1115"/>
  <text x="34" y="185" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="60" y="186" font-size="16" font-weight="700" fill="#0F1115">Vouching</text>
  <text x="18" y="212" font-size="14" fill="#5C6167">Nobody else is vouching for you</text>
  <rect x="18" y="224" width="98" height="24" rx="999" fill="#D098F9"/>
  <text x="67" y="241" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 4th</text>
  <text x="126" y="241" font-size="13" fill="#5C6167">Ongoing</text>

  <!-- Gap 3 -->
  <rect x="13" y="271" width="359" height="100" rx="16" fill="#4A90C7"/>
  <rect x="8" y="266" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="292" r="14" fill="#0F1115"/>
  <text x="34" y="297" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="60" y="298" font-size="16" font-weight="700" fill="#0F1115">Machine readability</text>
  <text x="18" y="324" font-size="14" fill="#5C6167">It cannot read your website</text>
  <rect x="18" y="336" width="98" height="24" rx="999" fill="#4A90C7"/>
  <text x="67" y="353" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 3rd</text>
  <text x="126" y="353" font-size="13" fill="#5C6167">Technical sprint</text>

  <!-- Gap 4 -->
  <rect x="13" y="383" width="359" height="100" rx="16" fill="#FA6B45"/>
  <rect x="8" y="378" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="404" r="14" fill="#0F1115"/>
  <text x="34" y="409" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="60" y="410" font-size="16" font-weight="700" fill="#0F1115">Positioning</text>
  <text x="18" y="436" font-size="14" fill="#5C6167">It describes everyone else too</text>
  <rect x="18" y="448" width="98" height="24" rx="999" fill="#FA6B45"/>
  <text x="67" y="465" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 5th</text>
  <text x="126" y="465" font-size="13" fill="#5C6167">Deepest work</text>

  <!-- Gap 5 -->
  <rect x="13" y="495" width="359" height="100" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="490" width="359" height="100" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="34" cy="516" r="14" fill="#0F1115"/>
  <text x="34" y="521" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="60" y="522" font-size="16" font-weight="700" fill="#0F1115">Answer-first pages</text>
  <text x="18" y="548" font-size="14" fill="#5C6167">You never answer the question</text>
  <rect x="18" y="560" width="98" height="24" rx="999" fill="#5FBFA8"/>
  <text x="67" y="577" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Fix 2nd</text>
  <text x="126" y="577" font-size="13" fill="#5C6167">2 to 4 weeks</text>

  <text x="8" y="624" font-size="14" font-weight="700" fill="#0F1115">Diagnose 1 to 5. Fix 1, 5, 3, 2, 4.</text>
</svg>
