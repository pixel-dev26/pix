<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" width="800" height="372" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The three factors Google names for local ranking</title>
  <desc id="d">Relevance is how well the profile matches the search and you control it with categories, services and your website. Distance is how far you are from the searcher and it is fixed. Prominence is how well known you are, built from links and reviews, and it is earned slowly. Social posts, geotagged photos and directory count are not on the list.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">GOOGLE NAMES THREE FACTORS. THAT IS THE WHOLE LIST.</text>

  <!-- Relevance -->
  <rect x="14" y="46" width="246" height="200" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="28" y="62" width="120" height="26" rx="999" fill="#0F1115"/>
  <text x="88" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">You control it</text>
  <text x="28" y="124" font-size="19" font-weight="700" fill="#0F1115">Relevance</text>
  <text x="28" y="156" font-size="14" fill="#5C6167">How well your profile<tspan x="28" dy="1.4em">matches the search. Set</tspan><tspan x="28" dy="1.4em">by categories and site.</tspan></text>

  <!-- Distance -->
  <rect x="283" y="46" width="246" height="200" rx="16" fill="#8E959D"/>
  <rect x="277" y="40" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="297" y="62" width="70" height="26" rx="999" fill="#0F1115"/>
  <text x="332" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fixed</text>
  <text x="297" y="124" font-size="19" font-weight="700" fill="#0F1115">Distance</text>
  <text x="297" y="156" font-size="14" fill="#5C6167">How far you are from<tspan x="297" dy="1.4em">the searcher. Settled the</tspan><tspan x="297" dy="1.4em">day you signed the lease.</tspan></text>

  <!-- Prominence -->
  <rect x="552" y="46" width="246" height="200" rx="16" fill="#FDB914"/>
  <rect x="546" y="40" width="246" height="200" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="566" y="62" width="118" height="26" rx="999" fill="#0F1115"/>
  <text x="625" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Earned slowly</text>
  <text x="566" y="124" font-size="19" font-weight="700" fill="#0F1115">Prominence</text>
  <text x="566" y="156" font-size="14" fill="#5C6167">How well known you are:<tspan x="566" dy="1.4em">links to your business,</tspan><tspan x="566" dy="1.4em">and how many reviews.</tspan></text>

  <!-- not on the list -->
  <rect x="14" y="266" width="784" height="96" rx="16" fill="#EE3D41"/>
  <rect x="8" y="260" width="784" height="96" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="288" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">NOT ON THAT LIST</text>
  <text x="34" y="314" font-size="15" fill="#5C6167">Social posts. Geotagged photos. Directory count.</text>
  <text x="34" y="342" font-size="15" font-weight="700" fill="#0F1115">&#8220;There&#8217;s no way to request or pay for a better local ranking.&#8221; &#8212; Google</text>
</svg>
