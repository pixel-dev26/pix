<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 534" width="380" height="534" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Every trend that lasted turned into a browser capability</title>
  <desc id="d">Four trends and the CSS or browser feature that absorbed each one: micro-interactions became the View Transitions API, scroll animation became animation-timeline, dark mode became prefers-color-scheme, and 3D in the browser became WebGPU.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">THE VISIBLE PART, AND THE DURABLE PART</text>
  <text x="8" y="40" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TREND</text>
  <text x="206" y="40" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">NOW PLAIN CSS</text>

  <rect x="13" y="77" width="166" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="72" width="166" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="91" y="106" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Micro-interactions</text>
  <path d="M180 100 L200 100" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="211" y="57" width="166" height="96" rx="16" fill="#4A90C7"/>
  <rect x="206" y="52" width="166" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="222" y="86" font-size="14" font-weight="700" fill="#0F1115">View Transitions<tspan x="222" dy="1.3em">API</tspan></text>
  <rect x="222" y="110" width="76" height="24" rx="12" fill="#FDB914"/>
  <text x="260" y="127" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">88.46%</text>

  <rect x="13" y="189" width="166" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="184" width="166" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="91" y="218" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Scroll animation</text>
  <path d="M180 212 L200 212" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="211" y="169" width="166" height="96" rx="16" fill="#4A90C7"/>
  <rect x="206" y="164" width="166" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="222" y="198" font-size="14" font-weight="700" fill="#0F1115">animation-<tspan x="222" dy="1.3em">timeline</tspan></text>
  <rect x="222" y="222" width="76" height="24" rx="12" fill="#FDB914"/>
  <text x="260" y="239" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">83.66%</text>

  <rect x="13" y="301" width="166" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="296" width="166" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="91" y="330" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">Dark mode</text>
  <path d="M180 324 L200 324" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="211" y="281" width="166" height="96" rx="16" fill="#4A90C7"/>
  <rect x="206" y="276" width="166" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="222" y="310" font-size="14" font-weight="700" fill="#0F1115">prefers-color-<tspan x="222" dy="1.3em">scheme</tspan></text>
  <rect x="222" y="334" width="76" height="24" rx="12" fill="#FDB914"/>
  <text x="260" y="351" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">94.25%</text>

  <rect x="13" y="413" width="166" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="408" width="166" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="91" y="442" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">3D in the browser</text>
  <path d="M180 436 L200 436" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="211" y="393" width="166" height="96" rx="16" fill="#4A90C7"/>
  <rect x="206" y="388" width="166" height="96" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="222" y="422" font-size="14" font-weight="700" fill="#0F1115">WebGPU</text>
  <rect x="222" y="446" width="76" height="24" rx="12" fill="#FDB914"/>
  <text x="260" y="463" font-size="13" font-weight="700" fill="#0F1115" text-anchor="middle">83.63%</text>

  <text x="8" y="514" font-size="13" fill="#5C6167">Global support, Can I use, 30 July 2026.</text>
</svg>
