<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="380" height="490" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The order a keyword is chosen in, with volume last</title>
  <desc id="d">Seven numbered steps: name the intent, open the results page, ask what a click is worth, check business fit, judge whether you can win it, read cost per click as commercial temperature, and only then look at volume, difficulty and trend.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SEVEN STEPS, VOLUME LAST</text>

  <rect x="13" y="39" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="8" y="34" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="62" r="14" fill="#0F1115"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="24" y="92" font-size="14" font-weight="700" fill="#0F1115">Name the<tspan x="24" dy="1.3em">intent</tspan></text>

  <rect x="205" y="39" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="200" y="34" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="62" r="14" fill="#0F1115"/>
  <text x="228" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="216" y="92" font-size="14" font-weight="700" fill="#0F1115">Open the<tspan x="216" dy="1.3em">results page</tspan></text>

  <rect x="13" y="145" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="8" y="140" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="168" r="14" fill="#0F1115"/>
  <text x="36" y="173" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="24" y="198" font-size="14" font-weight="700" fill="#0F1115">What is a click<tspan x="24" dy="1.3em">worth here?</tspan></text>

  <rect x="205" y="145" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="200" y="140" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="168" r="14" fill="#0F1115"/>
  <text x="228" y="173" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="216" y="198" font-size="14" font-weight="700" fill="#0F1115">Check business<tspan x="216" dy="1.3em">fit honestly</tspan></text>

  <rect x="13" y="251" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="8" y="246" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="274" r="14" fill="#0F1115"/>
  <text x="36" y="279" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="24" y="304" font-size="14" font-weight="700" fill="#0F1115">Can we<tspan x="24" dy="1.3em">win it?</tspan></text>

  <rect x="205" y="251" width="172" height="86" rx="16" fill="#4A90C7"/>
  <rect x="200" y="246" width="172" height="86" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="274" r="14" fill="#0F1115"/>
  <text x="228" y="279" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="216" y="304" font-size="14" font-weight="700" fill="#0F1115">Read CPC as<tspan x="216" dy="1.3em">temperature</tspan></text>

  <rect x="13" y="357" width="359" height="96" rx="16" fill="#0F1115"/>
  <rect x="8" y="352" width="359" height="96" rx="16" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="380" r="14" fill="#0F1115"/>
  <text x="36" y="385" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="64" y="386" font-size="17" font-weight="700" fill="#0F1115">Volume, difficulty, trend</text>
  <text x="24" y="418" font-size="14" fill="#0F1115">Last, deliberately. A tie-breaker<tspan x="24" dy="1.3em">between shortlisted candidates.</tspan></text>

  <text x="8" y="478" font-size="14" fill="#5C6167">Volume never builds the shortlist.</text>
</svg>
