<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 566" width="380" height="566" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The seven-step rebranding sequence</title>
  <desc id="d">Seven numbered stages in three phases. Strategy: explain the why, research and analysis, then vision, mission and values. Identity: rebuild the identity. Rollout: execute across touchpoints, plan the launch, monitor brand sentiment.</desc>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">SEVEN STEPS, THREE PHASES</text>

  <rect x="13" y="39" width="172" height="106" rx="16" fill="#FDB914"/>
  <rect x="8" y="34" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="62" r="14" fill="#0F1115"/>
  <text x="36" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="24" y="100" font-size="15" font-weight="700" fill="#0F1115">Explain<tspan x="24" dy="1.3em">the why</tspan></text>

  <rect x="205" y="39" width="172" height="106" rx="16" fill="#FDB914"/>
  <rect x="200" y="34" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="62" r="14" fill="#0F1115"/>
  <text x="228" y="67" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="216" y="100" font-size="15" font-weight="700" fill="#0F1115">Research<tspan x="216" dy="1.3em">and analysis</tspan></text>

  <rect x="13" y="159" width="172" height="106" rx="16" fill="#FDB914"/>
  <rect x="8" y="154" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="182" r="14" fill="#0F1115"/>
  <text x="36" y="187" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="24" y="220" font-size="15" font-weight="700" fill="#0F1115">Vision, mission<tspan x="24" dy="1.3em">and values</tspan></text>

  <rect x="205" y="159" width="172" height="106" rx="16" fill="#D098F9"/>
  <rect x="200" y="154" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="182" r="14" fill="#0F1115"/>
  <text x="228" y="187" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="216" y="220" font-size="15" font-weight="700" fill="#0F1115">Rebuild the<tspan x="216" dy="1.3em">identity</tspan></text>

  <rect x="13" y="279" width="172" height="106" rx="16" fill="#4A90C7"/>
  <rect x="8" y="274" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="302" r="14" fill="#0F1115"/>
  <text x="36" y="307" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="24" y="340" font-size="15" font-weight="700" fill="#0F1115">Execute across<tspan x="24" dy="1.3em">touchpoints</tspan></text>

  <rect x="205" y="279" width="172" height="106" rx="16" fill="#4A90C7"/>
  <rect x="200" y="274" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="228" cy="302" r="14" fill="#0F1115"/>
  <text x="228" y="307" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="216" y="340" font-size="15" font-weight="700" fill="#0F1115">Plan the<tspan x="216" dy="1.3em">launch</tspan></text>

  <rect x="13" y="399" width="172" height="106" rx="16" fill="#4A90C7"/>
  <rect x="8" y="394" width="172" height="106" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="36" cy="422" r="14" fill="#0F1115"/>
  <text x="36" y="427" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="24" y="460" font-size="15" font-weight="700" fill="#0F1115">Monitor brand<tspan x="24" dy="1.3em">sentiment</tspan></text>

  <rect x="200" y="394" width="172" height="106" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <text x="216" y="420" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">PHASES</text>
  <rect x="216" y="432" width="13" height="13" rx="4" fill="#FDB914" stroke="#0F1115" stroke-width="2"/>
  <text x="236" y="443" font-size="13" fill="#5C6167">1&#8211;3 Strategy</text>
  <rect x="216" y="454" width="13" height="13" rx="4" fill="#D098F9" stroke="#0F1115" stroke-width="2"/>
  <text x="236" y="465" font-size="13" fill="#5C6167">4 Identity</text>
  <rect x="216" y="476" width="13" height="13" rx="4" fill="#4A90C7" stroke="#0F1115" stroke-width="2"/>
  <text x="236" y="487" font-size="13" fill="#5C6167">5&#8211;7 Rollout</text>

  <text x="8" y="534" font-size="14" fill="#5C6167">Steps 1 to 3 decide what changes.<tspan x="8" dy="1.4em">Only step 4 draws anything.</tspan></text>
</svg>
