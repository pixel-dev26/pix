<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 632" width="380" height="632" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">When to disavow a link, according to Google's own help page</title>
  <desc id="d">Google sets two conditions joined by AND: a considerable number of spammy, artificial or low-quality links point at your site, and those links have caused a manual action or are likely to. If both are true, disavow with caution. If not, do nothing — no quarterly audit and no precautionary disavow.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1115"/>
    </marker>
  </defs>

  <text x="8" y="16" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO CONDITIONS, JOINED BY AND</text>

  <rect x="13" y="41" width="359" height="80" rx="16" fill="#FDB914"/>
  <rect x="8" y="36" width="359" height="80" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="60" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">CONDITION 1</text>
  <text x="24" y="84" font-size="15" font-weight="700" fill="#0F1115">A considerable number of spammy<tspan x="24" dy="1.3em">or low-quality links point at you.</tspan></text>

  <rect x="158" y="124" width="64" height="28" rx="999" fill="#0F1115"/>
  <text x="190" y="144" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">AND</text>

  <rect x="13" y="165" width="359" height="80" rx="16" fill="#FDB914"/>
  <rect x="8" y="160" width="359" height="80" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="184" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">CONDITION 2</text>
  <text x="24" y="208" font-size="15" font-weight="700" fill="#0F1115">They have caused a manual action,<tspan x="24" dy="1.3em">or are likely to.</tspan></text>

  <path d="M190 246 L190 268" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="277" width="359" height="48" rx="16" fill="#FDB914"/>
  <rect x="8" y="272" width="359" height="48" rx="16" fill="#0F1115"/>
  <text x="187" y="303" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Are both true?</text>

  <path d="M190 326 L190 348" stroke="#0F1115" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="13" y="361" width="359" height="116" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="356" width="359" height="116" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="382" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">IF NOT BOTH</text>
  <text x="24" y="412" font-size="19" font-weight="700" fill="#0F1115">Do nothing</text>
  <text x="24" y="438" font-size="13" fill="#5C6167">Not a quarterly audit. Not a<tspan x="24" dy="1.3em">precautionary disavow.</tspan></text>

  <rect x="13" y="493" width="359" height="116" rx="16" fill="#EE3D41"/>
  <rect x="8" y="488" width="359" height="116" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <text x="24" y="514" font-size="13" font-weight="700" letter-spacing="1" fill="#6A6F75">IF BOTH</text>
  <text x="24" y="544" font-size="19" font-weight="700" fill="#0F1115">Disavow, with caution</text>
  <text x="24" y="570" font-size="13" fill="#5C6167">Used incorrectly it can harm<tspan x="24" dy="1.3em">your performance in Search.</tspan></text>

  <text x="8" y="626" font-size="13" fill="#5C6167">Google: most sites will not need this tool.</text>
</svg>
