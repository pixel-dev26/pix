<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" width="800" height="414" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The OWASP Top 10:2025, in order</title>
  <desc id="d">The current released order is Broken Access Control, Security Misconfiguration, Software Supply Chain Failures, Cryptographic Failures, Injection, Insecure Design, Authentication Failures, Software or Data Integrity Failures, Security Logging and Alerting Failures, and Mishandling of Exceptional Conditions. Server-side request forgery was merged into Broken Access Control, misconfiguration is now second, supply chain replaced Vulnerable and Outdated Components, and the tenth category is new.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">OWASP TOP 10:2025 &#8212; THE CURRENT RELEASED VERSION</text>

  <!-- 1 -->
  <rect x="14" y="54" width="382" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="48" width="382" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="42" cy="76" r="16" fill="#0F1115"/>
  <text x="42" y="82" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="70" y="74" font-size="15" font-weight="700" fill="#0F1115">Broken Access Control</text>
  <text x="70" y="92" font-size="12" fill="#6A6F75">Server-side request forgery was merged in here</text>
  <!-- 2 -->
  <rect x="14" y="120" width="382" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="114" width="382" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="42" cy="142" r="16" fill="#0F1115"/>
  <text x="42" y="148" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="70" y="140" font-size="15" font-weight="700" fill="#0F1115">Security Misconfiguration</text>
  <text x="70" y="158" font-size="12" fill="#6A6F75">Now second. Cheap to find, cheap to fix</text>
  <!-- 3 -->
  <rect x="14" y="186" width="382" height="56" rx="16" fill="#FDB914"/>
  <rect x="8" y="180" width="382" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="42" cy="208" r="16" fill="#0F1115"/>
  <text x="42" y="214" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="70" y="206" font-size="15" font-weight="700" fill="#0F1115">Software Supply Chain Failures</text>
  <text x="70" y="224" font-size="12" fill="#6A6F75">Was Vulnerable and Outdated Components</text>
  <!-- 4 -->
  <rect x="8" y="246" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="42" cy="274" r="16" fill="#8E959D"/>
  <text x="42" y="280" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">4</text>
  <text x="70" y="280" font-size="15" font-weight="700" fill="#0F1115">Cryptographic Failures</text>
  <!-- 5 -->
  <rect x="8" y="312" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="42" cy="340" r="16" fill="#8E959D"/>
  <text x="42" y="346" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">5</text>
  <text x="70" y="346" font-size="15" font-weight="700" fill="#0F1115">Injection</text>

  <!-- 6 -->
  <rect x="410" y="48" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="444" cy="76" r="16" fill="#8E959D"/>
  <text x="444" y="82" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">6</text>
  <text x="472" y="82" font-size="15" font-weight="700" fill="#0F1115">Insecure Design</text>
  <!-- 7 -->
  <rect x="410" y="114" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="444" cy="142" r="16" fill="#8E959D"/>
  <text x="444" y="148" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">7</text>
  <text x="472" y="148" font-size="15" font-weight="700" fill="#0F1115">Authentication Failures</text>
  <!-- 8 -->
  <rect x="410" y="180" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="444" cy="208" r="16" fill="#8E959D"/>
  <text x="444" y="214" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">8</text>
  <text x="472" y="214" font-size="15" font-weight="700" fill="#0F1115">Software or Data Integrity Failures</text>
  <!-- 9 -->
  <rect x="410" y="246" width="382" height="56" rx="16" fill="#F7F8F9" stroke="#8E959D" stroke-width="2"/>
  <circle cx="444" cy="274" r="16" fill="#8E959D"/>
  <text x="444" y="280" font-size="14" font-weight="700" fill="#0F1115" text-anchor="middle">9</text>
  <text x="472" y="280" font-size="15" font-weight="700" fill="#0F1115">Security Logging and Alerting Failures</text>
  <!-- 10 -->
  <rect x="416" y="318" width="382" height="56" rx="16" fill="#D098F9"/>
  <rect x="410" y="312" width="382" height="56" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <circle cx="444" cy="340" r="16" fill="#0F1115"/>
  <text x="444" y="346" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
  <text x="472" y="338" font-size="15" font-weight="700" fill="#0F1115">Mishandling of Exceptional Conditions</text>
  <text x="472" y="356" font-size="12" fill="#6A6F75">New category in this edition</text>

  <text x="8" y="400" font-size="14" fill="#5C6167">If a proposal still says OWASP Top 10 2021, you are buying last generation&#8217;s checklist.</text>
</svg>
