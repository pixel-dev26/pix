<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 376" width="800" height="376" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The three Core Web Vitals and their published good thresholds</title>
  <desc id="d">Largest Contentful Paint within 2.5 seconds, Interaction to Next Paint at 200 milliseconds or less, Cumulative Layout Shift at 0.1 or less. Each is measured at the 75th percentile of real page loads, with mobile and desktop kept separate. First Input Delay is gone; INP replaced it on 12 March 2024.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">PUBLISHED THRESHOLDS, NOT FOLKLORE</text>

  <rect x="14" y="46" width="246" height="176" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="246" height="176" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="30" y="62" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="61" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">LCP</text>
  <text x="30" y="114" font-size="14" fill="#5C6167">Largest Contentful Paint</text>
  <text x="30" y="164" font-size="36" font-weight="700" fill="#0F1115">2.5s</text>
  <text x="30" y="194" font-size="14" fill="#5C6167">or faster</text>

  <rect x="283" y="46" width="246" height="176" rx="16" fill="#4A90C7"/>
  <rect x="277" y="40" width="246" height="176" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="299" y="62" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="330" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">INP</text>
  <text x="299" y="114" font-size="14" fill="#5C6167">Interaction to Next Paint</text>
  <text x="299" y="164" font-size="36" font-weight="700" fill="#0F1115">200ms</text>
  <text x="299" y="194" font-size="14" fill="#5C6167">or less</text>

  <rect x="552" y="46" width="246" height="176" rx="16" fill="#D098F9"/>
  <rect x="546" y="40" width="246" height="176" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="568" y="62" width="62" height="26" rx="999" fill="#0F1115"/>
  <text x="599" y="80" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLS</text>
  <text x="568" y="114" font-size="14" fill="#5C6167">Cumulative Layout Shift</text>
  <text x="568" y="164" font-size="36" font-weight="700" fill="#0F1115">0.1</text>
  <text x="568" y="194" font-size="14" fill="#5C6167">or less</text>

  <rect x="14" y="256" width="784" height="104" rx="16" fill="#FDB914"/>
  <rect x="8" y="250" width="784" height="104" rx="16" fill="#F7F8F9" stroke="#0F1115" stroke-width="2"/>
  <text x="34" y="278" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">TWO THINGS THAT FOLLOW</text>
  <text x="34" y="304" font-size="15" fill="#5C6167">Measured at the 75th percentile of real page loads, mobile and desktop kept separate.</text>
  <text x="34" y="330" font-size="15" fill="#5C6167">First Input Delay is gone. INP replaced it as a Core Web Vital on 12 March 2024.</text>
</svg>
