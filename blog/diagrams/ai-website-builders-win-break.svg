<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 378" width="800" height="378" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Where AI website builders win, and the four places they break</title>
  <desc id="d">Two panels. Builders win on prototypes and validation, simple presence sites and speed of iteration. They break on four fronts: everything looks the same, machines cannot read the output, you do not own it, and the cost curve crosses.</desc>

  <text x="8" y="16" font-size="11" font-weight="700" letter-spacing="1" fill="#6A6F75">THREE WINS, FOUR BREAKS</text>

  <!-- where they win -->
  <rect x="14" y="46" width="380" height="290" rx="16" fill="#5FBFA8"/>
  <rect x="8" y="40" width="380" height="290" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="30" y="62" width="120" height="26" rx="999" fill="#0F1115"/>
  <text x="90" y="80" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUILDERS WIN</text>

  <circle cx="37" cy="140" r="7" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="58" y="146" font-size="17" font-weight="700" fill="#0F1115">Prototypes and validation</text>
  <text x="58" y="168" font-size="14" fill="#5C6167">Ship a test in a day, not six weeks</text>

  <circle cx="37" cy="210" r="7" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="58" y="216" font-size="17" font-weight="700" fill="#0F1115">Simple presence sites</text>
  <text x="58" y="238" font-size="14" fill="#5C6167">Hours, services, a contact form</text>

  <circle cx="37" cy="280" r="7" fill="#5FBFA8" stroke="#0F1115" stroke-width="2"/>
  <text x="58" y="286" font-size="17" font-weight="700" fill="#0F1115">Speed of iteration</text>
  <text x="58" y="308" font-size="14" fill="#5C6167">Copy and sections change in minutes</text>

  <!-- where they break -->
  <rect x="418" y="46" width="380" height="290" rx="16" fill="#EE3D41"/>
  <rect x="412" y="40" width="380" height="290" rx="16" fill="#FFFFFF" stroke="#0F1115" stroke-width="2"/>
  <rect x="434" y="62" width="192" height="26" rx="999" fill="#0F1115"/>
  <text x="530" y="80" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOUR PLACES THEY BREAK</text>

  <circle cx="447" cy="131" r="13" fill="#0F1115"/>
  <text x="447" y="136" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="472" y="137" font-size="17" font-weight="700" fill="#0F1115">Everything looks the same</text>
  <text x="472" y="159" font-size="14" fill="#5C6167">One template, three businesses</text>

  <circle cx="447" cy="179" r="13" fill="#0F1115"/>
  <text x="447" y="184" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="472" y="185" font-size="17" font-weight="700" fill="#0F1115">Machines cannot read it</text>
  <text x="472" y="207" font-size="14" fill="#5C6167">Thin HTML, heavy JavaScript</text>

  <circle cx="447" cy="227" r="13" fill="#0F1115"/>
  <text x="447" y="232" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="472" y="233" font-size="17" font-weight="700" fill="#0F1115">You do not own it</text>
  <text x="472" y="255" font-size="14" fill="#5C6167">No full export on most platforms</text>

  <circle cx="447" cy="275" r="13" fill="#0F1115"/>
  <text x="447" y="280" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="472" y="281" font-size="17" font-weight="700" fill="#0F1115">The cost curve crosses</text>
  <text x="472" y="303" font-size="14" fill="#5C6167">Cheaper on day one, not by year two</text>

  <text x="8" y="366" font-size="14" font-weight="700" fill="#0F1115">Speed over differentiation, use a builder. A revenue channel, build custom.</text>
</svg>
